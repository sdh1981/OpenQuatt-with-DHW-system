name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          # ESPHome lost een relatieve `build_path` op ten opzichte van de
          # .esphome-datadir, niet ten opzichte van de repo-root. De entrypoints
          # zetten `build_path: build/<naam>`, dus de artefacten belanden in
          # `.esphome/build/<naam>`.
          - id: duo-lilygo-tconnect-cic
            config: openquatt_duo_lilygo_tconnect+cic.yaml
            build_path: .esphome/build/openquatt_duo_lilygo_tconnect+cic
          - id: duo-lilygo-tconnect
            config: openquatt_duo_lilygo_tconnect.yaml
            build_path: .esphome/build/openquatt_duo_lilygo_tconnect

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-esphome.txt

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('.github/requirements-esphome.txt') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install ESPHome
        run: |
          ESPHOME_VERSION="$(cat .github/requirements-esphome.txt | sed 's/^esphome==//')"
          pip install --upgrade "esphome==${ESPHOME_VERSION}"
          esphome version

      - name: Validate config
        run: esphome config ${{ matrix.profile.config }}

      - name: Compile firmware
        run: esphome compile ${{ matrix.profile.config }}

      - name: Show build outputs
        if: always()
        run: |
          echo "Build path: ${{ matrix.profile.build_path }}"
          ls -la "${{ matrix.profile.build_path }}" || true
          find "${{ matrix.profile.build_path }}" -maxdepth 4 -type f -name "firmware*.bin" -print || true

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v6
        with:
          name: openquatt-${{ matrix.profile.id }}-firmware-${{ github.sha }}
          if-no-files-found: error
          # Verplicht hier: upload-artifact slaat sinds v4.4 standaard alles over
          # wat in een verborgen map ligt, en zowel `.esphome` als `.pioenvs`
          # begint met een punt. Zonder deze vlag vindt de stap niets, ook al
          # staan de bins er gewoon.
          include-hidden-files: true
          path: |
            ${{ matrix.profile.build_path }}/.pioenvs/**/firmware.bin
            ${{ matrix.profile.build_path }}/.pioenvs/**/firmware.ota.bin
            ${{ matrix.profile.build_path }}/.pioenvs/**/firmware.factory.bin
