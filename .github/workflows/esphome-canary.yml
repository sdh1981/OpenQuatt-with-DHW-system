name: ESPHome Canary

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install latest ESPHome
        run: |
          pip install --upgrade esphome
          esphome version

      # Alleen de entrypoints die in deze fork bestaan. De waveshare- en
      # listener-configs komen uit upstream en zijn hier verwijderd; daardoor
      # faalde deze canary elke maandag op "No such file or directory".
      - name: Validate configs
        run: |
          esphome config openquatt_duo_lilygo_tconnect.yaml
          esphome config "openquatt_duo_lilygo_tconnect+cic.yaml"

      - name: Compile configs
        run: |
          esphome compile openquatt_duo_lilygo_tconnect.yaml
          esphome compile "openquatt_duo_lilygo_tconnect+cic.yaml"
