name: Pages Deploy

# Automatische triggers uitgezet in deze fork.
#
# Deze workflow publiceert de upstream GitHub Pages-site met web installer.
# Dat werkt hier niet: GitHub Pages staat niet aan op deze repo en er zijn geen
# releases, terwijl de workflow daar de firmware-binaries uit haalt. Gevolg was
# een falende run -- en dus een mail -- bij elke wijziging in docs/.
#
# Bewust niet verwijderd: wil je de site alsnog, zet dan Pages aan, maak een
# release met *.firmware.factory.bin, en zet de push/release-triggers terug.
# Handmatig starten kan altijd via workflow_dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-pages:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout site source
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Download latest stable factory binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/pages-firmware
          gh release download \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "*.firmware.factory.bin" \
            --dir .tmp/pages-firmware \
            --clobber

      - name: Capture latest stable release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          RELEASE_URL="$(gh release view --repo "${GITHUB_REPOSITORY}" --json url --jq .url)"
          mkdir -p .tmp/pages-metadata
          cat > .tmp/pages-metadata/version.json <<EOF
          {
            "version": "${VERSION}",
            "release_url": "${RELEASE_URL}"
          }
          EOF

      - name: Assemble Pages site
        run: python3 scripts/dev.py prepare-pages-site site .tmp/pages-firmware

      - name: Add mirrored release metadata
        run: install -m 0644 .tmp/pages-metadata/version.json site/firmware/main/version.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build-pages

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
