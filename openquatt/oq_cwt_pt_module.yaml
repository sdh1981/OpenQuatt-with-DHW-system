  - platform: modbus_controller
    modbus_controller_id: cwt_pt_module
    id: cwt_pt_ch4_c
    name: "CWT Ch4 — DHW Coil Out"
    register_type: holding
    address: 0x6B
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
