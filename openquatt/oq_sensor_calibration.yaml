# ==============================================================================
# OpenQuatt – Temperatuursensor kalibratie (waterzijdig HP1/HP2)
# ==============================================================================
#
# Doel:
#   Bepaal en sla kalibratie-offsets op voor de 4 waterzijdige HP-temperatuur-
#   sensoren: HP1 water in/uit en HP2 water in/uit.
#
# Werkwijze:
#   1. Voorbereiding  — CM Override → Force CM1 (pomp loopt, geen compressor).
#   2. Meting         — firmware meet N seconden, middelt de 4 ruwe waarden,
#                        controleert spreiding en stoppe zodra stabiel genoeg.
#   3. Offsets toepassen — berekend als (referentie − gemiddelde).
#                        Referentie = gemiddelde van alle 4 gemiddelden.
#                        Opgeslagen als restore_value globals; na reboot
#                        actief via lambda-filter in oq_HP_io.yaml.
#
# Vereisten:
#   - oq_HP_io.yaml moet een lambda-filter toevoegen aan water_in_temp en
#     water_out_temp voor HP1 én HP2 die oq_cal_<hp_id>_in/out_offset optelt.
#   - Dit pakket moet VOOR oq_HP_io.yaml worden geladen (zie oq_packages_common.yaml).
#
# Kanttekeningen:
#   - "Supply verschil" = |water_supply_temp_selected − referentie|.
#     Dit is enkel diagnostisch: supply-sensor is niet onderhevig aan offset-correctie.
#   - Tijdens meting worden de rauwe sensorwaarden bijgehouden als
#     (calibrated_state − active_offset), zodat bestaande downstream-logica
#     ongestoord doorloopt.
#   - Minimale meetduur: oq_cal_min_samples × 1 s.
#   - Maximale meetduur: oq_cal_max_duration_s.
#   - Vroegtijdig stoppen zodra laatste 5 samples spread < oq_cal_spread_threshold_c.
#
# Entiteitsnamen (stabiel houden voor de web-app):
#   button:  sensor_cal_start, sensor_cal_stop, sensor_cal_apply, sensor_cal_reset
#   sensor:  sensor_cal_state_code, sensor_cal_remaining_s,
#            sensor_cal_hp1_in_raw, sensor_cal_hp1_out_raw,
#            sensor_cal_hp2_in_raw, sensor_cal_hp2_out_raw,
#            sensor_cal_spread, sensor_cal_supply_diff,
#            sensor_cal_reference,
#            sensor_cal_prop_hp1_in, sensor_cal_prop_hp1_out,
#            sensor_cal_prop_hp2_in, sensor_cal_prop_hp2_out,
#            hp1_water_in_cal_offset, hp1_water_out_cal_offset,
#            hp2_water_in_cal_offset, hp2_water_out_cal_offset
#   text_sensor: sensor_cal_state_text, sensor_cal_status_detail
#   number:  sensor_cal_max_duration, sensor_cal_spread_threshold
#
# ==============================================================================

# ----------------------------
# GLOBALS — actieve offsets (persistent)
# ----------------------------
globals:
  - id: oq_cal_hp1_in_offset
    type: float
    restore_value: true
    initial_value: '0.0'

  - id: oq_cal_hp1_out_offset
    type: float
    restore_value: true
    initial_value: '0.0'

  - id: oq_cal_hp2_in_offset
    type: float
    restore_value: true
    initial_value: '0.0'

  - id: oq_cal_hp2_out_offset
    type: float
    restore_value: true
    initial_value: '0.0'

  # ----------------------------
  # State machine (niet persistent)
  # 0 = Idle, 1 = Measuring, 2 = Result ready
  - id: oq_cal_state
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_cal_started_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # ----------------------------
  # Accumulatoren voor lopende gemiddelden
  - id: oq_cal_sum_hp1_in
    type: float
    restore_value: false
    initial_value: '0.0'

  - id: oq_cal_sum_hp1_out
    type: float
    restore_value: false
    initial_value: '0.0'

  - id: oq_cal_sum_hp2_in
    type: float
    restore_value: false
    initial_value: '0.0'

  - id: oq_cal_sum_hp2_out
    type: float
    restore_value: false
    initial_value: '0.0'

  - id: oq_cal_sample_count
    type: int
    restore_value: false
    initial_value: '0'

  # Rolling window voor spreiding (5 samples, circulaire buffer)
  - id: oq_cal_win_hp1_in
    type: std::array<float,5>
    restore_value: false
    initial_value: '{NAN,NAN,NAN,NAN,NAN}'

  - id: oq_cal_win_hp1_out
    type: std::array<float,5>
    restore_value: false
    initial_value: '{NAN,NAN,NAN,NAN,NAN}'

  - id: oq_cal_win_hp2_in
    type: std::array<float,5>
    restore_value: false
    initial_value: '{NAN,NAN,NAN,NAN,NAN}'

  - id: oq_cal_win_hp2_out
    type: std::array<float,5>
    restore_value: false
    initial_value: '{NAN,NAN,NAN,NAN,NAN}'

  - id: oq_cal_win_idx
    type: int
    restore_value: false
    initial_value: '0'

  # ----------------------------
  # Voorgestelde offsets (berekend bij meetafronding)
  - id: oq_cal_prop_hp1_in_f
    type: float
    restore_value: false
    initial_value: '0.0'

  - id: oq_cal_prop_hp1_out_f
    type: float
    restore_value: false
    initial_value: '0.0'

  - id: oq_cal_prop_hp2_in_f
    type: float
    restore_value: false
    initial_value: '0.0'

  - id: oq_cal_prop_hp2_out_f
    type: float
    restore_value: false
    initial_value: '0.0'

  - id: oq_cal_result_reference
    type: float
    restore_value: false
    initial_value: 'NAN'

  - id: oq_cal_result_spread
    type: float
    restore_value: false
    initial_value: 'NAN'

  - id: oq_cal_result_supply_diff
    type: float
    restore_value: false
    initial_value: 'NAN'

  # Live waarden tijdens meting (ruw, zonder offset)
  - id: oq_cal_live_hp1_in
    type: float
    restore_value: false
    initial_value: 'NAN'

  - id: oq_cal_live_hp1_out
    type: float
    restore_value: false
    initial_value: 'NAN'

  - id: oq_cal_live_hp2_in
    type: float
    restore_value: false
    initial_value: 'NAN'

  - id: oq_cal_live_hp2_out
    type: float
    restore_value: false
    initial_value: 'NAN'

  - id: oq_cal_live_spread
    type: float
    restore_value: false
    initial_value: 'NAN'

# ----------------------------
# TUNING
# ----------------------------
number:
  - platform: template
    id: sensor_cal_max_duration
    name: "Sensor Cal Max Duration"
    icon: mdi:timer-outline
    unit_of_measurement: "s"
    min_value: 60
    max_value: 600
    step: 10
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 300
    entity_category: config
    web_server:
      sorting_group_id: oq_service_cal

  - platform: template
    id: sensor_cal_spread_threshold
    name: "Sensor Cal Spread Threshold"
    icon: mdi:arrow-collapse-vertical
    unit_of_measurement: "°C"
    min_value: 0.10
    max_value: 1.00
    step: 0.05
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 0.25
    entity_category: config
    web_server:
      sorting_group_id: oq_service_cal

# ----------------------------
# BUTTONS
# ----------------------------
button:
  - platform: template
    id: sensor_cal_start
    name: "Sensor Cal Start"
    icon: mdi:play-circle-outline
    entity_category: config
    web_server:
      sorting_group_id: oq_service_cal
    on_press:
      - lambda: |-
          // Zet CM override op Force CM1 (pomp aan, geen compressor)
          if (id(oq_cm_override).has_state() &&
              id(oq_cm_override).current_option() != "Force CM1") {
            auto c = id(oq_cm_override).make_call();
            c.set_option("Force CM1");
            c.perform();
          }
          // Reset accumulatoren
          id(oq_cal_sum_hp1_in)  = 0.0f;
          id(oq_cal_sum_hp1_out) = 0.0f;
          id(oq_cal_sum_hp2_in)  = 0.0f;
          id(oq_cal_sum_hp2_out) = 0.0f;
          id(oq_cal_sample_count) = 0;
          id(oq_cal_win_idx) = 0;
          for (int i = 0; i < 5; i++) {
            id(oq_cal_win_hp1_in)[i]  = NAN;
            id(oq_cal_win_hp1_out)[i] = NAN;
            id(oq_cal_win_hp2_in)[i]  = NAN;
            id(oq_cal_win_hp2_out)[i] = NAN;
          }
          id(oq_cal_result_reference)  = NAN;
          id(oq_cal_result_spread)     = NAN;
          id(oq_cal_result_supply_diff) = NAN;
          id(oq_cal_started_ms) = (uint32_t) millis();
          id(oq_cal_state) = 1;

  - platform: template
    id: sensor_cal_stop
    name: "Sensor Cal Stop"
    icon: mdi:stop-circle-outline
    entity_category: config
    web_server:
      sorting_group_id: oq_service_cal
    on_press:
      - lambda: |-
          // Herstel CM Override naar Auto
          if (id(oq_cm_override).has_state() &&
              id(oq_cm_override).current_option() == "Force CM1") {
            auto c = id(oq_cm_override).make_call();
            c.set_option("Auto");
            c.perform();
          }
          id(oq_cal_state) = 0;

  - platform: template
    id: sensor_cal_apply
    name: "Sensor Cal Apply"
    icon: mdi:check-circle-outline
    entity_category: config
    web_server:
      sorting_group_id: oq_service_cal
    on_press:
      - lambda: |-
          // Pas voorgestelde offsets toe — alleen als resultaat beschikbaar
          if (id(oq_cal_state) != 2) return;
          id(oq_cal_hp1_in_offset)  = id(oq_cal_prop_hp1_in_f);
          id(oq_cal_hp1_out_offset) = id(oq_cal_prop_hp1_out_f);
          id(oq_cal_hp2_in_offset)  = id(oq_cal_prop_hp2_in_f);
          id(oq_cal_hp2_out_offset) = id(oq_cal_prop_hp2_out_f);
          id(hp1_water_in_cal_offset).publish_state(id(oq_cal_hp1_in_offset));
          id(hp1_water_out_cal_offset).publish_state(id(oq_cal_hp1_out_offset));
          id(hp2_water_in_cal_offset).publish_state(id(oq_cal_hp2_in_offset));
          id(hp2_water_out_cal_offset).publish_state(id(oq_cal_hp2_out_offset));
          // Herstel CM Override naar Auto
          if (id(oq_cm_override).has_state() &&
              id(oq_cm_override).current_option() == "Force CM1") {
            auto c = id(oq_cm_override).make_call();
            c.set_option("Auto");
            c.perform();
          }
          id(oq_cal_state) = 0;

  - platform: template
    id: sensor_cal_reset
    name: "Sensor Cal Reset Offsets"
    icon: mdi:restore
    entity_category: config
    web_server:
      sorting_group_id: oq_service_cal
    on_press:
      - lambda: |-
          // Wis alle actieve kalibratie-offsets
          id(oq_cal_hp1_in_offset)  = 0.0f;
          id(oq_cal_hp1_out_offset) = 0.0f;
          id(oq_cal_hp2_in_offset)  = 0.0f;
          id(oq_cal_hp2_out_offset) = 0.0f;
          id(hp1_water_in_cal_offset).publish_state(0.0f);
          id(hp1_water_out_cal_offset).publish_state(0.0f);
          id(hp2_water_in_cal_offset).publish_state(0.0f);
          id(hp2_water_out_cal_offset).publish_state(0.0f);
          id(oq_cal_state) = 0;

