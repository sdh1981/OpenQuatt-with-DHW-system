sensor:
  - platform: template
    id: cooling_stop_reason_code
    name: "Cooling Stop Reason Code"
    icon: mdi:identifier
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 5s
    lambda: |-
      return (float) id(oq_cooling_stop_reason_code);
    web_server:
      sorting_group_id: oq_system_diagnostics

  - platform: template
    id: cooling_supply_target
    name: "Cooling Supply Target"
    icon: mdi:target
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      // Cooling uses a simple cascade:
      // - the configured floor and dew-point-safe floor define the lowest allowed target
      // - room overshoot adds a fixed comfort offset above that floor
      // This keeps strong cooling possible when the room is clearly too warm,
      // but favors warmer water and calmer modulation near setpoint.
      float base_floor_c = id(cooling_min_supply_temp).state;
      if (id(cooling_effective_min_supply_temp).has_state() && !isnan(id(cooling_effective_min_supply_temp).state)) {
        base_floor_c = fmaxf(base_floor_c, id(cooling_effective_min_supply_temp).state);
      }

      // Comfort offset: raises the supply target when the room is already close to
      // setpoint (small error), giving slower but quieter cooling. When the room is
      // significantly above setpoint (large error > 1.2 K) the offset is removed so
      // the system can cool at full capacity. Fallback 0.8 K when room data unavailable.
      // Thresholds derived empirically for Dutch residential radiant floor/ceiling panels.
      float comfort_offset_c = 0.8f;
      if (id(room_temp_selected).has_state() && !isnan(id(room_temp_selected).state) &&
          id(room_setpoint_selected).has_state() && !isnan(id(room_setpoint_selected).state)) {
        const float room_error_c = id(room_temp_selected).state - id(room_setpoint_selected).state;
        if (room_error_c > 1.2f) comfort_offset_c = 0.0f;       // large overshoot  → no offset
        else if (room_error_c > 0.8f) comfort_offset_c = 0.4f;  // moderate overshoot
        else if (room_error_c > 0.4f) comfort_offset_c = 0.8f;  // small overshoot
        else if (room_error_c > 0.2f) comfort_offset_c = 1.2f;  // near setpoint
        else comfort_offset_c = 1.6f;                            // at/below setpoint → gentlest
      }

      // Outdoor correction: linear ramp starting at 28°C ambient, adding up to 1.5 K
      // of extra cooling below the comfort target. At 38°C outdoor the full 1.5 K is
      // applied (28 + 10 * 0.15 = 1.5). Clamped [0, 1.5] to avoid over-cooling on cool days.
      float outdoor_correction_c = 0.0f;
      if (id(outside_temp_selected).has_state() && !isnan(id(outside_temp_selected).state)) {
        outdoor_correction_c = std::max(0.0f, std::min(1.5f, (id(outside_temp_selected).state - 28.0f) * 0.15f));
      }

      float target_c = base_floor_c + comfort_offset_c - outdoor_correction_c;
      if (target_c < base_floor_c) target_c = base_floor_c;
      return target_c;
    web_server:
      sorting_group_id: oq_cooling

  - platform: template
    id: cooling_supply_error
    name: "Cooling Supply Error"
    icon: mdi:delta
    unit_of_measurement: "°C"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      if (!id(cooling_supply_target).has_state() || isnan(id(cooling_supply_target).state)) return NAN;
      if (!id(oq_system_supply_temp).has_state() || isnan(id(oq_system_supply_temp).state)) return NAN;
      // Positive error means the supply is warmer than target, so more cooling may be requested.
      return id(oq_system_supply_temp).state - id(cooling_supply_target).state;
    web_server:
      sorting_group_id: oq_cooling

  - platform: template
    id: oq_cooling_demand_raw_sensor
    name: "Cooling Demand (raw)"
    icon: mdi:speedometer-medium
    unit_of_measurement: "step"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    web_server:
      sorting_group_id: oq_cooling
    lambda: |-
      return (float) id(oq_cooling_demand_raw);

text_sensor:
  - platform: template
    id: cooling_stop_reason
    name: "Cooling Stop Reason"
    icon: mdi:information-outline
    update_interval: 5s
    lambda: |-
      switch (id(oq_cooling_stop_reason_code)) {
        case 1: return {"disabled"};
        case 2: return {"no_cooling_request"};
        case 3: return {"not_permitted"};
        case 4: return {"target_invalid"};
        case 5: return {"supply_invalid"};
        case 6: return {"demand_max_zero"};
        case 7: return {"safe_floor_stop"};
        case 8: return {"not_in_cm5"};
        case 9: return {"no_owner_available"};
        case 10: return {"dhw_active"};
        case 11: return {"night_free_cooling"};
        default: return {"running_or_idle_normal"};
      }
    web_server:
      sorting_group_id: oq_system_diagnostics

interval:
  - interval: 5s
    then:
      - lambda: |-
          // Safe-floor constants removed at user request.
          const float simmer_room_error_min_c = 0.20f;
          const float simmer_supply_error_max_c = 0.45f;

          // Resolve loop timing and reset the controller cleanly when cooling is not allowed.
          const uint32_t now_ms = (uint32_t) millis();
          float dt_s = 5.0f;
          if (id(oq_cooling_last_loop_ms) > 0 && now_ms > id(oq_cooling_last_loop_ms)) {
            dt_s = (float) (now_ms - id(oq_cooling_last_loop_ms)) / 1000.0f;
          }
          if (dt_s < 0.1f) dt_s = 0.1f;
          if (dt_s > 15.0f) dt_s = 15.0f;
          id(oq_cooling_last_loop_ms) = now_ms;

          const bool active =
              id(cooling_enable_selected).state &&
              id(cooling_request_active).state &&
              id(cooling_permitted).state;

          if (!active ||
              !id(cooling_supply_target).has_state() || isnan(id(cooling_supply_target).state) ||
              !id(oq_system_supply_temp).has_state() || isnan(id(oq_system_supply_temp).state)) {
            int stop_reason = 0;
            if (!id(cooling_enable_selected).state) stop_reason = 1;
            else if (!id(cooling_request_active).state) stop_reason = 2;
            else if (!id(cooling_permitted).state) stop_reason = 3;
            else if (!id(cooling_supply_target).has_state() || isnan(id(cooling_supply_target).state)) stop_reason = 4;
            else if (!id(oq_system_supply_temp).has_state() || isnan(id(oq_system_supply_temp).state)) stop_reason = 5;
            id(oq_cooling_stop_reason_code) = stop_reason;
            id(oq_cooling_demand_raw) = 0;
            id(oq_cooling_pid_integral) = 0.0f;
            id(oq_cooling_pid_last_error_c) = 0.0f;
            // Hard reset (cooling disabled or safety trip): clear min-runtime fully.
            // Soft stop (room request gone, stop_reason==2): keep min-runtime alive so
            // the heat-loop interval can still enforce the minimum compressor runtime and
            // prevent short-cycling / pendelen.
            const bool hard_reset =
                !id(cooling_enable_selected).state || !id(cooling_permitted).state;
            if (hard_reset) {
              id(oq_cooling_min_runtime_active) = false;
              id(oq_cooling_min_runtime_start_ms) = 0;
              id(oq_cooling_auto_dual_hp_enabled) = false;
              id(oq_cooling_auto_dual_hp_elapsed_accum_min) = 0.0f;
            }
            return;
          }

          // DHW conflict: stop cooling while DHW is active (valve in boiler position).
          // Exception: legionella element-only phase (oq_dhw_state_code==4 AND
          // oq_dhw_block_cv_priority==false). In this phase the HP is done, the
          // valve is already in CV position, and the element heats the tank
          // independently. The HP compressors are free to run in cooling mode
          // concurrently without any conflict.
          const bool legionella_element_only =
              (id(oq_dhw_state_code) == 4) && !id(oq_dhw_block_cv_priority);
          if (id(oq_dhw_state_code) != 0 && !legionella_element_only) {
            id(oq_cooling_stop_reason_code) = 10;
            id(oq_cooling_demand_raw) = 0;
            id(oq_cooling_pid_integral) = 0.0f;
            id(oq_cooling_pid_last_error_c) = 0.0f;
            id(oq_cooling_min_runtime_active) = false;
            id(oq_cooling_min_runtime_start_ms) = 0;
            id(oq_cooling_auto_dual_hp_enabled) = false;
            id(oq_cooling_auto_dual_hp_elapsed_accum_min) = 0.0f;
            return;
          }

          // Night/free cooling: outdoor is already cool enough, suppress active HP cooling.
          if (id(cooling_night_mode_active).state) {
            id(oq_cooling_stop_reason_code) = 11;
            id(oq_cooling_demand_raw) = 0;
            id(oq_cooling_pid_integral) = 0.0f;
            id(oq_cooling_pid_last_error_c) = 0.0f;
            return;
          }

          // Cooling PI(D): positive error means the system supply is still warmer than target.
          const float error_c = id(oq_system_supply_temp).state - id(cooling_supply_target).state;
          float kp = id(cooling_pid_kp).state;
          float ki = id(cooling_pid_ki).state;
          float kd = id(cooling_pid_kd).state;
          if (isnan(kp) || kp < 0.0f) kp = 0.0f;
          if (isnan(ki) || ki < 0.0f) ki = 0.0f;
          if (isnan(kd) || kd < 0.0f) kd = 0.0f;

          float integral = id(oq_cooling_pid_integral);

          float derivative = 0.0f;
          if (dt_s > 0.0f) {
            derivative = (error_c - id(oq_cooling_pid_last_error_c)) / dt_s;
          }

          float room_error_c = NAN;
          bool room_error_valid = false;
          if (id(room_temp_selected).has_state() && !isnan(id(room_temp_selected).state) &&
              id(room_setpoint_selected).has_state() && !isnan(id(room_setpoint_selected).state)) {
            room_error_c = id(room_temp_selected).state - id(room_setpoint_selected).state;
            room_error_valid = true;
          }

          int demand_max = (int) lroundf(id(cooling_demand_max_f).state);
          if (demand_max < 0) demand_max = 0;
          if (demand_max > 20) demand_max = 20;
          int stop_reason = 0;
          if (demand_max == 0) stop_reason = 6;
          if (room_error_valid) {
            if (room_error_c < 0.4f) demand_max = std::min(demand_max, 1);
            else if (room_error_c < 0.8f) demand_max = std::min(demand_max, 2);
            else if (room_error_c < 1.2f) demand_max = std::min(demand_max, 3);
          }

          // Keep the integrator from "sticking" to level 1 when the supply is already
          // at or below target, and stop winding up while the output is saturated high.
          const float out_before_integral_update = (kp * error_c) + (ki * integral) + (kd * derivative);
          if (error_c <= 0.0f) {
            integral = 0.0f;
          } else if (out_before_integral_update < (float) demand_max) {
            integral += error_c * dt_s;
          }
          if (integral < -20.0f) integral = -20.0f;
          if (integral > 20.0f) integral = 20.0f;

          float out = (kp * error_c) + (ki * integral) + (kd * derivative);
          if (out < 0.0f) out = 0.0f;
          int demand = (int) lroundf(out);
          if (demand < 0) demand = 0;
          if (demand > demand_max) demand = demand_max;

          // Safe-floor throttle removed at user request.
          // The dew-point-based supply floor no longer constrains the PID output.
          // WARNING: this disables the condensation safety. The system can now
          // target supply temperatures below the room dew point, which may cause
          // condensation on cold pipes / floor surfaces in humid conditions.

          // When the room still needs a little cooling and supply is already close to target,
          // prefer a gentle level-1 simmer over dropping to zero immediately.
          const bool can_simmer =
              (!room_error_valid || room_error_c > simmer_room_error_min_c) &&
              error_c > 0.0f && error_c <= simmer_supply_error_max_c;
          if (can_simmer) {
            if (demand < 1) demand = 1;
            if (demand > 1) demand = 1;
            integral = fminf(fmaxf(integral, 0.0f), 1.0f);
          }

          id(oq_cooling_pid_integral) = integral;
          id(oq_cooling_pid_last_error_c) = error_c;
          id(oq_cooling_demand_raw) = demand;
          // Keep stop_reason 7 (safe_floor_stop) even when demand=1 so the UI
          // shows the throttled state; only clear it when we're genuinely free-running.
          if (demand > 0 && stop_reason != 7) stop_reason = 0;
          id(oq_cooling_stop_reason_code) = stop_reason;

  - interval: ${oq_heat_loop_tick_s}s
    startup_delay: 4000ms
    then:
      - lambda: |-
          // Cooling strategy: owns single-owner cooling requests for CM5.
          const int cm_code = id(oq_control_mode_code);
          if (cm_code != 5) {
            id(oq_cooling_stop_reason_code) = 8;
            id(oq_cooling_request_last_loop_ms) = 0;
            id(oq_cooling_request_hp1_level) = 0;
            id(oq_cooling_request_hp2_level) = 0;
            id(oq_cooling_request_owner_hp) = 0;
            id(oq_cooling_owner_hp) = 0;
            id(oq_cooling_request_reason_code) = 0;
            id(oq_cooling_min_runtime_active) = false;
            id(oq_cooling_min_runtime_start_ms) = 0;
            id(oq_cooling_auto_dual_hp_elapsed_accum_min) = 0.0f;
            id(oq_cooling_auto_dual_hp_enabled) = false;
            id(oq_cooling_last_f) = 0;
            return;
          }

          const uint32_t now_ms = (uint32_t) millis();
          const uint32_t loop_target_ms = (uint32_t) (${oq_heat_loop_curve_s} * 1000UL);
          if (id(oq_cooling_request_last_loop_ms) > 0 && now_ms > id(oq_cooling_request_last_loop_ms)) {
            const uint32_t elapsed_ms = now_ms - id(oq_cooling_request_last_loop_ms);
            if (elapsed_ms < loop_target_ms) return;
          }
          id(oq_cooling_request_last_loop_ms) = now_ms;

          constexpr int max_level = 10;
          const int demand_max_f = (int) ${oq_strategy_demand_max_f};
          int raw = id(oq_cooling_demand_raw);
          raw = std::max(0, std::min(demand_max_f, raw));

          id(oq_demand_filtered_prev) = id(oq_demand_filtered);
          id(oq_demand_filtered) = raw;
          id(oq_heating_demand_filtered) = 0;

          int f = raw;
          int f_cap = id(oq_power_cap_f);
          f_cap = std::max(0, std::min(demand_max_f, f_cap));
          if (f > f_cap) f = f_cap;

          // Minimum runtime tracking (kept for consistency; minimum-level-1 logic below
          // ensures we rarely reach the min_runtime path anyway).
          const uint32_t min_rt_ms = (uint32_t)(id(cooling_min_runtime_s).state * 1000.0f);
          if (f > 0) {
            if (!id(oq_cooling_min_runtime_active)) {
              id(oq_cooling_min_runtime_active) = true;
              id(oq_cooling_min_runtime_start_ms) = now_ms;
            }
          } else if (id(oq_cooling_min_runtime_active) && min_rt_ms > 0) {
            const uint32_t elapsed_ms = (now_ms >= id(oq_cooling_min_runtime_start_ms))
                ? (now_ms - id(oq_cooling_min_runtime_start_ms)) : 0;
            if (elapsed_ms < min_rt_ms) {
              f = 1;
            } else {
              id(oq_cooling_min_runtime_active) = false;
              id(oq_cooling_min_runtime_start_ms) = 0;
            }
          }
          if (f == 0) {
            id(oq_cooling_min_runtime_active) = false;
            id(oq_cooling_min_runtime_start_ms) = 0;
          }

          // Minimum level 1 in CM5: the compressor never fully stops during active cooling.
          // Instead of cycling off and on, it idles at level 1 until demand returns.
          // Only hard conditions (cooling disabled, safety trip, or DHW conflict) allow f=0.
          // Exception: legionella element-only phase — valve is in CV, HP is free to cool.
          const bool legionella_element_only_hl =
              (id(oq_dhw_state_code) == 4) && !id(oq_dhw_block_cv_priority);
          const bool hard_cooling_stop =
              !id(cooling_enable_selected).state ||
              !id(cooling_permitted).state ||
              (id(oq_dhw_state_code) != 0 && !legionella_element_only_hl);
          if (!hard_cooling_stop && f < 1) {
            f = 1;
            if (!id(oq_cooling_min_runtime_active)) {
              id(oq_cooling_min_runtime_active) = true;
              id(oq_cooling_min_runtime_start_ms) = now_ms;
            }
          }

          // Slew rate limiter: max ±1 level step per loop tick.
          // Prevents the compressor from jumping e.g. 1→4 in one shot when the PID
          // overshoots. The compressor steps through intermediate levels, giving the
          // supply temperature time to respond before the next step.
          // Exception: starting from 0 → allow jump to 1 (first start is always immediate).
          {
            const int last_f = id(oq_cooling_last_f);
            if (last_f > 0 && f > 0) {
              if (f > last_f + 1) f = last_f + 1;
              if (f < last_f - 1) f = last_f - 1;
            }
            id(oq_cooling_last_f) = f;
          }

          // Auto dual-HP: escalate to dual HP when demand is sustained above threshold for 10 min.
          const int auto_dual_thresh = (int)lroundf(id(cooling_auto_dual_demand_threshold).state);
          if (f >= auto_dual_thresh && f > 0) {
            id(oq_cooling_auto_dual_hp_elapsed_accum_min) += (float)loop_target_ms / 60000.0f;
            if (id(oq_cooling_auto_dual_hp_elapsed_accum_min) >= 10.0f) {
              id(oq_cooling_auto_dual_hp_enabled) = true;
            }
          } else {
            id(oq_cooling_auto_dual_hp_elapsed_accum_min) = 0.0f;
            if (f == 0) id(oq_cooling_auto_dual_hp_enabled) = false;
          }

          #if OQ_TOPOLOGY_DUO
          const bool lead_is_hp1 = (id(hp1_minutes) <= id(${cc_secondary_minutes_id}));
          #else
          const bool lead_is_hp1 = true;
          #endif

          const int lead_code = lead_is_hp1 ? 1 : 2;
          if (id(oq_last_lead_hp) != lead_code) id(oq_last_lead_hp) = lead_code;

          auto excluded_levels = [&](bool is_hp1)->oq_request::ExcludedLevels {
            if (is_hp1) {
              return oq_request::ExcludedLevels{
                  id(hp1_excluded_level_a).has_state()
                      ? id(hp1_excluded_level_a).current_option()
                      : std::string("None"),
                  id(hp1_excluded_level_b).has_state()
                      ? id(hp1_excluded_level_b).current_option()
                      : std::string("None"),
              };
            }
            #if OQ_TOPOLOGY_DUO
            return oq_request::ExcludedLevels{
                id(${cc_secondary_excluded_level_a_id}).has_state()
                    ? id(${cc_secondary_excluded_level_a_id}).current_option()
                    : std::string("None"),
                id(${cc_secondary_excluded_level_b_id}).has_state()
                    ? id(${cc_secondary_excluded_level_b_id}).current_option()
                    : std::string("None"),
            };
            #else
            (void) is_hp1;
            return oq_request::ExcludedLevels{"None", "None"};
            #endif
          };

          auto level_allowed = [&](bool is_hp1, int level)->bool {
            return oq_request::level_allowed_for_excluded_levels(excluded_levels(is_hp1), level);
          };

          auto hp_has_any_allowed_level = [&](bool is_hp1)->bool {
            for (int lvl = 1; lvl <= max_level; lvl++) {
              if (level_allowed(is_hp1, lvl)) return true;
            }
            return false;
          };

          auto hp_restart_blocked = [&](bool is_hp1)->bool {
            const int prev_applied = is_hp1 ? id(hp1_last_applied_level) : id(${cc_secondary_last_applied_level_id});
            if (prev_applied > 0) return false;

            int min_off_s = (int) ${oq_hp_min_off_s};
            if (min_off_s <= 0) return false;

            const uint32_t last_stop_ms = is_hp1 ? id(hp1_last_stop_ms) : id(${cc_secondary_last_stop_ms_id});
            if (last_stop_ms == 0 || now_ms <= last_stop_ms) return false;

            const uint32_t min_off_ms = (uint32_t) min_off_s * 1000UL;
            return (uint32_t)(now_ms - last_stop_ms) < min_off_ms;
          };

          auto hp_can_take_cooling_start = [&](bool is_hp1)->bool {
            return hp_has_any_allowed_level(is_hp1) && !hp_restart_blocked(is_hp1);
          };

          auto hp_last_activity_ms = [&](bool is_hp1)->uint32_t {
            const uint32_t last_start_ms =
                is_hp1 ? id(hp1_last_start_ms) : id(${cc_secondary_last_start_ms_id});
            const uint32_t last_stop_ms =
                is_hp1 ? id(hp1_last_stop_ms) : id(${cc_secondary_last_stop_ms_id});
            return std::max(last_start_ms, last_stop_ms);
          };

          int hp1_req = 0;
          int hp2_req = 0;
          int owner = 0;
          int hp2_assist_level = (int) lroundf(id(cooling_hp2_assist_level).state);
          if (hp2_assist_level < 0) hp2_assist_level = 0;
          if (hp2_assist_level > max_level) hp2_assist_level = max_level;
          // Auto dual-HP overrides manual assist level when demand is sustained high.
          if (id(oq_cooling_auto_dual_hp_enabled) && hp2_assist_level == 0) {
            hp2_assist_level = std::min(f, 3);
          }

          #if OQ_TOPOLOGY_DUO
          const bool demand_active = (f > 0);
          const bool prev_hp1_on = (id(hp1_last_applied_level) > 0);
          const bool prev_hp2_on = (id(${cc_secondary_last_applied_level_id}) > 0);
          const bool hp1_can_start_cooling = hp_can_take_cooling_start(true);
          const bool hp2_can_start_cooling = hp_can_take_cooling_start(false);
          const uint32_t hp1_last_active_ms = hp_last_activity_ms(true);
          const uint32_t hp2_last_active_ms = hp_last_activity_ms(false);
          const int recent_owner =
              (hp1_last_active_ms > hp2_last_active_ms) ? 1 :
              (hp2_last_active_ms > hp1_last_active_ms) ? 2 : 0;

          owner = id(oq_cooling_owner_hp);
          if (!demand_active) {
            owner = 0;
          } else if (prev_hp1_on && !prev_hp2_on) {
            owner = 1;
          } else if (prev_hp2_on && !prev_hp1_on) {
            owner = 2;
          } else {
            const bool owner_ok =
                (owner == 1 && hp1_can_start_cooling) ||
                (owner == 2 && hp2_can_start_cooling);
            if (!owner_ok) {
              if (recent_owner == 1 && hp1_can_start_cooling) owner = 1;
              else if (recent_owner == 2 && hp2_can_start_cooling) owner = 2;
              else if (lead_is_hp1 && hp1_can_start_cooling) owner = 1;
              else if (!lead_is_hp1 && hp2_can_start_cooling) owner = 2;
              else if (hp1_can_start_cooling && !hp2_can_start_cooling) owner = 1;
              else if (hp2_can_start_cooling && !hp1_can_start_cooling) owner = 2;
              else if (hp1_can_start_cooling && hp2_can_start_cooling) owner = lead_is_hp1 ? 1 : 2;
              else owner = 0;
            }
          }

          oq_request::reset_dual_runtime_state(
              id(oq_dual_hp_enabled),
              id(oq_dual_hp_enable_hold_elapsed_accum_min),
              id(oq_dual_hp_disable_hold_elapsed_accum_min),
              id(oq_dual_hp_emergency_hold_elapsed_accum_min),
              id(oq_cooling_owner_hp),
              id(oq_duo_request_hold_until_ms),
              owner);
          if (owner == 1) hp1_req = f;
          else if (owner == 2) hp2_req = f;

          // Optional manual cooling assist:
          // keep owner logic unchanged, but allow the non-owner compressor to assist.
          if (f > 0 && hp2_assist_level > 0) {
            const int assist_req = std::min(f, hp2_assist_level);
            if (owner == 1) {
              const bool hp2_can_assist =
                  hp2_can_start_cooling || (id(${cc_secondary_last_applied_level_id}) > 0);
              if (hp2_can_assist && assist_req > hp2_req) hp2_req = assist_req;
            } else if (owner == 2) {
              const bool hp1_can_assist =
                  hp1_can_start_cooling || (id(hp1_last_applied_level) > 0);
              if (hp1_can_assist && assist_req > hp1_req) hp1_req = assist_req;
            }
          }
          #else
          oq_request::reset_dual_runtime_state(
              id(oq_dual_hp_enabled),
              id(oq_dual_hp_enable_hold_elapsed_accum_min),
              id(oq_dual_hp_disable_hold_elapsed_accum_min),
              id(oq_dual_hp_emergency_hold_elapsed_accum_min),
              id(oq_cooling_owner_hp),
              id(oq_duo_request_hold_until_ms),
              1);
          owner = (f > 0) ? 1 : 0;
          hp1_req = f;
          hp2_req = 0;
          #endif

          id(oq_P_hp_cap_w) = 0.0f;
          id(oq_P_deficit_w) = 0.0f;

          id(oq_cooling_request_hp1_level) = hp1_req;
          id(oq_cooling_request_hp2_level) = hp2_req;
          id(oq_cooling_request_owner_hp) = owner;
          if (f > 0 && (hp1_req + hp2_req) <= 0) id(oq_cooling_stop_reason_code) = 9;
          if (owner == 1) id(oq_cooling_request_reason_code) = 1;
          else if (owner == 2) id(oq_cooling_request_reason_code) = 2;
          else id(oq_cooling_request_reason_code) = 0;

          id(oq_strategy_phase_code) = (f > 0) ? 1 : 0;
          id(oq_strategy_requested_power_w) = NAN;
          id(oq_strategy_supply_target_temp) = id(cooling_supply_target).state;
          id(oq_strategy_heat_request_active) = (f > 0);
          id(oq_strategy_phase_text).publish_state((f > 0) ? "cool" : "idle");

          char debug_buf[160];
          snprintf(
            debug_buf, sizeof(debug_buf),
            "cool f=%d raw=%d owner=%d target=%.2f",
            f, raw, owner, id(cooling_supply_target).state);
          id(oq_strategy_debug_state).publish_state(debug_buf);
