  # De enige afwijking die een koud huis oplevert. Elk ander verschil is een
  # keuze die je kunt wegen; deze niet. Blijft 0 tot de frequentietabel er is.
  # De ondergrens waar de vraag op blijft hangen tijdens room_recovery: het
  # thermisch vermogen van de laagste stand die je toestaat. Leeg als hij niet telt.
