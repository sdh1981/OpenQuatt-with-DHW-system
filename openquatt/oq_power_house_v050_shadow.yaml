# ==============================================================================
# OpenQuatt - Power House v0.50.0 in SCHADUW
# ==============================================================================
#
# Upstream's Power House (v0.50.0) als tweede motor. Beide motoren rekenen
# altijd; "Power House engine" bepaalt wie de aanvraag mag schrijven. Staat hij
# op fork, dan is dit een schaduwberekening die niets aanstuurt.
#
# De entiteitsnamen houden het woord "schaduw" -- die zijn niet hernoemd toen de
# omschakelaar erbij kwam, zodat dashboards en historie blijven werken. "Power
# House motor" zegt wie er werkelijk stuurt.
#
# Zie openquatt/includes/oq_power_house_v050_shadow.h,
# openquatt/includes/oq_power_house_engine.h,
# docs/power-house-v050-overname.md en
# docs/power-house-v050-stap3-omschakelaar.md.
#
# Waar kijken:
#   "wijkt af" en "verschil"   waar en hoe de keuze verschilt van de huidige
#   "afwijkend (min)"          opgeteld, sinds de laatste herstart
#   "zou niets starten (min)"  hij zou stilstaan terwijl er wél gestookt wordt
#                              en de kamer onder setpoint zit -- moet 0 blijven
#   "standwissels HPx"         hoe vaak de keuze beweegt, per voortschrijdend uur
#   "reden"                    waarom de v0.50-dispatch deze keuze maakt
#   "snelle start"             room_demand / setpoint_raise als hij direct zou starten
#   "HPx frequentietabel"      de Hz per stand zoals de ODU ze nu gebruikt
#
# Bijwerking die wel echt is: deze package leest elke 15 min per HP 22 registers
# (de frequentietabel). Dat is een leesopdracht, overgeslagen tijdens een
# EEPROM-dump.
# ==============================================================================

interval:
  - interval: ${oq_heat_loop_tick_s}s
    startup_delay: 10s
    then:
      - lambda: |-
          const uint32_t now_ms = (uint32_t) millis();
          const bool dump_busy = id(hp1_odu_eeprom_dump).is_active() || id(hp2_odu_eeprom_dump).is_active();
          oq_odu_runtime_frequency::snapshot_reader(true).poll(id(hp1), now_ms, dump_busy);
          oq_odu_runtime_frequency::snapshot_reader(false).poll(id(hp2), now_ms, dump_busy);

          oq_ph_v050::shadow().tick({
              (uint32_t) ${oq_ph_demand_loop_s} * 1000UL,
              (uint32_t) ${oq_hp_min_off_s} * 1000UL,
              (int) ${oq_strategy_demand_max_f},
              ${oq_temp_guard_delta_c}f,
              ${oq_defrost_power_factor}f,
              ${oq_optimizer_soft_w}f,
              ${oq_power_peak_w}f,
              ${oq_optimizer_penalty_per_w}f,
              ${oq_optimizer_topology_power_margin_w}f,
              ${oq_optimizer_topology_heat_advantage_w}f,
              (int) roundf(${oq_defrost_comp_min_f}),
              (int) roundf(${oq_defrost_comp_boost_steps}),
          });

          // ----- Wie stuurt er -----
          // Deze aanroep is ook de hartslag voor de waakhond: hoort de fork hier
          // een minuut niets van, dan neemt hij het over.
          const auto &o = oq_ph_v050::shadow().output();
          const bool tables_known = oq_odu_runtime_frequency::snapshot_reader(true).known() &&
                                    oq_odu_runtime_frequency::snapshot_reader(false).known();
          const bool handover_blocked = id(hp1_4_way_valve).state || id(hp2_4_way_valve).state ||
                                        id(hp1_prot_oil_return).state || id(hp2_prot_oil_return).state;
          const uint8_t selected = (id(oq_ph_engine_select).has_state() &&
                                    id(oq_ph_engine_select).current_option() == "v0.50")
                                       ? oq_ph_engine::V050
                                       : oq_ph_engine::FORK;
          const bool compressors_running =
              id(hp1_last_applied_level) > 0 || id(hp2_last_applied_level) > 0;
          oq_ph_engine::decide_owner({now_ms, selected, o.active, o.output_valid, tables_known, handover_blocked,
                                      compressors_running, o.starving});

          // ----- Aansturen -----
          // Alleen als deze motor eigenaar is. De fork-lus schrijft dan niet en
          // blijft doorrekenen; zie openquatt/includes/oq_power_house_engine.h.
          // Ook bij een hold publiceren: de dispatch geeft dan de vastgehouden
          // standen terug, en dat is beter dan een bevroren oude aanvraag.
          if (oq_ph_engine::v050_drives(now_ms) && o.active) {
            const auto levels = oq_ph_engine::settle_clamp(now_ms, id(hp1_last_applied_level),
                                                           id(hp2_last_applied_level), o.hp1_level, o.hp2_level);
            id(oq_ph_request_hp1_level) = levels.hp1;
            id(oq_ph_request_hp2_level) = levels.hp2;
            id(oq_ph_request_owner_hp) = o.owner_hp;
            // 6 = hold_active: de begrenzing na een wissel, niet de dispatchreden.
            id(oq_ph_request_reason_code) =
                (levels.hp1 != o.hp1_level || levels.hp2 != o.hp2_level) ? 6 : o.reason;
            id(oq_demand_filtered) = o.demand;
            id(oq_heating_demand_filtered) = o.demand;
            // De strategie-interface waar de supervisory op beslist of hij uit
            // CM0 mag komen. oq_strategy_requested_power_w voedt de
            // low-load-grendel: die laat pas los boven het thermisch vermogen van
            // de laagste stand. Stond hier het vermogen van de andere motor, dan
            // vraagt v0.50 warmte terwijl de supervisory naar de fork kijkt.
            const bool heat = o.demand > 0;
            id(oq_strategy_phase_code) = heat ? 1 : 0;
            id(oq_strategy_requested_power_w) = o.requested_w;
            id(oq_strategy_supply_target_temp) = NAN;
            id(oq_strategy_heat_request_active) = heat;
            const char* phase = heat ? "heat" : "idle";
            if (id(oq_strategy_phase_text).state != phase) id(oq_strategy_phase_text).publish_state(phase);
          }

select:
  - platform: template
    id: oq_ph_engine_select
    name: "Power House engine"
    icon: mdi:engine-outline
    optimistic: true
    restore_value: true
    options:
      - "fork"
      - "v0.50"
    initial_option: "v0.50"
    entity_category: config
    web_server:
      sorting_group_id: oq_power_house_v050
      sorting_weight: 0

sensor:
  - platform: template
    id: oq_ph_v050_hp1_level
    name: "PH v0.50 schaduw - HP1 stand"
    icon: mdi:ghost-outline
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      const auto &o = oq_ph_v050::shadow().output();
      return o.active ? (float) o.hp1_level : NAN;
    web_server:
      sorting_group_id: oq_power_house_v050
      sorting_weight: 10

