binary_sensor:
  - platform: template
    id: oq_ph_v050_differs
    name: "PH v0.50 schaduw - wijkt af"
    icon: mdi:compare-horizontal
    entity_category: diagnostic
    lambda: |-
      const auto &o = oq_ph_v050::shadow().output();
      return o.active && o.differs;
    web_server:
      sorting_group_id: oq_power_house_v050
      sorting_weight: 1

text_sensor:
  - platform: template
    id: oq_ph_v050_difference
    name: "PH v0.50 schaduw - verschil (huidig -> v0.50)"
    icon: mdi:compare
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      return oq_ph_v050::difference_text();
    web_server:
      sorting_group_id: oq_power_house_v050
      sorting_weight: 2

  - platform: template
    id: oq_ph_v050_reason
    name: "PH v0.50 schaduw - reden"
    icon: mdi:head-question-outline
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      const auto &o = oq_ph_v050::shadow().output();
      if (!o.active) return std::string("inactief");
      return std::string(oq_power_house_dispatch::request_reason_name(o.reason));
    web_server:
      sorting_group_id: oq_power_house_v050
      sorting_weight: 12

  - platform: template
    id: oq_ph_v050_intent
    name: "PH v0.50 schaduw - snelle start"
    icon: mdi:run-fast
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      const auto &o = oq_ph_v050::shadow().output();
      if (!o.active) return std::string("inactief");
      return std::string(oq_heat_intent::reason_name(static_cast<oq_heat_intent::Reason>(o.intent)));
    web_server:
      sorting_group_id: oq_power_house_v050
      sorting_weight: 13

  # "snelle start" hierboven staat per definitie op none zodra er een compressor
  # draait. Deze staat er altijd, en verklaart daarmee het vlakke vermogen:
  # tijdens room_recovery ligt er een ondergrens op de vraag.
  - platform: template
    id: oq_ph_v050_intent_reason
    name: "PH v0.50 schaduw - startintentie"
    icon: mdi:target
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      const auto &o = oq_ph_v050::shadow().output();
      if (!o.active) return std::string("inactief");
      return std::string(oq_heat_intent::reason_name(static_cast<oq_heat_intent::Reason>(o.intent_reason)));
    web_server:
      sorting_group_id: oq_power_house_v050
      sorting_weight: 14

  - platform: template
    id: oq_ph_engine_active
    name: "Power House motor"
    icon: mdi:engine-outline
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      const uint32_t now_ms = (uint32_t) millis();
      const auto &s = oq_ph_engine::state();
      const bool fork = oq_ph_engine::fork_drives(now_ms);
      std::string text = fork ? std::string("fork stuurt") : std::string("v0.50 stuurt");
      // Bewust zonder settling(): die zet het venster uit als bijwerking, en een
      // sensor hoort niets te veranderen.
      if (s.settle_armed && (uint32_t)(now_ms - s.owner_since_ms) < oq_ph_engine::kSettleMs)
        text += " (omschakelen)";
      const char *why = (fork && s.owner == oq_ph_engine::V050)
                            ? oq_ph_engine::fallback_name(oq_ph_engine::WATCHDOG)
                            : oq_ph_engine::fallback_name(s.fallback);
      if (why[0] != '\0') text += std::string(" - ") + why;
      return text;
    web_server:
      sorting_group_id: oq_power_house_v050
      sorting_weight: 0

  - platform: template
    id: oq_ph_v050_hp1_table
    name: "PH v0.50 - HP1 frequentietabel verwarmen"
    icon: mdi:table
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return oq_ph_v050::heating_table_text(true);
    web_server:
      sorting_group_id: oq_power_house_v050
      sorting_weight: 40

  - platform: template
    id: oq_ph_v050_hp2_table
    name: "PH v0.50 - HP2 frequentietabel verwarmen"
    icon: mdi:table
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return oq_ph_v050::heating_table_text(false);
    web_server:
      sorting_group_id: oq_power_house_v050
      sorting_weight: 41
