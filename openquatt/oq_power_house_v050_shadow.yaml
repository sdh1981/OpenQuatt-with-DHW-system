  - platform: template
    id: oq_ph_v050_reason
    name: "PH v0.50 schaduw - reden"
    icon: mdi:head-question-outline
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      const auto &o = oq_ph_v050::shadow().output();
      if (!o.active) return std::string("inactief");
      return std::string(oq_power_house_dispatch::request_reason_name(o.reason));
    web_server:
      sorting_group_id: oq_power_house_v050
