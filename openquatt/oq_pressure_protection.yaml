# ==============================================================================
# OpenQuatt - Pressure Protection (R32, v0.32)
# ==============================================================================
#
# Goal:
#   Smart per-HP high-pressure protection that complements the heat-pump's
#   built-in HPS trip. Acts well before the hardware safety so the user
#   never sees an HPS fault during normal operation.
#
# Tier behaviour:
#   - Below soft_bar (default 38 bar): no action, normal operation
#   - soft_bar..hard_bar: cap level at max_lvl - 1, log soft event
#   - hard_bar..hps_bar: cap level at 0, log hard event (compressor stops)
#   - hps_bar (default 41 bar) is an OpenQuatt safety mirror of the HP HPS
#
# Output:
#   - oq_pressure_max_level_hp1 / hp2 (int) — per-HP cap consumed by the
#     thermal_actuator's level_cap calculation. 10 = no cap, 0 = stop.
#
# Diagnostics:
#   - Live peak EMA per HP (trend monitoring for fouling)
#   - Event counters (soft / hard / HPS) per 24h and lifetime
#   - Warning binary sensors
# ==============================================================================

globals:
  # Per-HP level cap set by the protection logic.
  - id: oq_pressure_max_level_hp1
    type: int
    restore_value: false
    initial_value: '10'
  - id: oq_pressure_max_level_hp2
    type: int
    restore_value: false
    initial_value: '10'

  # Peak condenser pressure EMA per HP — trend for fouling / aging.
  - id: oq_pressure_peak_ema_hp1
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: oq_pressure_peak_ema_hp2
    type: float
    restore_value: true
    initial_value: '0.0'

  # 24h event counters per tier.
  - id: oq_pressure_soft_events_24h
    type: int
    restore_value: true
    initial_value: '0'
  - id: oq_pressure_hard_events_24h
    type: int
    restore_value: true
    initial_value: '0'
  - id: oq_pressure_hps_events_24h
    type: int
    restore_value: true
    initial_value: '0'
  - id: oq_pressure_events_window_start_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Lifetime counters.
  - id: oq_pressure_soft_events_total
    type: int
    restore_value: true
    initial_value: '0'
  - id: oq_pressure_hard_events_total
    type: int
    restore_value: true
    initial_value: '0'
  - id: oq_pressure_hps_events_total
    type: int
    restore_value: true
    initial_value: '0'

  # Edge-tracking: which tier was the HP in last tick (to count rising edges).
  - id: oq_pressure_hp1_prev_tier
    type: int
    restore_value: false
    initial_value: '0'
  - id: oq_pressure_hp2_prev_tier
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_pressure_last_loop_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

switch:
  - platform: template
    id: oq_pressure_protection_enable
    name: "Pressure protection enable"
    icon: mdi:gauge-low
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action: []
    turn_off_action: []
    web_server:
      sorting_group_id: oq_pressure_protection

number:
  # Soft cap threshold — below this nothing happens. Default 38 bar.
  - platform: template
    id: oq_pressure_soft_bar
    name: "Pressure soft cap"
    icon: mdi:gauge
    unit_of_measurement: "bar"
    min_value: 30.0
    max_value: 42.0
    step: 0.5
    optimistic: true
    restore_value: true
    initial_value: 38.0
    entity_category: config
    web_server:
      sorting_group_id: oq_pressure_protection

  # Hard cap threshold — level goes to 0. Default 40 bar.
  - platform: template
    id: oq_pressure_hard_bar
    name: "Pressure hard cap"
    icon: mdi:gauge-full
    unit_of_measurement: "bar"
    min_value: 35.0
    max_value: 43.0
    step: 0.5
    optimistic: true
    restore_value: true
    initial_value: 40.0
    entity_category: config
    web_server:
      sorting_group_id: oq_pressure_protection

  # HPS mirror threshold — should match (or be just below) the HP's own
  # high-pressure switch trip point. Used purely for event logging.
  - platform: template
    id: oq_pressure_hps_bar
    name: "Pressure HPS mirror"
    icon: mdi:alert-octagon
    unit_of_measurement: "bar"
    min_value: 38.0
    max_value: 45.0
    step: 0.5
    optimistic: true
    restore_value: true
    initial_value: 41.0
    entity_category: config
    web_server:
      sorting_group_id: oq_pressure_protection

  # Soft-cap level reduction (how many levels below current cap).
  - platform: template
    id: oq_pressure_soft_cap_reduce
    name: "Pressure soft cap reduce levels"
    icon: mdi:stairs-down
    min_value: 1
    max_value: 4
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 1
    entity_category: config
    web_server:
      sorting_group_id: oq_pressure_protection

button:
  - platform: template
    id: oq_pressure_reset_counters_button
    name: "Pressure reset event counters"
    icon: mdi:restart
    web_server:
      sorting_group_id: oq_pressure_protection
    on_press:
      - lambda: |-
          id(oq_pressure_soft_events_24h) = 0;
          id(oq_pressure_hard_events_24h) = 0;
          id(oq_pressure_hps_events_24h) = 0;
          id(oq_pressure_soft_events_total) = 0;
          id(oq_pressure_hard_events_total) = 0;
          id(oq_pressure_hps_events_total) = 0;
          ESP_LOGI("oq_pressure", "Pressure event counters reset.");

  - platform: template
    id: oq_pressure_reset_ema_button
    name: "Pressure reset peak EMA"
    icon: mdi:restart-alert
    web_server:
      sorting_group_id: oq_pressure_protection
    on_press:
      - lambda: |-
          id(oq_pressure_peak_ema_hp1) = 0.0f;
          id(oq_pressure_peak_ema_hp2) = 0.0f;
          ESP_LOGI("oq_pressure", "Pressure peak EMA reset.");

sensor:
  - platform: template
    id: oq_pressure_peak_ema_hp1_sensor
    name: "Pressure HP1 peak EMA"
    icon: mdi:gauge
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_pressure_protection
    lambda: |-
      return id(oq_pressure_peak_ema_hp1);

  - platform: template
    id: oq_pressure_peak_ema_hp2_sensor
    name: "Pressure HP2 peak EMA"
    icon: mdi:gauge
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_pressure_protection
    lambda: |-
      #if OQ_TOPOLOGY_DUO
      return id(oq_pressure_peak_ema_hp2);
      #else
      return NAN;
      #endif

  - platform: template
    id: oq_pressure_max_level_hp1_sensor
    name: "Pressure HP1 level cap"
    icon: mdi:stairs
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_pressure_protection
    lambda: |-
      return (float) id(oq_pressure_max_level_hp1);

  - platform: template
    id: oq_pressure_max_level_hp2_sensor
    name: "Pressure HP2 level cap"
    icon: mdi:stairs
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_pressure_protection
    lambda: |-
      #if OQ_TOPOLOGY_DUO
      return (float) id(oq_pressure_max_level_hp2);
      #else
      return NAN;
      #endif

  - platform: template
    id: oq_pressure_soft_events_24h_sensor
    name: "Pressure soft events 24h"
    icon: mdi:gauge
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_pressure_protection
    lambda: |-
      return (float) id(oq_pressure_soft_events_24h);

  - platform: template
    id: oq_pressure_hard_events_24h_sensor
    name: "Pressure hard events 24h"
    icon: mdi:gauge-full
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_pressure_protection
    lambda: |-
      return (float) id(oq_pressure_hard_events_24h);

  - platform: template
    id: oq_pressure_hps_events_24h_sensor
    name: "Pressure HPS events 24h"
    icon: mdi:alert-octagon
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_pressure_protection
    lambda: |-
      return (float) id(oq_pressure_hps_events_24h);

binary_sensor:
  - platform: template
    id: oq_pressure_soft_warning_sensor
    name: "Pressure soft warning active"
    icon: mdi:gauge
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_pressure_protection
    lambda: |-
      // Active when any HP currently has a soft cap applied.
      return (id(oq_pressure_max_level_hp1) < 10) ||
             (id(oq_pressure_max_level_hp2) < 10);

  - platform: template
    id: oq_pressure_hard_warning_sensor
    name: "Pressure hard warning active"
    icon: mdi:alert-octagon
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_pressure_protection
    lambda: |-
      // Active when any HP is currently forced to level 0.
      return (id(oq_pressure_max_level_hp1) == 0) ||
             (id(oq_pressure_max_level_hp2) == 0);

  - platform: template
    id: oq_pressure_fouling_warning_sensor
    name: "Pressure fouling warning"
    icon: mdi:filter-remove
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_pressure_protection
    lambda: |-
      // Peak EMA above 36 bar suggests increasing pressure trend,
      // potentially due to fouling, refrigerant overcharge, or low
      // primary loop flow. 5+ soft events in 24h is also a flag.
      const float peak1 = id(oq_pressure_peak_ema_hp1);
      const float peak2 = id(oq_pressure_peak_ema_hp2);
      const bool high_peak = (peak1 > 36.0f) || (peak2 > 36.0f);
      const bool freq_soft = id(oq_pressure_soft_events_24h) >= 5;
      return high_peak || freq_soft;

interval:
  - interval: 5s
    startup_delay: 12000ms
    then:
      - lambda: |-
          const uint32_t now_ms = (uint32_t) millis();
          const uint32_t prev_ms = id(oq_pressure_last_loop_ms);
          float dt_s = 5.0f;
          if (prev_ms > 0 && now_ms > prev_ms) {
            dt_s = (float)(now_ms - prev_ms) / 1000.0f;
            if (dt_s < 1.0f) dt_s = 1.0f;
            if (dt_s > 60.0f) dt_s = 60.0f;
          }
          id(oq_pressure_last_loop_ms) = now_ms;

          const bool enabled = id(oq_pressure_protection_enable).state;
          const float soft_bar = id(oq_pressure_soft_bar).state;
          const float hard_bar = id(oq_pressure_hard_bar).state;
          const float hps_bar = id(oq_pressure_hps_bar).state;
          int soft_reduce = (int) roundf(id(oq_pressure_soft_cap_reduce).state);
          if (soft_reduce < 1) soft_reduce = 1;
          if (soft_reduce > 4) soft_reduce = 4;

          // Helper: classify a single pressure reading into tier and apply cap.
          //   tier 0 = OK
          //   tier 1 = soft (between soft and hard)
          //   tier 2 = hard (between hard and HPS)
          //   tier 3 = HPS-mirror (>= hps_bar)
          auto classify = [&](float bar)->int {
            if (isnan(bar) || bar <= 0.0f) return 0;
            if (bar >= hps_bar) return 3;
            if (bar >= hard_bar) return 2;
            if (bar >= soft_bar) return 1;
            return 0;
          };

          auto apply_cap = [&](int tier)->int {
            // Returns the level cap (10 = no cap, 0 = stop).
            if (!enabled) return 10;
            switch (tier) {
              case 3:  // HPS-mirror — force stop, OpenQuatt mirrors HP HPS
              case 2:  // hard — force stop
                return 0;
              case 1: { // soft — cap at max - reduce, never below 1
                int cap = 10 - soft_reduce;
                if (cap < 1) cap = 1;
                return cap;
              }
              default:
                return 10;
            }
          };

          // ----- HP1 -----
          const float p1_bar = id(hp1_condenser_pressure).has_state()
              ? id(hp1_condenser_pressure).state : NAN;
          const int tier1 = classify(p1_bar);
          id(oq_pressure_max_level_hp1) = apply_cap(tier1);

          // Peak EMA — tracks the running maximum slowly.
          if (!isnan(p1_bar) && p1_bar > 0.0f) {
            const float tau_s = 3600.0f;  // 1h EMA
            const float a = 1.0f - expf(-dt_s / tau_s);
            float ema = id(oq_pressure_peak_ema_hp1);
            if (ema <= 0.0f) ema = p1_bar;
            // Bias EMA towards peaks: rise quickly, decay slowly.
            if (p1_bar > ema) ema = ema + 0.5f * (p1_bar - ema);  // quick rise
            else ema += a * (p1_bar - ema);                        // slow decay
            id(oq_pressure_peak_ema_hp1) = ema;
          }

          // Edge-detect events (rising-edge counted only).
          const int prev_tier1 = id(oq_pressure_hp1_prev_tier);
          if (tier1 > prev_tier1) {
            if (tier1 >= 3) {
              id(oq_pressure_hps_events_24h) += 1;
              id(oq_pressure_hps_events_total) += 1;
              ESP_LOGE("oq_pressure", "HP1 HPS-mirror trip at %.1f bar — forcing level 0.", p1_bar);
            } else if (tier1 == 2) {
              id(oq_pressure_hard_events_24h) += 1;
              id(oq_pressure_hard_events_total) += 1;
              ESP_LOGW("oq_pressure", "HP1 hard cap at %.1f bar — forcing level 0.", p1_bar);
            } else if (tier1 == 1) {
              id(oq_pressure_soft_events_24h) += 1;
              id(oq_pressure_soft_events_total) += 1;
              ESP_LOGI("oq_pressure", "HP1 soft cap at %.1f bar — reducing level.", p1_bar);
            }
          }
          id(oq_pressure_hp1_prev_tier) = tier1;

          // ----- HP2 -----
          #if OQ_TOPOLOGY_DUO
          const float p2_bar = id(hp2_condenser_pressure).has_state()
              ? id(hp2_condenser_pressure).state : NAN;
          const int tier2 = classify(p2_bar);
          id(oq_pressure_max_level_hp2) = apply_cap(tier2);

          if (!isnan(p2_bar) && p2_bar > 0.0f) {
            const float tau_s = 3600.0f;
            const float a = 1.0f - expf(-dt_s / tau_s);
            float ema = id(oq_pressure_peak_ema_hp2);
            if (ema <= 0.0f) ema = p2_bar;
            if (p2_bar > ema) ema = ema + 0.5f * (p2_bar - ema);
            else ema += a * (p2_bar - ema);
            id(oq_pressure_peak_ema_hp2) = ema;
          }

          const int prev_tier2 = id(oq_pressure_hp2_prev_tier);
          if (tier2 > prev_tier2) {
            if (tier2 >= 3) {
              id(oq_pressure_hps_events_24h) += 1;
              id(oq_pressure_hps_events_total) += 1;
              ESP_LOGE("oq_pressure", "HP2 HPS-mirror trip at %.1f bar — forcing level 0.", p2_bar);
            } else if (tier2 == 2) {
              id(oq_pressure_hard_events_24h) += 1;
              id(oq_pressure_hard_events_total) += 1;
              ESP_LOGW("oq_pressure", "HP2 hard cap at %.1f bar — forcing level 0.", p2_bar);
            } else if (tier2 == 1) {
              id(oq_pressure_soft_events_24h) += 1;
              id(oq_pressure_soft_events_total) += 1;
              ESP_LOGI("oq_pressure", "HP2 soft cap at %.1f bar — reducing level.", p2_bar);
            }
          }
          id(oq_pressure_hp2_prev_tier) = tier2;
          #else
          id(oq_pressure_max_level_hp2) = 10;
          #endif

          // ----- 24h window reset -----
          if (id(oq_pressure_events_window_start_ms) == 0) {
            id(oq_pressure_events_window_start_ms) = now_ms;
          }
          if ((uint32_t)(now_ms - id(oq_pressure_events_window_start_ms)) >= 86400000UL) {
            id(oq_pressure_soft_events_24h) = 0;
            id(oq_pressure_hard_events_24h) = 0;
            id(oq_pressure_hps_events_24h) = 0;
            id(oq_pressure_events_window_start_ms) = now_ms;
          }
