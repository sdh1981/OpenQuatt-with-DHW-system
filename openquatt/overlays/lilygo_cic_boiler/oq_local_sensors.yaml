# ==============================================================================
# OpenQuatt - Local Sensors (on-device) — lilygo_cic_boiler overlay
# ==============================================================================
#
# Scope:
# - Placeholder water_supply_temp_esp for backward compatibility.
#
# History:
# - v0.40: MAX31865 PT1000 coil sensors removed. DHW coil in/out are now read
#   via the CWT-TM-8PT module on Modbus 3 (see oq_cwt_pt_module.yaml).
#
# ==============================================================================

sensor:
  - platform: template
    id: water_supply_temp_esp
    name: "Water Supply Temp"
    icon: mdi:thermometer
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never
    lambda: |-
      return NAN;
    web_server:
      sorting_group_id: oq_temperatures
