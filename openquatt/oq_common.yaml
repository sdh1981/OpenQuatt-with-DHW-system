# ==============================================================================
# OpenQuatt - Common Platform Runtime
# ==============================================================================
# Shared, board-independent runtime blocks:
# - Core runtime services (logging/API/OTA)
# - Network fallback + HTTP client
# - RS485 Modbus transport
# - Generic diagnostics entities
# - Runtime debug level controls
# ==============================================================================

# ==============================================================================
# CORE RUNTIME SERVICES
# ==============================================================================
logger:
  level: DEBUG
  initial_level: INFO
  baud_rate: 115200
  runtime_tag_levels: true

api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    on_begin:
      then:
        - lambda: |-
            id(oq_ota_phase_code) = 1;
            id(oq_ota_progress_pct) = 0.0f;
            id(oq_firmware_update_status).publish_state("Starting");
            id(oq_firmware_update_progress).publish_state(0.0f);
    on_progress:
      then:
        - lambda: |-
            id(oq_ota_phase_code) = 2;
            id(oq_ota_progress_pct) = x;
            id(oq_firmware_update_status).publish_state("Uploading");
            id(oq_firmware_update_progress).publish_state(x);
    on_end:
      then:
        - lambda: |-
            id(oq_ota_phase_code) = 3;
            id(oq_ota_progress_pct) = 100.0f;
            id(oq_firmware_update_status).publish_state("Rebooting");
            id(oq_firmware_update_progress).publish_state(100.0f);
    on_error:
      then:
        - lambda: |-
            id(oq_ota_phase_code) = 5;
            id(oq_firmware_update_status).publish_state("Error");
    on_abort:
      then:
        - lambda: |-
            id(oq_ota_phase_code) = 6;
            id(oq_firmware_update_status).publish_state("Aborted");

# ==============================================================================
# EXTERNE COMPONENTEN
# ==============================================================================
# Hier en niet in oq_HP_io.yaml: dat bestand wordt per warmtepomp geincludeerd
# en zou dezelfde bron dan tweemaal aanmelden.
external_components:
  - source:
      type: local
      path: components
    components: [openquatt_odu_eeprom_dump]

# ==============================================================================
# NETWORK + RECOVERY
# ==============================================================================
wifi:
  min_auth_mode: wpa2
  ap:
    ssid: "OpenQuatt"
    password: "openquatt"

captive_portal:

# Enable ESP Web Tools Wi-Fi provisioning while keeping AP fallback available.
improv_serial:
  next_url: "http://{{ip_address}}/"

# ==============================================================================
# MODBUS (RS485)
# ==============================================================================
uart:
  - id: uart_bus
    tx_pin: ${uart_tx_pin}
    rx_pin: ${uart_rx_pin}
    baud_rate: 19200
    data_bits: 8
    stop_bits: 1
    parity: EVEN
    rx_full_threshold: 1
    rx_timeout: 1

modbus:
  - uart_id: uart_bus
    id: mod_bus
    flow_control_pin: ${uart_rts_pin}
    send_wait_time: 100ms
    # Expliciet vastgezet: ESPHome 2026.7.0 verhoogde de client-defaults van
    # turnaround_time 100ms -> 600ms (en send_wait_time 250ms -> 2000ms).
    # turnaround_time zit tussen elk commando, dus dat werd +500ms x 12
    # commando's op de volle pollronde = ruim over update_interval (5s). Gevolg:
    # "Duplicate modbus command found" omdat de wachtrij niet leegliep.
    # Niet op de default vertrouwen; die is al twee keer verschoven.
    #
    # Sinds 2026.8.0 is dit ook de ENIGE knop die nog werkt: command_throttle op
    # de modbus_controller heeft daar geen effect meer. De afweging voor de
    # gekozen waarde staat bij oq_modbus_turnaround_time_ms.
    turnaround_time: ${oq_modbus_turnaround_time_ms}ms

# ==============================================================================
# SHARED RUNTIME STATE
# ==============================================================================
globals:
  - id: oq_boot_startup_inhibit_until_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: oq_boot_startup_inhibit_active
    type: bool
    restore_value: false
    initial_value: 'true'
  - id: oq_ota_progress_pct
    type: float
    restore_value: false
    initial_value: '0.0f'
  - id: oq_ota_phase_code
    type: int
    restore_value: false
    initial_value: '0'

# ==============================================================================
# DIAGNOSTIC ENTITIES
# ==============================================================================
select:
  - platform: template
    name: "Control Owner"
    id: oq_control_owner
    icon: mdi:toggle-switch-variant
    web_server:
      sorting_group_id: oq_control
    entity_category: config
    optimistic: true
    restore_value: true
    options: ["OpenQuatt", "CiC"]
    initial_option: "OpenQuatt"

  - platform: template
    name: "Debug Level"
    id: debug_level_select
    disabled_by_default: true
    icon: mdi:lan
    web_server:
      sorting_group_id: oq_system_diagnostics
    entity_category: diagnostic
    optimistic: true
    restore_value: true
    options: [NONE, ERROR, WARN, INFO, CONFIG, DEBUG]
    initial_option: INFO
    on_value:
      then:
        - lambda: |-
            int lvl =
              (x == "NONE")    ? 0 :
              (x == "ERROR")   ? 1 :
              (x == "WARN")    ? 2 :
              (x == "INFO")    ? 3 :
              (x == "CONFIG")  ? 4 :
                                 5;  // DEBUG

            esphome::logger::global_logger->set_log_level(lvl);

  - platform: template
    name: "Debug Level Modbus"
    id: debug_level_modbus_master
    disabled_by_default: true
    icon: mdi:lan
    web_server:
      sorting_group_id: oq_system_diagnostics
    entity_category: diagnostic
    optimistic: true
    restore_value: true
    options: [NONE, ERROR, WARN, INFO, CONFIG, DEBUG]
    initial_option: WARN
    on_value:
      then:
        - lambda: |-
            int lvl =
              (x == "NONE")    ? 0 :
              (x == "ERROR")   ? 1 :
              (x == "WARN")    ? 2 :
              (x == "INFO")    ? 3 :
              (x == "CONFIG")  ? 4 :
                                 5;  // DEBUG

            auto *logger = esphome::logger::global_logger;

            logger->set_log_level("modbus", lvl);
            logger->set_log_level("modbus_controller", lvl);

button:
  - platform: restart
    name: Restart
    icon: mdi:restart
    id: restart_switch
    web_server:
      sorting_group_id: oq_system_diagnostics

  - platform: safe_mode
    name: Safe mode
    icon: mdi:shield-alert
    id: safe_mode_button
    web_server:
      sorting_group_id: oq_system_diagnostics

binary_sensor:
  - platform: status
    name: Status
    icon: mdi:check-circle-outline
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_system_diagnostics

sensor:
  # ---- Geheugen ----
  # Nodig om te zien of PSRAM daadwerkelijk is gevonden en of het interne SRAM
  # er lucht van krijgt. Blijft "PSRAM totaal" op 0 staan, dan is de modus in
  # oq_substitutions_common.yaml verkeerd geraden (probeer quad in plaats van
  # octal); de chip start dan gewoon door zonder PSRAM.
  #
  # "Intern geheugen vrij" is het getal dat er echt toe doet: DMA-buffers,
  # interrupt-handlers en de stacks moeten daar staan en kunnen niet uitwijken.
  - platform: template
    name: "Intern geheugen vrij"
    id: oq_heap_internal_free
    icon: mdi:memory
    unit_of_measurement: "B"
    device_class: data_size
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    entity_category: diagnostic
    lambda: |-
      return (float) heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
    web_server:
      sorting_group_id: oq_system_diagnostics

  # Grootste aaneengesloten interne blok. Zakt dit ver onder het vrije totaal,
  # dan is de heap gefragmenteerd -- dat verklaart allocatiefouten terwijl er
  # op papier nog ruimte is.
  - platform: template
    name: "Intern geheugen grootste blok"
    id: oq_heap_internal_largest
    icon: mdi:memory
    unit_of_measurement: "B"
    device_class: data_size
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    entity_category: diagnostic
    lambda: |-
      return (float) heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL);
    web_server:
      sorting_group_id: oq_system_diagnostics

  # Laagste stand sinds de laatste start. Een sensor die elke minuut kijkt mist
  # juist de korte pieken waarin het misgaat -- een TLS-handshake of een OTA
  # duurt seconden. Dit getal onthoudt het diepste punt en is daarmee de enige
  # betrouwbare maat voor hoe dicht je bij een allocatiefout zat.
  - platform: template
    name: "Intern geheugen laagste stand"
    id: oq_heap_internal_min
    icon: mdi:memory
    unit_of_measurement: "B"
    device_class: data_size
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    entity_category: diagnostic
    lambda: |-
      return (float) heap_caps_get_minimum_free_size(MALLOC_CAP_INTERNAL);
    web_server:
      sorting_group_id: oq_system_diagnostics

  - platform: template
    name: "PSRAM vrij"
    id: oq_psram_free
    icon: mdi:chip
    unit_of_measurement: "B"
    device_class: data_size
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    entity_category: diagnostic
    lambda: |-
      return (float) heap_caps_get_free_size(MALLOC_CAP_SPIRAM);
    web_server:
      sorting_group_id: oq_system_diagnostics

  # 0 = geen PSRAM gevonden. Dat is de check na het flashen.
  - platform: template
    name: "PSRAM totaal"
    id: oq_psram_total
    icon: mdi:chip
    unit_of_measurement: "B"
    device_class: data_size
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 300s
    entity_category: diagnostic
    lambda: |-
      return (float) heap_caps_get_total_size(MALLOC_CAP_SPIRAM);
    web_server:
      sorting_group_id: oq_system_diagnostics

  - platform: template
    name: Firmware Update Progress
    id: oq_firmware_update_progress
    icon: mdi:progress-upload
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 1s
    entity_category: diagnostic
    lambda: |-
      return id(oq_ota_progress_pct);
    web_server:
      sorting_group_id: oq_system_diagnostics

  - platform: uptime
    name: Uptime
    id: uptime_sensor
    internal: true
    icon: mdi:timer-outline
    update_interval: 60s
    device_class: duration
    unit_of_measurement: s
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_system_diagnostics

  - platform: template
    name: Uptime
    id: uptime_hours_sensor
    icon: mdi:timer-outline
    update_interval: 60s
    device_class: duration
    unit_of_measurement: h
    accuracy_decimals: 2
    state_class: total_increasing
    entity_category: diagnostic
    lambda: |-
      if (isnan(id(uptime_sensor).state)) {
        return NAN;
      }
      return id(uptime_sensor).state / 3600.0f;
    web_server:
      sorting_group_id: oq_system_diagnostics

  # v0.40: deze is de enige internal_temperature sensor in de build.
  # De duplicate-registratie in oq_cic_modbus_slave.yaml (die FAILED gaf)
  # is verwijderd. Dashboards verwijzen naar entity
  # `sensor.openquatt_esp_internal_temperature`.
  - platform: internal_temperature
    id: esp32_internal_temp
    name: ESP Internal Temperature
    icon: mdi:thermometer
    update_interval: 60s
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_system_diagnostics

  - platform: wifi_signal
    name: WiFi Signal
    icon: mdi:wifi-arrow-left-right
    update_interval: 300s
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_system_diagnostics

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
      icon: mdi:ip-network-outline
      entity_category: diagnostic
      web_server:
        sorting_group_id: oq_system_diagnostics
    ssid:
      name: WiFi SSID
      icon: mdi:wifi
      entity_category: diagnostic
      web_server:
        sorting_group_id: oq_system_diagnostics
  - platform: template
    id: oq_firmware_update_status
    name: Firmware Update Status
    icon: mdi:upload-network-outline
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      // Expose a compact OTA phase label for dashboards and the local web UI.
      switch (id(oq_ota_phase_code)) {
        case 1:
          return {"Starting"};
        case 2:
          return {"Uploading"};
        case 3:
          return {"Rebooting"};
        case 4:
          return {"Complete"};
        case 5:
          return {"Error"};
        case 6:
          return {"Aborted"};
        default:
          return {"Idle"};
      }
    web_server:
      sorting_group_id: oq_system_diagnostics
  - platform: template
    id: oq_project_version_text
    name: OpenQuatt Version
    icon: mdi:tag-text-outline
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      return {"${project_version}"};
    web_server:
      sorting_group_id: oq_system_diagnostics
  - platform: template
    id: oq_release_channel_text
    name: OpenQuatt Release Channel
    icon: mdi:source-branch
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      return {"${release_channel}"};
    web_server:
      sorting_group_id: oq_system_diagnostics
  - platform: version
    name: ESPHome Version
    icon: mdi:information-outline
    hide_timestamp: true
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_system_diagnostics
  - platform: template
    id: uptime_readable_text
    name: Uptime readable
    internal: true
    icon: mdi:timer-outline
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      // Read the raw uptime and bail out early when the source is unavailable.
      if (isnan(id(uptime_sensor).state)) {
        return {"unknown"};
      }

      const uint32_t total_seconds = static_cast<uint32_t>(id(uptime_sensor).state);
      const uint32_t days = total_seconds / 86400U;
      const uint32_t hours = (total_seconds % 86400U) / 3600U;
      const uint32_t minutes = (total_seconds % 3600U) / 60U;
      const uint32_t seconds = total_seconds % 60U;

      // Format the most compact readable representation for the dashboard.
      // uint32_t is `unsigned long` op ESP32, dus %u vereist een expliciete cast.
      char buffer[32];
      if (days > 0U) {
        snprintf(buffer, sizeof(buffer), "%ud %uh %um", (unsigned) days, (unsigned) hours, (unsigned) minutes);
      } else if (hours > 0U) {
        snprintf(buffer, sizeof(buffer), "%uh %um", (unsigned) hours, (unsigned) minutes);
      } else if (minutes > 0U) {
        snprintf(buffer, sizeof(buffer), "%um", (unsigned) minutes);
      } else {
        snprintf(buffer, sizeof(buffer), "%us", (unsigned) seconds);
      }
      return {buffer};
    web_server:
      sorting_group_id: oq_system_diagnostics
