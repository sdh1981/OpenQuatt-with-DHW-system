  # v0.40: duplicate internal_temperature sensors verwijderd. ESPHome kan
  # er maar één per chip registreren — de tweede gaf "FAILED: unspecified".
  # De canonieke ESP-temperatuur staat nu alleen in oq_common.yaml met
  # id `esp32_internal_temp` en HA entity sensor.openquatt_esp_internal_temperature.
  # Een wrapper-template voor CIC-sortering is ook overbodig: dezelfde entity
  # kan via HA dashboards in elke sortering geplaatst worden.

  - platform: debug
