    update_interval: 60s
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_boiler
    lambda: |-
      return id(oq_dhw_ua_tank_wpk);

  - platform: template
    id: oq_dhw_ua_tank_samples_sensor
    name: "DHW UA samples"
    icon: mdi:counter
