    turn_on_action: []
    turn_off_action: []
    entity_category: config
    web_server:
      sorting_group_id: oq_boiler

  - platform: template
    id: oq_dhw_manual_test_mode
    name: "DHW manual test mode"
    icon: mdi:hand-back-right
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action: []
    turn_off_action: []
    entity_category: config
    web_server:
      sorting_group_id: oq_boiler

  - platform: template
    id: oq_dhw_manual_valve_cmd
    name: "DHW manual valve relay"
    icon: mdi:valve
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action: []
    turn_off_action: []
    entity_category: config
    web_server:
      sorting_group_id: oq_boiler

  - platform: template
    id: oq_dhw_manual_element_cmd
    name: "DHW manual element relay"
    icon: mdi:water-boiler
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action: []
    turn_off_action: []
    entity_category: config
    web_server:
      sorting_group_id: oq_boiler

  # ----- v0.32 DHW smart features switches -----

  - platform: template
    id: oq_dhw_tariff_shift_enable
    name: "DHW tariff shift enable"
    icon: mdi:currency-eur
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action: []
    turn_off_action: []
    web_server:
      sorting_group_id: oq_boiler

