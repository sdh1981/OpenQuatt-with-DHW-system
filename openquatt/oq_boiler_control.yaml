    lambda: |-
      #if OQ_TOPOLOGY_DUO
      // Snelboost heeft een eigen verloop en negeert de assist-logica.
      if (id(oq_dhw_max_boost_active)) {
        if (id(oq_dhw_hp_thermal_limit)) {
          return std::string("Snelboost - HP's eruit op temperatuur, element gaat door");
        }
        const float t = id(dhw_tank_top_input).state;
        const float hs = id(oq_dhw_max_boost_hp_stop_top_c).state;
        if (!isnan(t) && !isnan(hs) && t >= hs) {
          return std::string("Snelboost - element maakt af, HP's uit");
        }
        return std::string("Snelboost - beide HP's + element");
      }
      if (!id(oq_dhw_assist_enable).state) return std::string("Uit");
      if (!id(oq_dhw_single_hp_mode).state) return std::string("Niet van toepassing - duo DHW");
      if (id(oq_dhw_state_code) == 4) return std::string("Uit tijdens legionella");
      if (id(oq_dhw_assist_guard_active)) {
        return std::string("Geblokkeerd - persgas of water-uit te hoog");
      }
      const int lvl = id(oq_dhw_assist_level);
      if (lvl > 0) {
        char buf[48];
        snprintf(buf, sizeof(buf), "Actief - 2e HP op level %d", lvl);
        return std::string(buf);
      }
      if (id(oq_dhw_state_code) != 2) return std::string("Geen HP-fase actief");
      {
        const float b = id(dhw_tank_bottom_input).state;
        const float bs = id(oq_dhw_assist_bottom_stop_c).state;
        if (!isnan(b) && !isnan(bs) && b >= bs) {
          return std::string("Uit - tank bijna klaar, staart op 1 compressor");
        }
      }
      if ((uint32_t) millis() < id(oq_dhw_assist_lockout_until_ms)) {
        if (id(oq_dhw_assist_water_trip)) {
          return std::string("Wachttijd - of eerder als water-uit genoeg zakt");
        }
        return std::string("Wachttijd na uitschakelen");
      }
      return std::string("Standby - lead haalt het alleen");
      #else
      return std::string("Niet van toepassing - single topologie");
      #endif

  - platform: template
    id: oq_dhw_legionella_defer_status_text
    name: "DHW legionella deferral status"
    icon: mdi:information-outline
    update_interval: 10s
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_boiler
    lambda: |-
      // Handmatige force gaat vóór elke uitstel-reden: die checks worden er niet
      // meer op toegepast. Wel expliciet terugmelden wat er dan gebeurt, want een
      // force die is geaccepteerd terwijl DHW nog bezig is start pas zodra de
      // regeling terug op IDLE_CV staat -- anders lijkt de knop niets te doen.
      if (id(oq_dhw_src_legionella_force).state) {
        const int st = id(oq_dhw_state_code);
        if (st == 4) return std::string("Handmatige force - run actief");
        if (st == 5) return std::string("Handmatige force geblokkeerd - DHW-storing, eerst 'DHW clear fault'");
        if (id(oq_dhw_lockout).state) return std::string("Handmatige force geblokkeerd - DHW lockout staat aan");
        if (st != 0) return std::string("Handmatige force geaccepteerd - wacht tot DHW-cyclus klaar is");
        return std::string("Handmatige force - start nu");
      }
      switch (id(oq_dhw_legionella_defer_reason_code)) {
        case 1:
          return std::string("Uitgesteld - recent natuurlijke pasteurisatie");
        case 2:
          return std::string("Wachten op goedkoop tarief");
        case 3:
          return std::string("Max-wait bereikt - run wordt geforceerd");
        case 4:
          return std::string("Proactief gestart - cheap window + bijna due");
        default:
          return std::string("Niet uitgesteld");
      }

interval:
  - interval: ${oq_dhw_loop_s}s
    startup_delay: 4600ms
    then:
      - lambda: |-
          static oq_dhw::Controller controller;
          auto fmt_eta_s = [](int64_t delta_s) -> std::string {
            if (delta_s < 0) delta_s = 0;
            const uint32_t total_min = (uint32_t) (delta_s / 60LL);
            const uint32_t days = total_min / (24UL * 60UL);
            const uint32_t rem_min_after_days = total_min % (24UL * 60UL);
            const uint32_t hours = rem_min_after_days / 60UL;
            const uint32_t mins = rem_min_after_days % 60UL;
            char buf[48];
            if (days > 0) {
              snprintf(buf, sizeof(buf), "%lud %luh", (unsigned long) days, (unsigned long) hours);
            } else if (hours > 0) {
              snprintf(buf, sizeof(buf), "%luh %lum", (unsigned long) hours, (unsigned long) mins);
            } else {
              snprintf(buf, sizeof(buf), "%lum", (unsigned long) mins);
            }
            return std::string(buf);
          };
          auto fmt_epoch_local = [](int64_t epoch_s) -> std::string {
            if (epoch_s <= 0) return std::string("Onbekend");
            time_t tt = (time_t) epoch_s;
            struct tm tmbuf;
            if (localtime_r(&tt, &tmbuf) == nullptr) return std::string("Onbekend");
            char buf[32];
            if (strftime(buf, sizeof(buf), "%Y-%m-%d %H:%M", &tmbuf) == 0) return std::string("Onbekend");
            return std::string(buf);
          };
          // Parse "HH:MM[:SS]" or "YYYY-MM-DD HH:MM[:SS]" -> minutes since midnight.
          // Returns -1 on parse error. Shared by all three time-window checks below.
          auto parse_hm = [](const std::string& s) -> int {
            int hh = 0, mm = 0;
            if (s.length() >= 5 && s[2] == ':') {
              hh = atoi(s.substr(0, 2).c_str());
              mm = atoi(s.substr(3, 2).c_str());
            } else if (s.length() >= 16 && s[10] == ' ' && s[13] == ':') {
              hh = atoi(s.substr(11, 2).c_str());
              mm = atoi(s.substr(14, 2).c_str());
            } else {
              return -1;
            }
            if (hh < 0 || hh > 23 || mm < 0 || mm > 59) return -1;
            return hh * 60 + mm;
          };

          if (id(oq_dhw_clear_fault_req)) {
            controller.clear_fault_latch();
            id(oq_dhw_clear_fault_req) = false;
            // publish immediately: tick() will see fault_=NONE→NONE (changed=false)
            id(oq_dhw_fault_text).publish_state("NONE");
            id(oq_dhw_state_text).publish_state("IDLE_CV");
          }

          // Seed legionella last-done from persistent wall-clock epoch on first valid tick.
          // legionella_seeded = true signals the controller that scheduling may begin.
          // We always wait for NTP so the age calculation is reliable.
          //
          // Three cases must be handled correctly:
          //   1. Past due (age >= interval): seed with 1 → fires on next IDLE_CV tick
          //   2. Normal (age < interval AND age_ms < now_ms_seed): seed accurately
          //   3. Edge (age < interval BUT age_ms > now_ms_seed, i.e. recent reboot):
          //      seed conservatively with now_ms_seed → next run fires after one full
          //      interval of uptime (slightly later than ideal, but never spuriously).
          //
          // The previous version clipped age_ms to now_ms_seed and then seeded with 0,
          // which is rejected by seed_legionella_last_done_ms() → controller thinks
          // "never done" → fires 30 min after every reboot. That bug is now fixed.
          static bool legionella_seeded = false;
          if (!legionella_seeded) {
            auto now_t = id(oq_time).now();
            if (now_t.is_valid()) {
              const int64_t last_done_epoch = id(oq_dhw_legionella_last_done_epoch_s);
              if (last_done_epoch > 0) {
                const int64_t now_epoch = (int64_t) now_t.timestamp;
                const int64_t age_s = now_epoch - last_done_epoch;
                if (age_s >= 0) {
                  const uint32_t now_ms_seed = (uint32_t) millis();
                  // cfg is not yet built at this point — use the default interval
                  // (7 days in seconds) directly. Must stay in sync with the
                  // Config::legionella_interval_ms = 7 * 24 * 60 * 60 * 1000
                  // declaration in oq_dhw_controller_logic.h.
                  const int64_t interval_s = 7LL * 24LL * 60LL * 60LL;
                  if (age_s >= interval_s) {
                    // Case 1: past due — fire immediately.
                    controller.seed_legionella_last_done_ms(1);
                  } else {
                    const int64_t age_ms_real = age_s * 1000LL;
                    if (age_ms_real < (int64_t) now_ms_seed) {
                      // Case 2: normal — age fits in current uptime.
                      const uint32_t seed = now_ms_seed - (uint32_t) age_ms_real;
                      controller.seed_legionella_last_done_ms(seed > 0 ? seed : 1);
                    } else {
                      // Case 3: edge — age exceeds uptime (typical after reboot).
                      // Treat as "just done now"; next run fires ~1 interval from now,
                      // which is later than the true expiry but safely avoids spurious
                      // immediate triggers. Diagnostic next-run text remains accurate
                      // because it's computed from the persistent epoch.
                      controller.seed_legionella_last_done_ms(
                          now_ms_seed > 0 ? now_ms_seed : 1);
                    }
                  }
                }
              }
              // last_done_epoch == 0 means never done; controller schedules after
              // the 30-min boot-settle defined in should_start_legionella_.
              legionella_seeded = true;
            }
            // If NTP not yet valid: stay unseeded — controller blocks scheduling.
          }

          oq_dhw::Config cfg;
          cfg.start_top_c = id(oq_dhw_start_top_c).state;
          cfg.hp_stop_top_c = id(oq_dhw_hp_stop_top_c).state;
          cfg.boost_target_c = id(oq_dhw_boost_target_c).state;
          cfg.max_boost_target_c = id(oq_dhw_max_boost_target_c).state;
          cfg.max_boost_hp_stop_top_c = id(oq_dhw_max_boost_hp_stop_top_c).state;
          cfg.legionella_target_c = id(oq_dhw_legionella_target_c).state;
          cfg.legionella_hp_stop_top_c = id(oq_dhw_legionella_hp_stop_top_c).state;
          cfg.legionella_hp_top_ceiling_c = id(oq_dhw_legionella_hp_top_ceiling_c).state;
          // Hard-coded per user requirement: DHW HP always stops on tank-bottom = 52°C.
          // 52°C keeps the entire tank in the legionella-inhibition zone (50–55°C)
          // while maintaining a healthy ΔT vs the HP supply (60°C target) for good COP.
          // The slider/switch entities are kept for backward compatibility but their
          // values are ignored — the firmware enforces these constants every tick.
          // Hygiene safety is provided by the weekly legionella run (68°C / 15 min hold).
          cfg.stop_on_bottom_enable = true;
          cfg.hp_stop_bottom_c = 52.0f;
          // v0.40 temp: legionella klep op DHW houden voor coil-circulation
          cfg.legionella_use_coil_circulation =
              id(oq_dhw_legionella_coil_circulation_enable).state;
          // Hardcoded: HP mag tot 180 min draaien per DHW-cyclus. Default
          // 75 min uit de Config struct was te krap voor een 220L tank van
          // koud (19°C) naar tank-bottom 52°C — die opwarming kost ~100 min
          // bij gemiddeld 4-5 kW HP-output. 180 min geeft ruime marge voor
          // koudere starttemperaturen of lagere buitentemp (lagere COP).
          // Hygiëne wordt apart geborgd door de wekelijkse legionella-run.
          cfg.hp_max_runtime_ms = 180UL * 60UL * 1000UL;
          cfg.hp_target_flow_c = id(oq_dhw_hp_target_flow_c).state;
          cfg.enable_boost_after_hp = id(oq_dhw_boost_after_hp).state;
          cfg.boost_hp_assist_enable = id(oq_dhw_boost_hp_assist_enable).state;
          cfg.boost_hp_assist_bottom_c = id(oq_dhw_boost_hp_assist_bottom_c).state;
          cfg.boost_hp_assist_stop_top_c = id(oq_dhw_boost_hp_assist_stop_top_c).state;
          cfg.min_cycle_rest_ms = (uint32_t)(id(oq_dhw_min_rest_s).state * 1000.0f);
          const float flow_min_cfg = id(oq_dhw_flow_min_lph).state;
          const float flow_max_cfg = id(oq_dhw_flow_max_lph).state;
          cfg.flow_min_lph = fminf(flow_min_cfg, flow_max_cfg);
          cfg.flow_max_lph = fmaxf(flow_min_cfg, flow_max_cfg);

          oq_dhw::Inputs in;
          in.now_ms = (uint32_t) millis();
          in.tank_top_c = id(dhw_tank_top_input).state;
          in.tank_bottom_c = id(dhw_tank_bottom_input).state;
          in.coil_in_c = id(dhw_coil_in_input).state;
          in.coil_out_c = id(dhw_coil_out_input).state;

          in.valve_feedback_valid = true;
          // Raw aux contact closes in DHW position; controller expects CV=true.
          in.valve_feedback_cv = !id(dhw_valve_aux_cv_input).state;

          in.flow_valid = id(flow_rate_selected).has_state() && !isnan(id(flow_rate_selected).state);
          in.flow_lph = in.flow_valid ? id(flow_rate_selected).state : NAN;

          const bool hp_fault_from_ha = id(dhw_hp_fault_ha).has_state() ? id(dhw_hp_fault_ha).state : id(oq_dhw_src_hp_fault).state;
          in.hp_fault_active = hp_fault_from_ha || id(oq_water_temp_hard_trip_active);

          const bool lockout_ha = id(dhw_lockout_ha).has_state() ? id(dhw_lockout_ha).state : id(oq_dhw_src_lockout).state;
          in.lockout_active = id(oq_dhw_lockout).state || lockout_ha;

          // Time window: block new cycle starts outside the configured hour range.
          // Only applies when window is enabled; does not interrupt a running cycle.
          bool window_inhibit = false;
          if (id(oq_dhw_window_enable).state) {
            auto now_t = id(oq_time).now();
            if (now_t.is_valid()) {
              const int h = now_t.hour;
              const int s_h = (int) id(oq_dhw_window_start_h).state;
              const int e_h = (int) id(oq_dhw_window_end_h).state;
              if (s_h <= e_h) {
                window_inhibit = (h < s_h || h >= e_h);
              } else {
                // Overnight window e.g. 22:00-06:00: active when h>=22 OR h<6.
                window_inhibit = (h < s_h && h >= e_h);
              }
            } else {
              window_inhibit = true;
            }
          }

          // ============================================================
          // v0.40: avoid-expensive feature voor reguliere DHW cyclus
          // ------------------------------------------------------------
          // Als we in het duurste tariefvenster van vandaag zitten EN
          // de tank is niet te koud → stel cyclus uit (start_inhibit).
          // Werkt alleen op cyclus-START. Lopende cycli worden NIET
          // onderbroken (anders zou je halverwege koud blijven).
          //
          // Diagnose code: oq_dhw_avoid_expensive_reason_code
          //   0 = geen blokkade
          //   1 = duur uur, cyclus uitgesteld
          //   2 = duur uur maar tank koud → emergency override, mag starten
          // ============================================================
          id(oq_dhw_avoid_expensive_reason_code) = 0;
          bool expensive_inhibit = false;
          if (id(oq_dhw_avoid_expensive_enable).state) {
            auto now_t_exp = id(oq_time).now();
            if (now_t_exp.is_valid() &&
                id(dhw_expensive_start_ha).has_state() &&
                id(dhw_expensive_end_ha).has_state()) {
              const int s = parse_hm(id(dhw_expensive_start_ha).state);
              const int e = parse_hm(id(dhw_expensive_end_ha).state);
              if (s >= 0 && e >= 0) {
                const int n = now_t_exp.hour * 60 + now_t_exp.minute;
                bool in_expensive;
                if (s <= e) in_expensive = (n >= s && n < e);
                else        in_expensive = (n >= s || n < e);

                if (in_expensive) {
                  // Emergency-check: is tank top te koud om te wachten?
                  const float emerg_c = id(oq_dhw_emergency_top_c).state;
                  const bool emergency_cold =
                      !isnan(in.tank_top_c) && in.tank_top_c < emerg_c;
                  if (emergency_cold) {
                    // Te koud — laat verwarmen toe ondanks duur uur
                    id(oq_dhw_avoid_expensive_reason_code) = 2;
                  } else {
                    // Duur uur + tank OK → cyclus uitstellen
                    expensive_inhibit = true;
                    id(oq_dhw_avoid_expensive_reason_code) = 1;
                  }
                }
              }
            }
          }

          in.start_inhibit = window_inhibit || expensive_inhibit;

          const bool solar_boost_ha =
              id(dhw_solar_boost_ha).has_state() ? id(dhw_solar_boost_ha).state : id(oq_dhw_src_solar_boost).state;
          const bool solar_boost_auto_tariff =
              id(oq_dhw_solar_boost_auto).state &&
              id(dhw_tariff_ha).has_state() &&
              !isnan(id(dhw_tariff_ha).state) &&
              (id(dhw_tariff_ha).state <= id(oq_dhw_solar_tariff_threshold).state);
          in.solar_boost_request = solar_boost_ha || solar_boost_auto_tariff;
          in.max_boost_request = id(oq_dhw_boost_now).state;
          // Bewaking uit de vorige tick (2s oud); voor een thermische grens ruim
          // snel genoeg. Zie het assist-blok verderop waar hij wordt gezet.
          in.hp_thermal_limit_active = id(oq_dhw_hp_thermal_limit);
          // Handmatige force: lokale schakelaar OF de HA-proxy.
          // Bewust een OR en geen prioriteit. Met de oude ternary maakte het
          // enkele bestaan van de HA-entiteit de lokale schakelaar dood -- ook
          // als die HA-entiteit gewoon 'off' stond.
          const bool legionella_manual_force =
              (id(dhw_legionella_force_ha).has_state() && id(dhw_legionella_force_ha).state) ||
              id(oq_dhw_src_legionella_force).state;
          in.legionella_force_request = legionella_manual_force;
          in.legionella_seeded = legionella_seeded;

          // ============================================================
          // v0.40 Smart Legionella Deferral + Tariff-aware Scheduling
          // ------------------------------------------------------------
          // Drie mechanismen die de legionella-start beïnvloeden:
          //
          //   #0 Proactive advance (PULL FORWARD): als legionella binnen
          //      advance_window_h gepland staat EN we zitten nu in een
          //      goedkoop tariefvenster → trigger run NU i.p.v. te wachten.
          //   #1 Smart deferral: tank heeft recent (binnen N dagen) op
          //      natuurlijke wijze al 68°C gehaald → geen run nodig.
          //   #2 Tariff-aware:  als een force-request binnenkomt en het
          //      huidig uur is NIET goedkoop → wacht tot wel goedkoop.
          //      Veiligheidsklep: max X uur wachten, dan toch forceren.
          //
          // Diagnostiek: oq_dhw_legionella_defer_reason_code:
          //   0 = niet uitgesteld
          //   1 = recent natuurlijke pasteurisatie (smart deferral)
          //   2 = wacht op goedkoop tarief
          //   3 = wacht op goedkoop, maar max-wait nadert
          //   4 = proactief naar voren gehaald (cheap window + bijna due)
          // ============================================================
          id(oq_dhw_legionella_defer_reason_code) = 0;

          // ============================================================
          // #0 Proactive advance — trekt geplande run naar voren naar
          //    de eerste cheap window binnen het advance-venster
          // ============================================================
          auto check_cheap_window_now = [&](const ESPTime& now_t) -> int {
            // Returns 0 = unknown (geen valide bron), 1 = cheap, 2 = not cheap
            // a) datetime-window
            if (id(dhw_legionella_cheap_start_ha).has_state() &&
                id(dhw_legionella_cheap_end_ha).has_state()) {
              const int s = parse_hm(id(dhw_legionella_cheap_start_ha).state);
              const int e = parse_hm(id(dhw_legionella_cheap_end_ha).state);
              if (s >= 0 && e >= 0) {
                const int n = now_t.hour * 60 + now_t.minute;
                bool cheap;
                if (s <= e) cheap = (n >= s && n < e);
                else        cheap = (n >= s || n < e);
                return cheap ? 1 : 2;
              }
            }
            // b) binary_sensor
            if (id(dhw_legionella_cheap_window_ha).has_state()) {
              return id(dhw_legionella_cheap_window_ha).state ? 1 : 2;
            }
            // c) ratio fallback
            if (id(dhw_tariff_ha).has_state() &&
                !isnan(id(dhw_tariff_ha).state) &&
                id(oq_dhw_tariff_running_avg_eur) > 0.0f) {
              const float ratio = id(dhw_tariff_ha).state /
                                  id(oq_dhw_tariff_running_avg_eur);
              const float threshold = id(oq_dhw_legionella_cheap_ratio).state;
              return (ratio < threshold) ? 1 : 2;
            }
            return 0;
          };

          if (id(oq_dhw_legionella_tariff_aware_enable).state &&
              !in.legionella_force_request) {
            auto now_t_adv = id(oq_time).now();
            if (now_t_adv.is_valid()) {
              const int64_t now_epoch_adv = (int64_t) now_t_adv.timestamp;
              const int64_t last_done = id(oq_dhw_legionella_last_done_epoch_s);
              const int64_t anchor = id(oq_dhw_legionella_anchor_epoch_s);
              const int64_t interval_s = (int64_t)(cfg.legionella_interval_ms / 1000UL);
              const int64_t advance_s = (int64_t)(
                  id(oq_dhw_legionella_advance_window_h).state * 3600.0f);

              if (advance_s > 0 && interval_s > 0) {
                // Compute when next run is scheduled
                const int64_t base = (last_done > 0) ? last_done : anchor;
                if (base > 0) {
                  const int64_t scheduled_epoch = base + interval_s;
                  const int64_t time_to_scheduled = scheduled_epoch - now_epoch_adv;
                  // Within advance window of scheduled time?
                  if (time_to_scheduled > 0 && time_to_scheduled <= advance_s) {
                    // Currently in cheap window?
                    if (check_cheap_window_now(now_t_adv) == 1) {
                      // Verifieer smart deferral niet zou suppressen
                      bool would_be_deferred = false;
                      if (id(oq_dhw_smart_legionella_enable).state) {
                        const int64_t last_seen =
                            id(oq_dhw_natural_60c_last_seen_epoch_s);
                        const float defer_days =
                            id(oq_dhw_legionella_defer_days).state;
                        if (last_seen > 0 && defer_days > 0.0f) {
                          const int64_t defer_seconds =
                              (int64_t)(defer_days * 86400.0f);
                          if ((now_epoch_adv - last_seen) < defer_seconds) {
                            would_be_deferred = true;
                          }
                        }
                      }
                      if (!would_be_deferred) {
                        // PULL FORWARD: trigger run nu
                        in.legionella_force_request = true;
                        id(oq_dhw_legionella_defer_reason_code) = 4;
                      }
                    }
                  }
                }
              }
            }
          }

          // Uitstel-checks gelden alleen voor een AUTOMATISCH naar voren gehaalde
          // run, niet voor een handmatige force. Een handmatige force is een
          // expliciete opdracht en mag niet stilzwijgend worden weggeschreven --
          // dat is precies wat "force" betekent.
          //
          // Zonder deze uitzondering konden deze checks alleen maar handmatige
          // forces afbreken: de pull-forward hierboven zet de vlag namelijk al
          // uitsluitend als uitstel niet van toepassing is. Gevolg was een knop
          // die zichtbaar aan ging en verder niets deed, met als meest
          // voorkomende oorzaak reden 1 (recente natuurlijke pasteurisatie) --
          // juist waarschijnlijk kort na een geslaagde run.
          if (in.legionella_force_request && !legionella_manual_force) {
            auto now_t_leg = id(oq_time).now();
            const bool now_valid_leg = now_t_leg.is_valid();
            const int64_t now_epoch_leg = now_valid_leg ? (int64_t) now_t_leg.timestamp : 0;

            // #1 Smart deferral check
            if (id(oq_dhw_smart_legionella_enable).state && now_valid_leg) {
              const int64_t last_seen = id(oq_dhw_natural_60c_last_seen_epoch_s);
              const float defer_days = id(oq_dhw_legionella_defer_days).state;
              if (last_seen > 0 && defer_days > 0.0f) {
                const int64_t defer_seconds = (int64_t)(defer_days * 86400.0f);
                if ((now_epoch_leg - last_seen) < defer_seconds) {
                  in.legionella_force_request = false;
                  id(oq_dhw_legionella_defer_reason_code) = 1;
                }
              }
            }

            // #2 Tariff-aware check (skipped if already deferred by #1)
            if (in.legionella_force_request &&
                id(oq_dhw_legionella_tariff_aware_enable).state &&
                now_valid_leg) {
              // Bepaal of we momenteel in een "goedkoop" tarief-window zitten.
              // Drie bronnen, in volgorde van voorkeur:
              //   a) HA datetime-window (start + end input_datetime) ← BEST
              //   b) HA binary_sensor "cheap now"
              //   c) Fallback: ratio (current_price / 24h_avg) < threshold
              bool cheap_window = false;
              bool cheap_source_valid = false;

              // Bron a: datetime-window
              if (id(dhw_legionella_cheap_start_ha).has_state() &&
                  id(dhw_legionella_cheap_end_ha).has_state()) {
                const int start_min = parse_hm(
                    id(dhw_legionella_cheap_start_ha).state);
                const int end_min = parse_hm(
                    id(dhw_legionella_cheap_end_ha).state);
                if (start_min >= 0 && end_min >= 0) {
                  const int now_min = now_t_leg.hour * 60 + now_t_leg.minute;
                  if (start_min <= end_min) {
                    // Normaal venster binnen één dag
                    cheap_window = (now_min >= start_min && now_min < end_min);
                  } else {
                    // Venster overlapt middernacht (bv. 23:00 → 04:00)
                    cheap_window = (now_min >= start_min || now_min < end_min);
                  }
                  cheap_source_valid = true;
                }
              }

              // Bron b: HA binary_sensor (alleen als datetime niet werkte)
              if (!cheap_source_valid &&
                  id(dhw_legionella_cheap_window_ha).has_state()) {
                cheap_window = id(dhw_legionella_cheap_window_ha).state;
                cheap_source_valid = true;
              }

              // Bron c: fallback ratio
              if (!cheap_source_valid &&
                  id(dhw_tariff_ha).has_state() &&
                  !isnan(id(dhw_tariff_ha).state) &&
                  id(oq_dhw_tariff_running_avg_eur) > 0.0f) {
                const float ratio = id(dhw_tariff_ha).state /
                                    id(oq_dhw_tariff_running_avg_eur);
                const float threshold = id(oq_dhw_legionella_cheap_ratio).state;
                cheap_window = (ratio < threshold);
                cheap_source_valid = true;
              }

              if (cheap_source_valid && !cheap_window) {
                // Niet goedkoop nu — start of vervolg wachttijd
                if (id(oq_dhw_legionella_waiting_since_epoch_s) == 0) {
                  id(oq_dhw_legionella_waiting_since_epoch_s) = now_epoch_leg;
                }
                const int64_t wait_s = now_epoch_leg -
                                       id(oq_dhw_legionella_waiting_since_epoch_s);
                const int64_t max_wait_s = (int64_t)(
                    id(oq_dhw_legionella_max_wait_h).state * 3600.0f);
                if (wait_s < max_wait_s) {
                  // Nog binnen max-wait → blijf wachten
                  in.legionella_force_request = false;
                  id(oq_dhw_legionella_defer_reason_code) = 2;
                } else {
                  // Max-wait bereikt → forceer start, veiligheid wint
                  id(oq_dhw_legionella_defer_reason_code) = 3;
                  id(oq_dhw_legionella_waiting_since_epoch_s) = 0;
                }
              } else if (cheap_window) {
                // Goedkoop nu → reset waiting, run mag starten
                id(oq_dhw_legionella_waiting_since_epoch_s) = 0;
              }
              // Geen valide bron → geen tariff-restrictie, run start direct
            }
          } else {
            // Geen force request → reset wachttijd
            id(oq_dhw_legionella_waiting_since_epoch_s) = 0;
          }

          // ===========================================================
          // v0.32 DHW smart features — modify cfg.start_top_c and other
          // inputs based on tariff, PV, and adaptive usage learning.
          // ===========================================================
          const uint32_t smart_now_ms = (uint32_t) millis();
          const uint32_t smart_prev_ms = id(oq_dhw_smart_last_loop_ms);
          float smart_dt_s = (smart_prev_ms > 0 && smart_now_ms > smart_prev_ms)
              ? (float)(smart_now_ms - smart_prev_ms) / 1000.0f : 30.0f;
          if (smart_dt_s > 600.0f) smart_dt_s = 600.0f;
          id(oq_dhw_smart_last_loop_ms) = smart_now_ms;

          auto clampf_dhw = [](float v, float lo, float hi)->float {
            if (v < lo) return lo;
            if (v > hi) return hi;
            return v;
          };

          // ----- #1 Tariff-aware shift on start_top_c -----
          float tariff_shift_target_c = 0.0f;
          if (id(oq_dhw_tariff_shift_enable).state &&
              id(electricity_tariff_now_ha).has_state() &&
              !isnan(id(electricity_tariff_now_ha).state)) {
            const float tariff_now = id(electricity_tariff_now_ha).state;
            float tariff_avg = id(electricity_tariff_avg24_ha).has_state()
                ? id(electricity_tariff_avg24_ha).state : NAN;
            if (isnan(tariff_avg) || tariff_avg <= 0.0f || tariff_avg > 5.0f) {
              tariff_avg = id(oq_dhw_tariff_running_avg_eur);
            }
            // Maintain own running 24h average as fallback.
            const uint32_t tariff_dt_ms = (id(oq_dhw_tariff_avg_last_update_ms) > 0 &&
                                           smart_now_ms > id(oq_dhw_tariff_avg_last_update_ms))
                ? (smart_now_ms - id(oq_dhw_tariff_avg_last_update_ms)) : 0UL;
            if (tariff_dt_ms > 30000UL) {
              const float tau24h_s = 86400.0f;
              const float dt_run = (float) tariff_dt_ms / 1000.0f;
              const float a = 1.0f - expf(-dt_run / tau24h_s);
              float run_avg = id(oq_dhw_tariff_running_avg_eur);
              if (run_avg <= 0.0f || isnan(run_avg) || run_avg > 5.0f) run_avg = tariff_now;
              else run_avg += a * (tariff_now - run_avg);
              id(oq_dhw_tariff_running_avg_eur) = run_avg;
              id(oq_dhw_tariff_avg_last_update_ms) = smart_now_ms;
              if (isnan(tariff_avg) || tariff_avg <= 0.0f) tariff_avg = run_avg;
            }
            if (!isnan(tariff_avg) && tariff_avg > 0.0f) {
              const float ratio = tariff_now / tariff_avg;
              const float cheap = clampf_dhw(id(oq_dhw_tariff_cheap_ratio).state, 0.30f, 0.95f);
              const float expensive = clampf_dhw(id(oq_dhw_tariff_expensive_ratio).state, 1.05f, 2.50f);
              const float max_pre = clampf_dhw(id(oq_dhw_tariff_preheat_max_c).state, 0.0f, 5.0f);
              const float max_def = clampf_dhw(id(oq_dhw_tariff_defer_max_c).state, 0.0f, 4.0f);
              if (ratio <= cheap) {
                const float frac = clampf_dhw((cheap - ratio) / fmaxf(0.05f, cheap), 0.0f, 1.0f);
                tariff_shift_target_c = max_pre * frac;
              } else if (ratio >= expensive) {
                const float frac = clampf_dhw((ratio - expensive) / fmaxf(0.10f, expensive), 0.0f, 1.0f);
                tariff_shift_target_c = -max_def * frac;
              }
            }
          }
          // Slew at 0.2 K/min — DHW reacts slower than heating; tariff jumps
          // shouldn't whip the start drempel hard.
          {
            const float slew_per_s = 0.2f / 60.0f;
            float shift = id(oq_dhw_tariff_shift_c);
            if (isnan(shift)) shift = 0.0f;
            const float step = slew_per_s * smart_dt_s;
            if (tariff_shift_target_c > shift)
              shift = fminf(tariff_shift_target_c, shift + step);
            else if (tariff_shift_target_c < shift)
              shift = fmaxf(tariff_shift_target_c, shift - step);
            id(oq_dhw_tariff_shift_c) = shift;
          }

          // ----- #2 PV self-consumption shift on start_top_c -----
          float pv_shift_target_c = 0.0f;
          if (id(oq_dhw_pv_boost_dynamic_enable).state &&
              id(grid_net_power_ha).has_state() &&
              !isnan(id(grid_net_power_ha).state)) {
            const float grid_net = id(grid_net_power_ha).state;
            const float export_w = (grid_net < 0.0f) ? -grid_net : 0.0f;
            const float threshold_w = clampf_dhw(id(oq_dhw_pv_export_threshold_w).state, 200.0f, 5000.0f);
            const float max_shift = clampf_dhw(id(oq_dhw_pv_max_shift_c).state, 0.0f, 6.0f);
            if (export_w > threshold_w) {
              // Linear: at threshold → 0; at threshold + 3kW → max_shift.
              const float frac = clampf_dhw((export_w - threshold_w) / 3000.0f, 0.0f, 1.0f);
              pv_shift_target_c = max_shift * frac;
            }
          }
          {
            const float slew_per_s = 0.5f / 60.0f;
            float shift = id(oq_dhw_pv_shift_c);
            if (isnan(shift)) shift = 0.0f;
            const float step = slew_per_s * smart_dt_s;
            if (pv_shift_target_c > shift)
              shift = fminf(pv_shift_target_c, shift + step);
            else if (pv_shift_target_c < shift)
              shift = fmaxf(pv_shift_target_c, shift - step);
            id(oq_dhw_pv_shift_c) = shift;
          }

          // ----- #3 Adaptive usage pattern shift -----
          float adaptive_shift_target_c = 0.0f;
          if (id(oq_dhw_adaptive_usage_enable).state) {
            auto now_clk = id(oq_time).now();
            if (now_clk.is_valid()) {
              const int lookahead_min = (int) clampf_dhw(id(oq_dhw_adaptive_lookahead_min).state, 15.0f, 90.0f);
              const int total_min = now_clk.hour * 60 + now_clk.minute + lookahead_min;
              const int look_h = (total_min / 60) % 24;
              float upcoming = 0.0f;
              switch (look_h) {
                case 0:  upcoming = id(oq_dhw_usage_hour_0); break;
                case 1:  upcoming = id(oq_dhw_usage_hour_1); break;
                case 2:  upcoming = id(oq_dhw_usage_hour_2); break;
                case 3:  upcoming = id(oq_dhw_usage_hour_3); break;
                case 4:  upcoming = id(oq_dhw_usage_hour_4); break;
                case 5:  upcoming = id(oq_dhw_usage_hour_5); break;
                case 6:  upcoming = id(oq_dhw_usage_hour_6); break;
                case 7:  upcoming = id(oq_dhw_usage_hour_7); break;
                case 8:  upcoming = id(oq_dhw_usage_hour_8); break;
                case 9:  upcoming = id(oq_dhw_usage_hour_9); break;
                case 10: upcoming = id(oq_dhw_usage_hour_10); break;
                case 11: upcoming = id(oq_dhw_usage_hour_11); break;
                case 12: upcoming = id(oq_dhw_usage_hour_12); break;
                case 13: upcoming = id(oq_dhw_usage_hour_13); break;
                case 14: upcoming = id(oq_dhw_usage_hour_14); break;
                case 15: upcoming = id(oq_dhw_usage_hour_15); break;
                case 16: upcoming = id(oq_dhw_usage_hour_16); break;
                case 17: upcoming = id(oq_dhw_usage_hour_17); break;
                case 18: upcoming = id(oq_dhw_usage_hour_18); break;
                case 19: upcoming = id(oq_dhw_usage_hour_19); break;
                case 20: upcoming = id(oq_dhw_usage_hour_20); break;
                case 21: upcoming = id(oq_dhw_usage_hour_21); break;
                case 22: upcoming = id(oq_dhw_usage_hour_22); break;
                case 23: upcoming = id(oq_dhw_usage_hour_23); break;
              }
              // Map upcoming intensity (typically 0..3+ events) to shift fraction.
              // 1 event → 50% of max, 2 → 80%, 3+ → 100%.
              const float max_adaptive = clampf_dhw(id(oq_dhw_adaptive_max_shift_c).state, 0.0f, 4.0f);
              float frac = upcoming / 3.0f;
              if (frac > 1.0f) frac = 1.0f;
              if (frac < 0.0f) frac = 0.0f;
              adaptive_shift_target_c = max_adaptive * frac;
            }
          }
          // Adaptive: instant apply (no slew), reset to 0 when disabled.
          id(oq_dhw_adaptive_shift_c) = adaptive_shift_target_c;

          // ----- Apply combined shifts to cfg.start_top_c -----
          // Effective start_top = configured + tariff_shift + pv_shift + adaptive_shift,
          // clamped within the same range as the user-configurable number entity.
          {
            const float total_shift = id(oq_dhw_tariff_shift_c) +
                                       id(oq_dhw_pv_shift_c) +
                                       id(oq_dhw_adaptive_shift_c);
            float effective_start = cfg.start_top_c + total_shift;
            // Hard bounds so we never exceed safe-tank ranges.
            // Allow up to hp_stop_top_c - 1.0K (avoid impossible-to-satisfy start).
            const float upper_bound = fmaxf(cfg.start_top_c, cfg.hp_stop_top_c - 1.0f);
            effective_start = clampf_dhw(effective_start, 30.0f, upper_bound);
            cfg.start_top_c = effective_start;
          }

          // ----- #2 PV-driven solar boost: also force solar boost element when
          // grid is exporting hard enough to cover the element load. -----
          if (id(oq_dhw_pv_boost_dynamic_enable).state &&
              id(grid_net_power_ha).has_state() &&
              !isnan(id(grid_net_power_ha).state)) {
            const float grid_net = id(grid_net_power_ha).state;
            const float export_w = (grid_net < 0.0f) ? -grid_net : 0.0f;
            // Element ≈ 3 kW; only force boost when export safely covers it.
            if (export_w > 2700.0f) {
              in.solar_boost_request = true;
            }
          }

          // ----- #5 Smart legionella deferral -----
          // v0.40: We tracken op tank_bottom_c (i.p.v. tank_top_c) zodat de
          // detectie van "natuurlijke pasteurisatie" alleen triggert als de
          // HELE tank op pasteurisatie-temp is geweest (bottom = moeilijkste
          // punt). Tank top haalt vaak 68°C zonder dat bottom mee gaat —
          // dat is geen volledige pasteurisatie.
          // Fallback: als tank_bottom_c niet beschikbaar, val terug op top.
          {
            float deferral_temp = NAN;
            if (!isnan(in.tank_bottom_c)) {
              deferral_temp = in.tank_bottom_c;
            } else if (!isnan(in.tank_top_c)) {
              deferral_temp = in.tank_top_c;
            }
            if (id(oq_dhw_smart_legionella_enable).state &&
                !isnan(deferral_temp) &&
                deferral_temp >= cfg.legionella_target_c) {
              auto now_legi = id(oq_time).now();
              if (now_legi.is_valid()) {
                id(oq_dhw_natural_60c_last_seen_epoch_s) = (int64_t) now_legi.timestamp;
              }
            }
          }

          // ============================================================
          // CM6 - Element Only DHW Heating override (BEFORE controller.tick)
          //
          // Minimum-impact mode: only the 3 kW DHW-tank element is driven
          // from oq_cm6_element_on (thermostatic loop in supervisor).
          // EVERYTHING ELSE blijft ongemoeid:
          //   - 3-wegklep wordt NIET aangestuurd (blijft in laatste stand)
          //   - HP-request / target_flow / block_cv_priority worden NIET gewijzigd
          //   - DHW controller wordt NIET getickt (state machine pauzeert)
          //
          // HP compressors gaan automatisch naar Standby omdat cm_allows_hp
          // in heat_control/thermal_request_control geen CM6 toelaat — daar
          // hoeven we hier dus niets voor te doen.
          // ============================================================
          if (id(oq_control_mode_code) == 6) {
            if (id(oq_cm6_element_on)) {
              if (!id(boiler_relay).state) id(boiler_relay).turn_on();
            } else {
              if (id(boiler_relay).state) id(boiler_relay).turn_off();
            }
            return;
          }

          const auto out = controller.tick(in, cfg);

          // ============================================================
          // CM97 - Air Purge override: valve follows the purge state machine
          // (oq_purge_target_valve_dhw), DHW element stays OFF (no compressor,
          // no element), DHW controller outputs are ignored.
          // ============================================================
          if (id(oq_control_mode_code) == 97) {
            const bool want_valve_dhw = id(oq_purge_target_valve_dhw);
            if (want_valve_dhw) {
              if (!id(dhw_valve_relay).state) id(dhw_valve_relay).turn_on();
            } else {
              if (id(dhw_valve_relay).state) id(dhw_valve_relay).turn_off();
            }
            if (id(boiler_relay).state) id(boiler_relay).turn_off();
            id(oq_dhw_hp_request_active) = false;
            id(oq_dhw_target_flow_temp) = NAN;
            id(oq_dhw_block_cv_priority) = false;
            return;
          }

          const bool manual_test = id(oq_dhw_manual_test_mode).state;
          if (manual_test) {
            if (id(oq_dhw_manual_valve_cmd).state) {
              if (!id(dhw_valve_relay).state) id(dhw_valve_relay).turn_on();
            } else {
              if (id(dhw_valve_relay).state) id(dhw_valve_relay).turn_off();
            }

            if (id(oq_dhw_manual_element_cmd).state) {
              if (!id(boiler_relay).state) id(boiler_relay).turn_on();
            } else {
              if (id(boiler_relay).state) id(boiler_relay).turn_off();
            }

            id(oq_dhw_hp_request_active) = false;
            id(oq_dhw_target_flow_temp) = NAN;
            id(oq_dhw_block_cv_priority) = false;
          } else {
            if (out.valve_to_boiler) {
              if (!id(dhw_valve_relay).state) id(dhw_valve_relay).turn_on();
            } else {
              if (id(dhw_valve_relay).state) id(dhw_valve_relay).turn_off();
            }

            const bool valve_boiler_confirmed = !in.valve_feedback_valid || !in.valve_feedback_cv;
            // During legionella element-only phase the valve is deliberately in CV position
            // (heating circuit is released while the element finishes the tank to target).
            // out.element_on=true && out.block_cv_priority=false uniquely identifies this
            // phase: element can run without requiring valve_boiler_confirmed.
            const bool legionella_element_only_drive = out.element_on && !out.block_cv_priority;
            const bool element_drive = out.element_on && (valve_boiler_confirmed || legionella_element_only_drive);

            if (element_drive) {
              if (!id(boiler_relay).state) id(boiler_relay).turn_on();
            } else {
              if (id(boiler_relay).state) id(boiler_relay).turn_off();
            }

            id(oq_dhw_hp_request_active) = out.hp_dhw_request;
            id(oq_dhw_target_flow_temp) = out.target_flow_temp_c;
            id(oq_dhw_block_cv_priority) = out.block_cv_priority;
          }
          // ===========================================================
          // Coil-in based compressor level mapping with hysteresis.
          // Enabled via oq_dhw_coil_map_enable switch.
          // Min level = 1 (never off during DHW to prevent pendeling).
          // Max level = user-set oq_dhw_hp_level (default 4).
          // ===========================================================
          {
            const int base_level = (int) roundf(id(oq_dhw_hp_level).state);
            int mapped = base_level;
            if (id(oq_dhw_coil_map_enable).state && out.hp_dhw_request) {
              const float coil_in = id(dhw_coil_in_input).state;
              if (!isnan(coil_in)) {
                const float t1 = id(oq_dhw_coil_map_t1_c).state;  // 4→3
                const float t2 = id(oq_dhw_coil_map_t2_c).state;  // 3→2
                const float t3 = id(oq_dhw_coil_map_t3_c).state;  // 2→1
                const float h  = id(oq_dhw_coil_map_hyst_c).state;
                const int   cur = id(oq_dhw_coil_map_level);
                if (cur >= 4) {
                  mapped = (coil_in >= t1 + h) ? 3 : 4;
                } else if (cur == 3) {
                  if      (coil_in <  t1 - h) mapped = 4;
                  else if (coil_in >= t2 + h) mapped = 2;
                  else                        mapped = 3;
                } else if (cur == 2) {
                  if      (coil_in <  t2 - h) mapped = 3;
                  else if (coil_in >= t3 + h) mapped = 1;
                  else                        mapped = 2;
                } else {
                  // cur == 1
                  mapped = (coil_in < t3 - h) ? 2 : 1;
                }
                // Cap at user-set maximum; floor at 1 (never off)
                mapped = std::max(1, std::min(mapped, base_level));
              }
            } else {
              // Mapping disabled or HP not active: reset state to base level
              mapped = base_level;
            }
            // De coil-map houdt zijn eigen hysterese-state bij; die blijft
            // bewust ongeklemd, anders zou de zachte aanloop hieronder die
            // toestandsmachine vervuilen en zou de hysterese vanaf een te laag
            // niveau gaan rekenen.
            id(oq_dhw_coil_map_level) = mapped;

            // ----- Zachte aanloop -----
            // Bij het starten van de HP-fase kreeg de compressor meteen zijn
            // volle niveau (level 3-4, ~3 kW). Nu begint hij op level 1 en loopt
            // per stap op tot wat er gevraagd wordt. Beperkt de mechanische en
            // thermische schok bij het starten en geeft de olie tijd om mee te
            // gaan. 0 min = geen aanloop.
            int requested = mapped;
            {
              const uint32_t now_ss = (uint32_t) millis();
              const float step_min = id(oq_dhw_softstart_step_min).state;
              const uint32_t step_ms = (uint32_t) fmaxf(0.0f, step_min * 60000.0f);
              if (!out.hp_dhw_request || step_ms == 0) {
                // Buiten de HP-fase (of uitgeschakeld) staat de aanloop klaar
                // voor de volgende start.
                id(oq_dhw_softstart_cap) = 0;
                id(oq_dhw_softstart_next_ms) = 0;
              } else if (id(oq_dhw_softstart_cap) <= 0) {
                id(oq_dhw_softstart_cap) = 1;
                id(oq_dhw_softstart_next_ms) = now_ss + step_ms;
              } else if (id(oq_dhw_softstart_cap) < 10) {
                // Tekenvergelijking is rollover-veilig (millis wrapt na ~49 dagen).
                if ((int32_t) (now_ss - id(oq_dhw_softstart_next_ms)) >= 0) {
                  id(oq_dhw_softstart_cap) += 1;
                  id(oq_dhw_softstart_next_ms) = now_ss + step_ms;
                }
              }
              if (id(oq_dhw_softstart_cap) > 0 && requested > id(oq_dhw_softstart_cap)) {
                requested = id(oq_dhw_softstart_cap);
              }
            }
            id(oq_dhw_hp_level_request) = requested;
          }

          // ===========================================================
          // Stapsgewijze tweede-HP assist (single-HP DHW).
          //
          // De lead houdt zijn eigen niveau; de andere unit komt binnen op
          // level 1 en klimt per stap. Bewust stapsgewijs: in één klap naar duo
          // zet meer capaciteit in dan nodig en jaagt de aanvoertemperatuur op.
          //
          // Alleen tijdens de gewone DHW HP-fase (state 2). Tijdens legionella
          // (state 4) bewust uit: daar geldt juist het tanktop-plafond omdat de
          // perszijdedruk uit de hand liep.
          //
          // De bewakingsgrenzen sturen alleen deze beslissing aan; het cappen
          // van niveaus blijft bij de bestaande supply-temp-protection.
          // ===========================================================
          #if OQ_TOPOLOGY_DUO
          {
            const uint32_t now_ms_a = (uint32_t) millis();
            uint32_t dt_ms_a = 0;
            if (id(oq_dhw_assist_last_loop_ms) != 0 && now_ms_a > id(oq_dhw_assist_last_loop_ms)) {
              dt_ms_a = now_ms_a - id(oq_dhw_assist_last_loop_ms);
              if (dt_ms_a > 60000UL) dt_ms_a = 60000UL;  // gat na reboot/OTA niet meetellen
            }
            id(oq_dhw_assist_last_loop_ms) = now_ms_a;

            // --- Stijgsnelheid tanktop over een venster van 2 minuten ---
            const float top_now = id(dhw_tank_top_input).state;
            if (!isnan(top_now)) {
              if (id(oq_dhw_top_prev_ms) == 0 || now_ms_a < id(oq_dhw_top_prev_ms)) {
                id(oq_dhw_top_prev_c) = top_now;
                id(oq_dhw_top_prev_ms) = now_ms_a;
              } else if ((now_ms_a - id(oq_dhw_top_prev_ms)) >= 120000UL) {
                const float dt_min = (now_ms_a - id(oq_dhw_top_prev_ms)) / 60000.0f;
                if (dt_min > 0.0f && !isnan(id(oq_dhw_top_prev_c))) {
                  id(oq_dhw_top_rise_k_min) = (top_now - id(oq_dhw_top_prev_c)) / dt_min;
                }
                id(oq_dhw_top_prev_c) = top_now;
                id(oq_dhw_top_prev_ms) = now_ms_a;
              }
            }

            const bool assist_context =
                id(oq_dhw_assist_enable).state &&
                id(oq_dhw_single_hp_mode).state &&
                id(oq_dhw_hp_request_active) &&
                (id(oq_dhw_state_code) == 2);   // alleen DHW_HEAT_PUMP

            // --- Bewaking: persgas van BEIDE units en water-uit van de
            //     assisterende unit (de niet-lead). Gelatcht met een
            //     release-marge, zodat hij niet op de grens gaat klapperen.
            const float dis1 = id(hp1_gas_discharge_temp).state;
            const float dis2 = id(${dhw_secondary_gas_discharge_id}).state;
            const float dis_max_c = id(oq_dhw_assist_discharge_max_c).state;
            const float wout_max_c = id(oq_dhw_assist_water_out_max_c).state;
            // Assist = de unit die NIET de vastgezette lead is. Bij lead HP1
            // (de normale situatie) is dat HP2.
            const bool assist_is_hp2 = (id(oq_dhw_single_lead_hp) != 2);
            const float wout = assist_is_hp2 ? id(${heatpump_outlet_temp_id}).state
                                             : id(hp1_water_out_temp).state;

            // NaN telt nergens mee: een ontbrekende sensor mag de assist niet
            // blokkeren, maar mag een gelatchte guard ook niet vasthouden.
            // Daarom één predicaat, en vrijgeven op "niets staat nog boven de
            // release-marge" in plaats van "alles is aantoonbaar koel".
            auto above = [](float v, float limit) { return !isnan(v) && v >= limit; };
            const bool dis_over = above(dis1, dis_max_c) || above(dis2, dis_max_c);
            const bool wout_over = above(wout, wout_max_c);
            const bool trip = dis_over || wout_over;
            // Release: 5 K onder de persgasgrens, 2 K onder de watergrens.
            const bool still_hot =
                above(dis1, dis_max_c - 5.0f) || above(dis2, dis_max_c - 5.0f) ||
                above(wout, wout_max_c - 2.0f);
            // Snelboost heeft een eigen bewaking: daar draaien BEIDE units, dus
            // telt de heetste van de twee water-uittemperaturen mee -- niet
            // alleen die van de assisterende unit zoals bij de single-assist.
            // Voedt in.hp_thermal_limit_active bij de volgende tick.
            {
              const float w1 = id(hp1_water_out_temp).state;
              const float w2 = id(${heatpump_outlet_temp_id}).state;
              const bool boost_over =
                  dis_over || above(w1, wout_max_c) || above(w2, wout_max_c);
              const bool boost_still_hot =
                  above(dis1, dis_max_c - 5.0f) || above(dis2, dis_max_c - 5.0f) ||
                  above(w1, wout_max_c - 2.0f) || above(w2, wout_max_c - 2.0f);
              if (boost_over) {
                id(oq_dhw_hp_thermal_limit) = true;
              } else if (id(oq_dhw_hp_thermal_limit) && !boost_still_hot) {
                // Vrijgeven zodat een volgende boost niet meteen geblokkeerd
                // start. Binnen dezelfde boost komen de HP's niet meer terug.
                id(oq_dhw_hp_thermal_limit) = false;
              }
            }

            if (trip) {
              id(oq_dhw_assist_guard_active) = true;
              // Onthouden of dit puur de watergrens was. Alleen dan geldt de
              // vroege vrijgave verderop: koelt het water af, dan is de reden om
              // te blokkeren weg. Bij een persgas-trip zegt afgekoeld water niets
              // over de compressor zelf, dus daar blijft de volle wachttijd staan.
              id(oq_dhw_assist_water_trip) = wout_over && !dis_over;
            } else if (id(oq_dhw_assist_guard_active) && !still_hot) {
              id(oq_dhw_assist_guard_active) = false;
            }

            const uint32_t ENGAGE_MS  = 600000UL;  // 10 min aanhoudend tekort voor de 2e start
            const uint32_t STEP_MS    = 600000UL;  // 10 min tussen elke op-/afstap
            const uint32_t MINON_MS   = 900000UL;  // 15 min minimale draaitijd (anti-pendel)
            const uint32_t LOCKOUT_MS = 900000UL;  // 15 min voor hij terug mag komen

            auto drop_assist = [&](bool lockout) {
              id(oq_dhw_assist_level) = 0;
              id(oq_dhw_assist_eng_ms) = 0;
              id(oq_dhw_assist_step_ms) = 0;
              id(oq_dhw_assist_on_since_ms) = 0;
              if (lockout) {
                id(oq_dhw_assist_lockout_until_ms) = now_ms_a + LOCKOUT_MS;
              } else {
                // Einde van de HP-fase: schoon beginnen aan de volgende cyclus.
                // Een wachttijd uit de vorige cyclus laten doorlopen zou de
                // assist nodeloos blokkeren terwijl de tank weer koud is.
                id(oq_dhw_assist_lockout_until_ms) = 0;
                id(oq_dhw_assist_water_trip) = false;
              }
            };

            // Staart van de cyclus: tank bijna op temperatuur, laatste graden op
            // één compressor. Meteen eruit in plaats van stapsgewijs afbouwen --
            // dat duurt met stap- en minimale draaitijd al gauw een half uur,
            // precies in het gebied waar twee units het slechtst draaien.
            // Geen wachttijd nodig: zolang de bodem boven de drempel blijft
            // houdt deze tak de assist zelf tegen.
            const float bottom_now = id(dhw_tank_bottom_input).state;
            const float bottom_stop = id(oq_dhw_assist_bottom_stop_c).state;
            const bool tail_phase =
                !isnan(bottom_now) && !isnan(bottom_stop) && (bottom_now >= bottom_stop);

            if (!assist_context) {
              drop_assist(false);
              id(oq_dhw_top_rise_k_min) = NAN;
            } else if (id(oq_dhw_assist_guard_active)) {
              // Thermische grens geraakt: helemaal terug en op slot. Terugstappen
              // heeft hier weinig zin -- we zitten al aan de limiet van wat de
              // waterkring kwijt kan.
              if (id(oq_dhw_assist_level) > 0) drop_assist(true);
            } else if (tail_phase) {
              // Tank bijna op temperatuur: tweede unit eruit, laatste graden op
              // één compressor. Meteen, niet stapsgewijs -- afbouwen kost met
              // stap- en minimale draaitijd al gauw een half uur, precies in het
              // gebied waar twee units het slechtst draaien.
              // Geen wachttijd nodig: zolang de bodem boven de drempel blijft
              // houdt deze tak de assist zelf tegen.
              if (id(oq_dhw_assist_level) > 0) drop_assist(false);
              id(oq_dhw_assist_eng_ms) = 0;
            } else {
              int assist_cap = (int) lroundf(id(oq_dhw_assist_max_level).state);
              if (assist_cap < 1) assist_cap = 1;
              if (assist_cap > 10) assist_cap = 10;

              // "Lead haalt het niet": hij wordt om zijn volle toegestane niveau
              // gevraagd én de tanktop stijgt te traag.
              const int base_level = (int) roundf(id(oq_dhw_hp_level).state);
              const bool saturated = (id(oq_dhw_hp_level_request) >= base_level);
              const float rise = id(oq_dhw_top_rise_k_min);
              const float min_rise = id(oq_dhw_assist_min_rise_k_min).state;
              const bool too_slow = !isnan(rise) && (rise < min_rise);
              const bool short_of_it = saturated && too_slow;

              if (id(oq_dhw_assist_level) == 0) {
                const bool wait_elapsed =
                    (id(oq_dhw_assist_lockout_until_ms) == 0) ||
                    (now_ms_a >= id(oq_dhw_assist_lockout_until_ms));

                // Is hij eruit gegaan op de water-uit grens, dan mag hij ook
                // terug zodra dat water weer voldoende is afgekoeld -- dus de
                // wachttijd OF de temperatuur, wat het eerst komt. Wordt het
                // water snel koeler, dan is er geen reden meer om te blokkeren.
                // Ondergrens t.o.v. de guard-release (max - 2 K) zodat een te
                // hoog ingestelde drempel niet meteen na de trip vrijgeeft.
                float release_c = id(oq_dhw_assist_water_release_c).state;
                const float release_ceiling = wout_max_c - 2.0f;
                if (!isnan(release_c) && release_c > release_ceiling) release_c = release_ceiling;
                const bool water_released =
                    id(oq_dhw_assist_water_trip) &&
                    !isnan(wout) && !isnan(release_c) && (wout < release_c);

                const bool locked_out = !wait_elapsed && !water_released;
                if (short_of_it && !locked_out) id(oq_dhw_assist_eng_ms) += dt_ms_a;
                else id(oq_dhw_assist_eng_ms) = 0;
                if (id(oq_dhw_assist_eng_ms) >= ENGAGE_MS) {
                  id(oq_dhw_assist_level) = 1;
                  id(oq_dhw_assist_on_since_ms) = now_ms_a;
                  id(oq_dhw_assist_step_ms) = 0;
                  id(oq_dhw_assist_eng_ms) = 0;
                  id(oq_dhw_assist_lockout_until_ms) = 0;
                  id(oq_dhw_assist_water_trip) = false;
                }
              } else {
                const uint32_t on_elapsed = (now_ms_a >= id(oq_dhw_assist_on_since_ms))
                    ? (now_ms_a - id(oq_dhw_assist_on_since_ms)) : 0;
                id(oq_dhw_assist_step_ms) += dt_ms_a;
                if (short_of_it) {
                  if (id(oq_dhw_assist_level) < assist_cap &&
                      id(oq_dhw_assist_step_ms) >= STEP_MS) {
                    id(oq_dhw_assist_level) += 1;
                    id(oq_dhw_assist_step_ms) = 0;
                  }
                } else if (id(oq_dhw_assist_step_ms) >= STEP_MS) {
                  // Tank loopt weer goed op: stap terug, en pas eruit op level 1
                  // nadat de minimale draaitijd voorbij is.
                  if (id(oq_dhw_assist_level) > 1) {
                    id(oq_dhw_assist_level) -= 1;
                    id(oq_dhw_assist_step_ms) = 0;
                  } else if (on_elapsed >= MINON_MS) {
                    drop_assist(true);
                  }
                }
              }
            }
          }
          #else
          id(oq_dhw_assist_level) = 0;
          #endif

          id(oq_dhw_state_code) = (int) out.state;
          id(oq_dhw_fault_code) = (int) out.fault;

          // Snelboost-vlag komt uit de controller zelf, niet uit de schakelaar.
          // Anders zou het aanzetten van de knop midden in een gewone boost die
          // cyclus half omzetten: duo-inzet zonder de bijbehorende grenzen.
          const bool max_boost_now = controller.max_boost_active();
          id(oq_dhw_max_boost_active) = max_boost_now;
          // Knop dooft zodra de boost voorbij is, zodat hij niet blijft staan
          // en meteen een volgende cyclus forceert.
          if (!max_boost_now && id(oq_dhw_boost_now).state &&
              out.state == oq_dhw::State::IDLE_CV) {
            id(oq_dhw_boost_now).turn_off();
          }

          if (out.state_changed) {
            id(oq_dhw_state_text).publish_state(oq_dhw::state_name(out.state));
            ESP_LOGI("oq_dhw", "state -> %s", oq_dhw::state_name(out.state));
          }

          if (out.fault_changed) {
            id(oq_dhw_fault_text).publish_state(oq_dhw::fault_name(out.fault));
            if (out.fault != oq_dhw::Fault::NONE) {
              ESP_LOGE("oq_dhw", "fault -> %s", oq_dhw::fault_name(out.fault));
            } else {
              ESP_LOGI("oq_dhw", "fault cleared");
            }
          }

          // ===========================================================
          // v0.32 DHW post-tick observers
          //   #3 Tap-event detection → adaptive usage histogram
          //   #4 Tank standby-loss measurement during IDLE_CV
          // ===========================================================
          {
            const float top = id(dhw_tank_top_input).state;
            const uint32_t observe_now_ms = (uint32_t) millis();

            // ----- #3 Tap-event detection -----
            // Detect a sharp drop of the upper sensor while DHW is idle.
            // 5-min rolling snapshot, drop threshold 2 K → tap event.
            if (!isnan(top)) {
              const uint32_t snap_age_ms = (observe_now_ms >= id(oq_dhw_tank_top_prev_ms))
                  ? (observe_now_ms - id(oq_dhw_tank_top_prev_ms)) : 0;
              const bool snap_exists = !isnan(id(oq_dhw_tank_top_prev_c));
              if (!snap_exists || snap_age_ms >= 300000UL) {
                id(oq_dhw_tank_top_prev_c) = top;
                id(oq_dhw_tank_top_prev_ms) = observe_now_ms;
              }
              if (id(oq_dhw_adaptive_usage_enable).state && snap_exists &&
                  out.state == oq_dhw::State::IDLE_CV) {
                const float drop = id(oq_dhw_tank_top_prev_c) - top;
                const uint32_t since_last_tap_ms = (id(oq_dhw_last_tap_event_ms) > 0 &&
                                                    observe_now_ms > id(oq_dhw_last_tap_event_ms))
                    ? (observe_now_ms - id(oq_dhw_last_tap_event_ms)) : UINT32_MAX;
                // Tap event: 2K drop, debounced 10 min between events.
                if (drop >= 2.0f && since_last_tap_ms > 600000UL) {
                  auto now_clk = id(oq_time).now();
                  if (now_clk.is_valid()) {
                    const int h = now_clk.hour;
                    // Slow weekly decay: 0.985 per day → after a week, half-life-ish.
                    // Apply decay before increment so each event nudges the bucket.
                    auto bump = [](float &slot)->void {
                      slot = slot + 1.0f;
                      if (slot > 10.0f) slot = 10.0f;
                    };
                    switch (h) {
                      case 0:  bump(id(oq_dhw_usage_hour_0)); break;
                      case 1:  bump(id(oq_dhw_usage_hour_1)); break;
                      case 2:  bump(id(oq_dhw_usage_hour_2)); break;
                      case 3:  bump(id(oq_dhw_usage_hour_3)); break;
                      case 4:  bump(id(oq_dhw_usage_hour_4)); break;
                      case 5:  bump(id(oq_dhw_usage_hour_5)); break;
                      case 6:  bump(id(oq_dhw_usage_hour_6)); break;
                      case 7:  bump(id(oq_dhw_usage_hour_7)); break;
                      case 8:  bump(id(oq_dhw_usage_hour_8)); break;
                      case 9:  bump(id(oq_dhw_usage_hour_9)); break;
                      case 10: bump(id(oq_dhw_usage_hour_10)); break;
                      case 11: bump(id(oq_dhw_usage_hour_11)); break;
                      case 12: bump(id(oq_dhw_usage_hour_12)); break;
                      case 13: bump(id(oq_dhw_usage_hour_13)); break;
                      case 14: bump(id(oq_dhw_usage_hour_14)); break;
                      case 15: bump(id(oq_dhw_usage_hour_15)); break;
                      case 16: bump(id(oq_dhw_usage_hour_16)); break;
                      case 17: bump(id(oq_dhw_usage_hour_17)); break;
                      case 18: bump(id(oq_dhw_usage_hour_18)); break;
                      case 19: bump(id(oq_dhw_usage_hour_19)); break;
                      case 20: bump(id(oq_dhw_usage_hour_20)); break;
                      case 21: bump(id(oq_dhw_usage_hour_21)); break;
                      case 22: bump(id(oq_dhw_usage_hour_22)); break;
                      case 23: bump(id(oq_dhw_usage_hour_23)); break;
                    }
                    id(oq_dhw_last_tap_event_ms) = observe_now_ms;
                    ESP_LOGI("oq_dhw", "Tap event detected at hour %d (drop %.2fK).", h, drop);
                  }
                }
              }
            }

            // Slow daily decay applied roughly once per hour.
            // Approach: decay any time we see a state change to IDLE_CV that
            // crosses an hour boundary. To keep it simple, decay once every
            // ~3600 seconds based on observe_now_ms heuristic.
            {
              static uint32_t last_decay_ms = 0;
              if (last_decay_ms == 0) last_decay_ms = observe_now_ms;
              if (observe_now_ms - last_decay_ms >= 3600000UL) {
                const float decay = 0.985f;  // ≈ 1/2 over ~46 days
                id(oq_dhw_usage_hour_0)  *= decay; id(oq_dhw_usage_hour_1)  *= decay;
                id(oq_dhw_usage_hour_2)  *= decay; id(oq_dhw_usage_hour_3)  *= decay;
                id(oq_dhw_usage_hour_4)  *= decay; id(oq_dhw_usage_hour_5)  *= decay;
                id(oq_dhw_usage_hour_6)  *= decay; id(oq_dhw_usage_hour_7)  *= decay;
                id(oq_dhw_usage_hour_8)  *= decay; id(oq_dhw_usage_hour_9)  *= decay;
                id(oq_dhw_usage_hour_10) *= decay; id(oq_dhw_usage_hour_11) *= decay;
                id(oq_dhw_usage_hour_12) *= decay; id(oq_dhw_usage_hour_13) *= decay;
                id(oq_dhw_usage_hour_14) *= decay; id(oq_dhw_usage_hour_15) *= decay;
                id(oq_dhw_usage_hour_16) *= decay; id(oq_dhw_usage_hour_17) *= decay;
                id(oq_dhw_usage_hour_18) *= decay; id(oq_dhw_usage_hour_19) *= decay;
                id(oq_dhw_usage_hour_20) *= decay; id(oq_dhw_usage_hour_21) *= decay;
                id(oq_dhw_usage_hour_22) *= decay; id(oq_dhw_usage_hour_23) *= decay;
                last_decay_ms = observe_now_ms;
              }
            }

            // ----- #4 Tank standby-loss tracking -----
            // Measures dT/dt during IDLE_CV (no heating, no recent tap event)
            // and converts to UA_tank using assumed thermal capacity.
            // Only runs when there's no tap event in the last hour.
            if (out.state == oq_dhw::State::IDLE_CV && !isnan(top)) {
              const uint32_t since_last_tap_ms = (id(oq_dhw_last_tap_event_ms) == 0)
                  ? UINT32_MAX
                  : (observe_now_ms > id(oq_dhw_last_tap_event_ms)
                        ? (observe_now_ms - id(oq_dhw_last_tap_event_ms)) : 0);
              const bool tap_quiet = since_last_tap_ms > 3600000UL;  // > 1h
              if (tap_quiet) {
                if (isnan(id(oq_dhw_idle_temp_start_c))) {
                  id(oq_dhw_idle_temp_start_c) = top;
                  id(oq_dhw_idle_temp_start_ms) = observe_now_ms;
                } else {
                  const uint32_t window_ms = observe_now_ms - id(oq_dhw_idle_temp_start_ms);
                  // Sample every 30 minutes of pure standby.
                  if (window_ms >= 1800000UL) {
                    const float dT = id(oq_dhw_idle_temp_start_c) - top;
                    if (dT > 0.05f && dT < 5.0f) {
                      const float dt_h = (float) window_ms / 3600000.0f;
                      const float Tamb_room = 20.0f;
                      const float dT_ambient = id(oq_dhw_idle_temp_start_c) - Tamb_room;
                      if (dT_ambient > 5.0f) {
                        // Tank thermal capacity: water = 1.16 Wh/(L·K). User-configurable volume.
                        const float volume_l = id(oq_dhw_tank_volume_l).state;
                        const float tank_wh_per_k = (volume_l > 0.0f ? volume_l : 220.0f) * 1.16f;
                        const float energy_lost_wh = dT * tank_wh_per_k;
                        // Average loss rate (W) = energy / hours
                        const float p_loss_w = energy_lost_wh / dt_h;
                        const float ua_sample = p_loss_w / dT_ambient;
                        // Sanity: typical 0.5..5 W/K for residential boilers.
                        if (ua_sample > 0.2f && ua_sample < 15.0f) {
                          float ua_ema = id(oq_dhw_ua_tank_wpk);
                          const int n = id(oq_dhw_ua_tank_sample_count);
                          if (n < 4 || ua_ema <= 0.0f) {
                            ua_ema = (ua_ema <= 0.0f) ? ua_sample
                                  : (ua_ema + (ua_sample - ua_ema) / (float)(n + 1));
                          } else {
                            // Slow EMA, τ ≈ 7 days.
                            const float tau_s = 7.0f * 86400.0f;
                            const float a = 1.0f - expf(-(float) window_ms / 1000.0f / tau_s);
                            ua_ema += a * (ua_sample - ua_ema);
                          }
                          id(oq_dhw_ua_tank_wpk) = ua_ema;
                          id(oq_dhw_ua_tank_sample_count) = n + 1;
                        }
                      }
                    }
                    // Restart window for next sample.
                    id(oq_dhw_idle_temp_start_c) = top;
                    id(oq_dhw_idle_temp_start_ms) = observe_now_ms;
                  }
                }
              } else {
                // Tap event invalidates the standby window.
                id(oq_dhw_idle_temp_start_c) = NAN;
                id(oq_dhw_idle_temp_start_ms) = 0;
              }
            } else {
              // Active heating phase invalidates the standby window.
              id(oq_dhw_idle_temp_start_c) = NAN;
              id(oq_dhw_idle_temp_start_ms) = 0;
            }
          }

          // Legionella run diagnostics on wallclock time (persistent over reboot).
          {
            auto now = id(oq_time).now();
            const bool now_valid = now.is_valid();
            const int64_t now_epoch_s = now_valid ? (int64_t) now.timestamp : 0;
            const int64_t interval_s = (int64_t) (cfg.legionella_interval_ms / 1000UL);

            if (now_valid && id(oq_dhw_legionella_anchor_epoch_s) <= 0) {
              id(oq_dhw_legionella_anchor_epoch_s) = now_epoch_s;
            }

            static int prev_state_code = (int) oq_dhw::State::IDLE_CV;
            const int cur_state_code = (int) out.state;
            const bool legionella_completed =
                now_valid &&
                (prev_state_code == (int) oq_dhw::State::LEGIONELLA) &&
                (cur_state_code == (int) oq_dhw::State::IDLE_CV) &&
                (out.fault == oq_dhw::Fault::NONE);
            if (legionella_completed) {
              id(oq_dhw_legionella_last_done_epoch_s) = now_epoch_s;
              // Auto-reset the force switch so a completed run does not retrigger
              // an immediate next run. Without this the switch stays on indefinitely
              // and the controller would loop legionella runs back-to-back.
              if (id(oq_dhw_src_legionella_force).state) {
                id(oq_dhw_src_legionella_force).turn_off();
              }
            }

            // Track legionella run start/end for ETA and elapsed-time sensors.
            const bool legionella_starting =
                (prev_state_code != (int) oq_dhw::State::LEGIONELLA) &&
                (cur_state_code == (int) oq_dhw::State::LEGIONELLA);
            const bool legionella_ending =
                (prev_state_code == (int) oq_dhw::State::LEGIONELLA) &&
                (cur_state_code != (int) oq_dhw::State::LEGIONELLA);
            if (legionella_starting) {
              id(oq_dhw_legionella_run_started_ms) = (uint32_t) millis();
              id(oq_dhw_legionella_target_reached_ms) = 0;
            }
            if (legionella_ending) {
              id(oq_dhw_legionella_run_started_ms) = 0;
              id(oq_dhw_legionella_target_reached_ms) = 0;
            }
            // While running: capture the moment de gemonitorde temp het target
            // raakt. v0.40: bottom met fallback naar top (consistent met
            // handle_legionella_ in de .h controller).
            if (cur_state_code == (int) oq_dhw::State::LEGIONELLA &&
                id(oq_dhw_legionella_target_reached_ms) == 0) {
              float leg_temp_now = NAN;
              if (!isnan(in.tank_bottom_c)) {
                leg_temp_now = in.tank_bottom_c;
              } else if (!isnan(in.tank_top_c)) {
                leg_temp_now = in.tank_top_c;
              }
              if (!isnan(leg_temp_now) && leg_temp_now >= cfg.legionella_target_c) {
                id(oq_dhw_legionella_target_reached_ms) = (uint32_t) millis();
              }
            }

            prev_state_code = cur_state_code;

            std::string last_run = "Nog niet uitgevoerd";
            const int64_t last_done_epoch = id(oq_dhw_legionella_last_done_epoch_s);
            if (last_done_epoch > 0) {
              last_run = fmt_epoch_local(last_done_epoch);
              if (now_valid && now_epoch_s >= last_done_epoch) {
                last_run += std::string(" (") + "geleden " + fmt_eta_s(now_epoch_s - last_done_epoch) + ")";
              }
            }

            std::string next_run = "Uitgeschakeld";
            if (interval_s > 0) {
              const int64_t base_epoch =
                  (last_done_epoch > 0) ? last_done_epoch : id(oq_dhw_legionella_anchor_epoch_s);
              if (base_epoch > 0) {
                const int64_t due_epoch = base_epoch + interval_s;
                next_run = fmt_epoch_local(due_epoch);
                if (now_valid) {
                  if (now_epoch_s >= due_epoch) {
                    next_run += std::string(" (nu verschuldigd)");
                  } else {
                    next_run += std::string(" (over ") + fmt_eta_s(due_epoch - now_epoch_s) + ")";
                  }
                }
              } else {
                next_run = "Wachten op tijdsync";
              }
            }

            static std::string last_pub_last = "";
            static std::string last_pub_next = "";
            if (last_run != last_pub_last) {
              id(oq_dhw_legionella_last_run_text).publish_state(last_run.c_str());
              last_pub_last = last_run;
            }
            if (next_run != last_pub_next) {
              id(oq_dhw_legionella_next_run_text).publish_state(next_run.c_str());
              last_pub_next = next_run;
            }
          }


