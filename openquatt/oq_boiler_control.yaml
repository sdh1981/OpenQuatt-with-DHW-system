# ============================================================================== 
# OpenQuatt - DHW Controller (Quatt Duo + 3-way valve + 3 kW element)
# ============================================================================== 
# Assumptions:
# - Tank/coil/feedback sensors are supplied from Home Assistant proxy entities.
# - Fallback "DHW source *" entities are exposed so users can manually map/drive
#   DHW inputs when external HA proxies are missing.
# - LilyGO valve aux feedback can be wired as a dry contact between 2 GPIOs:
#   one drive GPIO (held HIGH) and one sense GPIO (input with pulldown).
# - `valve_aux` raw semantics: ON=true means valve reports DHW/boiler position (AB->A).
#   Internally we convert this to `valve_feedback_cv` by inverting the raw bit.
# - OpenQuatt is currently controlled through published DHW request entities
#   (`oq_dhw_hp_request_active`, `oq_dhw_target_flow_temp`, `oq_dhw_block_cv_priority`).
#   This keeps the controller modular; an HA automation can map these to strategy setpoints.
# - Boiler relay output is used for the 3 kW element contactor.
# ============================================================================== 

output:
  - platform: gpio
    id: dhw_valve_relay_out
    pin:
      number: ${oq_dhw_valve_relay_pin}
      inverted: true

  - platform: gpio
    id: dhw_valve_aux_feedback_drive_out
    pin: ${oq_dhw_valve_aux_drive_pin}

  - platform: gpio
    id: boiler_relay_out
    pin:
      number: ${oq_boiler_relay_pin}
      inverted: true

globals:
  - id: oq_dhw_hp_request_active
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: oq_dhw_target_flow_temp
    type: float
    restore_value: false
    initial_value: 'NAN'

  - id: oq_dhw_block_cv_priority
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: oq_dhw_hp_level_request
    type: int
    restore_value: false
    initial_value: '4'

  - id: oq_dhw_state_code
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_dhw_fault_code
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_dhw_clear_fault_req
    type: bool
    restore_value: false
    initial_value: 'false'

  # Wallclock-based legionella bookkeeping (reboot persistent).
  - id: oq_dhw_legionella_last_done_epoch_s
    type: int64_t
    restore_value: true
    initial_value: '0'

  - id: oq_dhw_legionella_anchor_epoch_s
    type: int64_t
    restore_value: true
    initial_value: '0'

  # Tracks the millis() timestamp when the current legionella run started.
  # 0 = no run active. Used by ETA and elapsed-time sensors.
  - id: oq_dhw_legionella_run_started_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Tracks when tank_bottom (v0.40, was tank_top) first reached legionella_target_c during this run.
  # 0 = target not yet reached. Used to estimate remaining hold time.
  - id: oq_dhw_legionella_target_reached_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # ----- Handmatige snelboost -----
  # Actief = de lopende cyclus is een snelboost (HP1 + HP2 + element).
  - id: oq_dhw_max_boost_active
    type: bool
    restore_value: false
    initial_value: 'false'
  # Door de bewaking gezette thermische grens: persgas of water-uit te hoog.
  # Haalt tijdens een snelboost de HP's eruit; het element gaat door.
  - id: oq_dhw_hp_thermal_limit
    type: bool
    restore_value: false
    initial_value: 'false'

  # ----- Zachte aanloop van de DHW-compressor -----
  # Bovengrens die bij het starten van de HP-fase op 1 begint en per stap
  # oploopt, zodat de compressor niet ineens op zijn volle niveau wordt gezet.
  # 0 = geen aanloop actief (buiten de HP-fase).
  - id: oq_dhw_softstart_cap
    type: int
    restore_value: false
    initial_value: '0'
  - id: oq_dhw_softstart_next_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # ----- Stapsgewijze tweede-HP assist tijdens de DHW HP-fase -----
  # Draait alleen in single-HP mode: de vastgezette lead houdt zijn niveau, de
  # andere unit komt er stapsgewijs bij als de lead het alleen niet bijbeent.
  # Bewust NIET actief tijdens legionella -- daar geldt juist het tanktop-plafond
  # van 55 °C omdat de perszijdedruk daar uit de hand liep.
  - id: oq_dhw_assist_level
    type: int
    restore_value: false
    initial_value: '0'
  - id: oq_dhw_assist_eng_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: oq_dhw_assist_step_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: oq_dhw_assist_on_since_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: oq_dhw_assist_lockout_until_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Latched guard: blijft staan tot de temperatuur onder de release-marge zakt.
  - id: oq_dhw_assist_guard_active
    type: bool
    restore_value: false
    initial_value: 'false'
  # Was de laatste guard-trip puur de water-uit grens? Alleen dan mag de
  # wachttijd vroegtijdig vervallen zodra dat water weer is afgekoeld.
  - id: oq_dhw_assist_water_trip
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: oq_dhw_assist_last_loop_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Stijgsnelheid van de tanktop, over een venster gemeten (K/min).
  - id: oq_dhw_top_prev_c
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: oq_dhw_top_prev_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: oq_dhw_top_rise_k_min
    type: float
    restore_value: false
    initial_value: 'NAN'

  # ----- v0.32 DHW smart features -----

  # #1 Tariff-aware shift on effective start_top (°C). Positive = start earlier
  # (cheap window preheat), negative = defer start (expensive throttle).
  # Slewed; clamped within user-set bounds.
  - id: oq_dhw_tariff_shift_c
    type: float
    restore_value: false
    initial_value: '0.0'

  # #1 24h running average tariff (fallback when HA does not provide one).
  - id: oq_dhw_tariff_running_avg_eur
    type: float
    restore_value: true
    initial_value: '0.0'

  - id: oq_dhw_tariff_avg_last_update_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  - id: oq_dhw_smart_last_loop_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # #2 PV self-consumption shift on start_top (°C). When grid is exporting,
  # raise the effective start temperature so DHW kicks in earlier and uses
  # the surplus.
  - id: oq_dhw_pv_shift_c
    type: float
    restore_value: false
    initial_value: '0.0'

  # #3 Adaptive usage pattern — 24-bucket usage histogram (events / hour-of-day).
  # Floats so we can decay slowly. One bucket per hour 0..23.
  - id: oq_dhw_usage_hour_0
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: oq_dhw_usage_hour_1
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: oq_dhw_usage_hour_2
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: oq_dhw_usage_hour_3
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: oq_dhw_usage_hour_4
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: oq_dhw_usage_hour_5
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: oq_dhw_usage_hour_6
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: oq_dhw_usage_hour_7
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: oq_dhw_usage_hour_8
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: oq_dhw_usage_hour_9
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: oq_dhw_usage_hour_10
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: oq_dhw_usage_hour_11
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: oq_dhw_usage_hour_12
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: oq_dhw_usage_hour_13
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: oq_dhw_usage_hour_14
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: oq_dhw_usage_hour_15
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: oq_dhw_usage_hour_16
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: oq_dhw_usage_hour_17
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: oq_dhw_usage_hour_18
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: oq_dhw_usage_hour_19
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: oq_dhw_usage_hour_20
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: oq_dhw_usage_hour_21
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: oq_dhw_usage_hour_22
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: oq_dhw_usage_hour_23
    type: float
    restore_value: true
    initial_value: '0.0'

  # #3 Tap-event detection state
  - id: oq_dhw_tank_top_prev_c
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: oq_dhw_tank_top_prev_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: oq_dhw_last_tap_event_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # #3 Adaptive shift (°C) on start_top derived from upcoming usage pattern.
  - id: oq_dhw_adaptive_shift_c
    type: float
    restore_value: false
    initial_value: '0.0'

  # #4 Tank standby-loss tracker: UA_tank (W/K) and accumulators.
  - id: oq_dhw_ua_tank_wpk
    type: float
    restore_value: true
    initial_value: '0.0'

  - id: oq_dhw_ua_tank_sample_count
    type: int
    restore_value: true
    initial_value: '0'

  - id: oq_dhw_idle_temp_start_c
    type: float
    restore_value: false
    initial_value: 'NAN'

  - id: oq_dhw_idle_temp_start_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # #5 Smart legionella: track if tank ever reached legionella temp via
  # normal heating in the last 7 days. Updated on each tick.
  - id: oq_dhw_natural_60c_last_seen_epoch_s
    type: int64_t
    restore_value: true
    initial_value: '0'

  # v0.40 Tariff-aware legionella: tracks when we started waiting for a
  # cheap tariff window. 0 = not waiting. Used to enforce max-wait safety
  # so a sustained expensive period can't postpone legionella indefinitely.
  - id: oq_dhw_legionella_waiting_since_epoch_s
    type: int64_t
    restore_value: true
    initial_value: '0'

  # Mirror of the smart-defer suppression decision for diagnostic text.
  # 0 = not deferred, 1 = recent natural pasteurization, 2 = waiting cheap tariff
  - id: oq_dhw_legionella_defer_reason_code
    type: int
    restore_value: false
    initial_value: '0'

  # v0.40: avoid-expensive status code voor reguliere DHW cyclus.
  # 0 = niet geblokkeerd, 1 = duur uur (inhibit), 2 = duur uur maar emergency-override
  - id: oq_dhw_avoid_expensive_reason_code
    type: int
    restore_value: false
    initial_value: '0'

  # Coil-in level mapping — hysteresis state tracker.
  # Holds the last mapped level so direction-aware hysteresis works correctly.
  - id: oq_dhw_coil_map_level
    type: int
    restore_value: false
    initial_value: '4'

switch:
  - platform: output
    id: dhw_valve_relay
    name: "DHW valve relay"
    output: dhw_valve_relay_out
    icon: mdi:valve
    restore_mode: ALWAYS_OFF
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_boiler

  - platform: output
    id: boiler_relay
    name: "DHW element contactor"
    output: boiler_relay_out
    icon: mdi:water-boiler
    restore_mode: ALWAYS_OFF
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_boiler

  - platform: output
    id: dhw_valve_aux_feedback_drive
    name: "DHW valve aux feedback drive"
    output: dhw_valve_aux_feedback_drive_out
    icon: mdi:transmission-tower
    restore_mode: ALWAYS_ON
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_boiler

  - platform: template
    id: oq_dhw_lockout
    name: "DHW lockout"
    icon: mdi:lock-alert
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action: []
    turn_off_action: []
    web_server:
      sorting_group_id: oq_boiler

  - platform: template
