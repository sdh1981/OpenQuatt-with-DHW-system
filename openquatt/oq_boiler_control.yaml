  # v0.40: proactieve advance-window — als legionella binnen N uur GEPLAND
  # staat AND we zitten nu in de goedkoopste tariefvensters, dan triggeren
  # we de run NU in plaats van te wachten tot de geplande tijd.
  # Met advance_window_h = 24 wordt de run binnen dezelfde dag voorgetrokken
  # naar de cheap hour. Met 0 = uit.
  - platform: template
    id: oq_dhw_legionella_advance_window_h
