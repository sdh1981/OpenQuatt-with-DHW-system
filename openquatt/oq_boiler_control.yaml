  # Single HP mode for DHW. Forces only the lead HP to run during DHW cycles
  # so the second HP stays off. Avoids the "both HPs at level 1" COP-poor
  # steady state at low DHW level, and reduces compressor cycling on the
  # downstream HP (which runs hot at Tsup ~55 °C).
  - platform: template
    id: oq_dhw_single_hp_mode
    name: "DHW single HP mode"
    icon: mdi:numeric-1-circle-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action: []
    turn_off_action: []
    web_server:
      sorting_group_id: oq_boiler

  # Laat de tweede unit stapsgewijs bijspringen als de lead het alleen niet
  # bijbeent. Doet alleen iets in single-HP mode en alleen tijdens de gewone
  # DHW HP-fase -- niet tijdens legionella.
  - platform: template
    id: oq_dhw_assist_enable
    name: "DHW second HP assist"
    icon: mdi:stairs-up
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action: []
    turn_off_action: []
    entity_category: config
    web_server:
      sorting_group_id: oq_boiler

  # Coil-in level mapping enable switch.
  # When ON: compressor level is throttled automatically based on coil inlet temp.
