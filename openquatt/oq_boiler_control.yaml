    step: 1
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 24
    entity_category: config
    web_server:
      sorting_group_id: oq_boiler

  # When DHW single-HP mode is active, optionally bump the single HP's level
  # by this many steps to compensate for the lost capacity of the second HP.
  # 0 = no bump (lead HP runs at oq_dhw_hp_level), 2 = lead HP runs at level+2.
  # Stays clamped to [1, 10] in the request control.
  - platform: template
    id: oq_dhw_single_hp_level_bump
    name: "DHW single HP level bump"
    icon: mdi:plus-circle-outline
    min_value: 0
    max_value: 3
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 1
    entity_category: config
    web_server:
      sorting_group_id: oq_boiler

  # Zachte aanloop: tijd per stap bij het opbouwen van het compressorniveau aan
  # het begin van de DHW HP-fase (level 1 -> 2 -> 3 -> ...). 0 = uit, dan gaat de
  # compressor direct naar het gevraagde niveau zoals voorheen.
  - platform: template
    id: oq_dhw_softstart_step_min
    name: "DHW soft start step time"
    icon: mdi:ramp-left
    unit_of_measurement: "min"
    min_value: 0
    max_value: 15
    step: 0.5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 3
    entity_category: config
    web_server:
      sorting_group_id: oq_boiler

  # ----- Stapsgewijze tweede-HP assist -----
  # Vervangt de eerdere "val in één klap terug op duo": die sloeg de opbouw over
  # en zette beide units ineens aan. Nu komt de tweede unit op level 1 binnen en
  # klimt hij per stap, zodat we niet meer capaciteit inzetten dan nodig.
  - platform: template
    id: oq_dhw_assist_max_level
    name: "DHW assist max level"
    icon: mdi:stairs-up
    unit_of_measurement: "lvl"
    min_value: 1
    max_value: 10
    step: 1
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 3
    entity_category: config
    web_server:
      sorting_group_id: oq_boiler

  # Onder deze stijgsnelheid van de tanktop geldt de lead als "haalt het niet".
  # 220 L met ~3 kW netto komt op ruwweg 0,2 K/min; 0,10 is dus duidelijk traag
  # en niet zomaar de normale afvlakking aan het eind van een cyclus.
  - platform: template
    id: oq_dhw_assist_min_rise_k_min
    name: "DHW assist min tank rise"
    icon: mdi:trending-up
    unit_of_measurement: "K/min"
    min_value: 0.02
    max_value: 0.50
    step: 0.01
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 0.10
    entity_category: config
    web_server:
      sorting_group_id: oq_boiler

  # Bewaking. Deze grenzen sturen ALLEEN de assist-beslissing aan; ze zetten geen
  # tweede level-cap naast de bestaande supply-temp-protection (soft 55 / hard
  # 58 °C). Twee regelaars op hetzelfde signaal zouden tegen elkaar in werken.
  - platform: template
    id: oq_dhw_assist_discharge_max_c
    name: "DHW assist max discharge temp"
    icon: mdi:thermometer-alert
    unit_of_measurement: "°C"
    min_value: 70
    max_value: 110
    step: 1
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 90
    entity_category: config
    web_server:
      sorting_group_id: oq_boiler

  - platform: template
    id: oq_dhw_assist_water_out_max_c
    name: "DHW assist max water out"
    icon: mdi:thermometer-water
    unit_of_measurement: "°C"
    min_value: 45
    max_value: 62
    step: 0.5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 57
    entity_category: config
    web_server:
      sorting_group_id: oq_boiler

  # Snelboost: doeltemperatuur voor het element. Hoger dan de gewone boost (56)
  # zodat er na meerdere tappingen echt buffer in de tank zit.
  - platform: template
    id: oq_dhw_max_boost_target_c
    name: "DHW boost now target"
    icon: mdi:rocket-launch-outline
    unit_of_measurement: "°C"
    min_value: 50
    max_value: 65
    step: 0.5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 60
    entity_category: config
    web_server:
      sorting_group_id: oq_boiler

  # Snelboost: tanktop waarboven BEIDE HP's eruit gaan. Het element maakt de
  # resterende graden naar het doel hierboven alleen af. Bewust lager dan dat
  # doel: met een element dat dezelfde tank opstookt loopt de condensatiedruk
  # van de HP's daarboven te ver op -- zelfde reden als het legionella-plafond.
  - platform: template
    id: oq_dhw_max_boost_hp_stop_top_c
    name: "DHW boost now HP stop"
    icon: mdi:thermometer-chevron-up
    unit_of_measurement: "°C"
    min_value: 45
    max_value: 60
    step: 0.5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 55
    entity_category: config
    web_server:
      sorting_group_id: oq_boiler

  # Staart van de cyclus: zodra de tankbodem hier boven komt gaat de tweede unit
  # eruit en worden de laatste graden op één compressor gemaakt. De HP-fase zelf
  # stopt op tankbodem 52 °C, dus 48 laat ruwweg de laatste 4 K single draaien.
  #
  # Zonder deze grens bouwt de assist alleen op voortgang af: -1 per 10 min en
  # daarna nog de minimale draaitijd, samen al gauw een half uur. Juist aan het
  # eind van een cyclus is de tank heet, dus draaien twee compressors dan in hun
  # slechtste werkgebied -- hoge condensatietemperatuur, lage COP, hoogste
  # perszijdedruk. Deze drempel kapt dat af.
  #
  # Werkt op de tankbodem, net als de stopvoorwaarde van de HP-fase. Is de
  # bodemsensor niet beschikbaar, dan vervalt deze grens en blijft de assist
  # afbouwen op voortgang; de temperatuurbewaking blijft in beide gevallen actief.
  - platform: template
    id: oq_dhw_assist_bottom_stop_c
