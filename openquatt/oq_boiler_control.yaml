    update_interval: 60s
    entity_category: diagnostic
    disabled_by_default: true
    web_server:
      sorting_group_id: oq_boiler
    lambda: |-
      return (float) id(oq_dhw_ua_tank_sample_count);

  # #6 Estimated time-to-ready (minutes).
  - platform: template
    id: oq_dhw_time_to_ready_sensor
    name: "DHW estimated time to ready"
    icon: mdi:timer-sand
    unit_of_measurement: "min"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 30s
    web_server:
      sorting_group_id: oq_boiler
    lambda: |-
      // Only compute while DHW is heating (hp_request active or boost on).
      const bool active = id(oq_dhw_hp_request_active) || id(boiler_relay).state;
      if (!active) return NAN;
      const float top = id(dhw_tank_top_input).state;
      const float target = id(oq_dhw_hp_stop_top_c).state;
      if (isnan(top) || isnan(target)) return NAN;
      const float gap = target - top;
      if (gap <= 0.05f) return 0.0f;
      // Thermal capacity: water = 1.16 Wh/(L·K). User-configurable volume.
      const float volume_l = id(oq_dhw_tank_volume_l).state;
      const float tank_wh_per_k = (volume_l > 0.0f ? volume_l : 220.0f) * 1.16f;

      // Net heating power: estimate from the HP perf_map at the actual DHW
      // level + supply target, plus 3 kW element when boost is on, minus
      // standby loss (UA × ΔT_ambient).
      float p_in = 0.0f;
      if (id(oq_dhw_hp_request_active)) {
        const int dhw_level = id(oq_dhw_hp_level_request);
        const float Tamb = id(outside_temp_selected).state;
        const float Tsup = id(oq_dhw_hp_target_flow_c).state;
        float p_per_hp = NAN;
        if (!isnan(Tamb) && !isnan(Tsup) && dhw_level > 0) {
          p_per_hp = oq_perf::interp_power_th_w(dhw_level, Tamb, Tsup);
        }
        if (!isnan(p_per_hp) && p_per_hp > 0.0f) {
          p_in += p_per_hp;
          #if OQ_TOPOLOGY_DUO
          // Duo: both HPs are requested at the same DHW level.
          p_in += p_per_hp;
          #endif
        } else {
          // Conservative fallback when perf_map cannot interpolate (e.g. NaN cell).
          p_in += 3000.0f;
        }
      }
      if (id(boiler_relay).state) p_in += 3000.0f;
      const float ua = id(oq_dhw_ua_tank_wpk);
      const float Tamb_room = 20.0f;
      if (ua > 0.0f) p_in -= ua * fmaxf(0.0f, top - Tamb_room);
      if (p_in <= 50.0f) return NAN;
      const float hours = (gap * tank_wh_per_k) / p_in;
      return hours * 60.0f;

  # Legionella ETA (minutes remaining until the current run completes).
  # Returns NAN when no legionella run is active.
  # Computes the remaining time across three phases:
  #   Phase 1: HP + element heating up to legionella_hp_stop_top_c
  #   Phase 2: element-only heating up to legionella_target_c
  #   Phase 3: 15-min hold at legionella_target_c
  - platform: template
    id: oq_dhw_legionella_eta_sensor
    name: "DHW legionella ETA"
    icon: mdi:timer-sand
    unit_of_measurement: "min"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 30s
    web_server:
      sorting_group_id: oq_boiler
    lambda: |-
      // Only show ETA while a legionella run is active (state == LEGIONELLA == 4).
      if (id(oq_dhw_state_code) != 4) return NAN;

      const float top = id(dhw_tank_top_input).state;
      if (isnan(top)) return NAN;

      const float legionella_target = id(oq_dhw_legionella_target_c).state;
      // Deze ETA rekent in TOP-temperatuur, dus gebruik de top-grens van fase 1:
      // het HP-plafond. De handover op legionella_hp_stop_top_c toetst op de
      // tank-BODEM en is hier meestal niet de beperkende factor, omdat het element
      // de top sneller naar het plafond jaagt dan de bodem opwarmt.
      const float hp_top_stop = id(oq_dhw_legionella_hp_top_ceiling_c).state;
      const float volume_l = id(oq_dhw_tank_volume_l).state;
      const float tank_wh_per_k = (volume_l > 0.0f ? volume_l : 220.0f) * 1.16f;
      const float element_w = 3000.0f;

      // Standby loss estimate (small but real, ~50–100 W at 65°C).
      const float ua = id(oq_dhw_ua_tank_wpk);
      const float Tamb_room = 20.0f;
      auto net_power_w = [&](float power_in_w, float current_top)->float {
        float p = power_in_w;
        if (ua > 0.0f) p -= ua * fmaxf(0.0f, current_top - Tamb_room);
        return p;
      };

      float total_min = 0.0f;

      // Phase 3: 15-minute hold at target (always required).
      const uint32_t hold_required_ms = 15UL * 60UL * 1000UL;
      if (id(oq_dhw_legionella_target_reached_ms) > 0) {
        const uint32_t now_ms = (uint32_t) millis();
        const uint32_t elapsed_hold = (now_ms >= id(oq_dhw_legionella_target_reached_ms))
            ? (now_ms - id(oq_dhw_legionella_target_reached_ms)) : 0;
        const uint32_t hold_remaining_ms = (elapsed_hold < hold_required_ms)
            ? (hold_required_ms - elapsed_hold) : 0;
        total_min += (float) hold_remaining_ms / 60000.0f;
      } else {
        // Target not yet reached: full 15-min hold still ahead.
        total_min += 15.0f;
      }

      // Phase 2: element-only heating to legionella_target.
      const float phase2_from = std::max(top, hp_top_stop);
      if (phase2_from < legionella_target) {
        const float gap2 = legionella_target - phase2_from;
        const float wh_needed = gap2 * tank_wh_per_k;
        const float p_net = net_power_w(element_w, phase2_from);
        if (p_net > 50.0f) {
          total_min += (wh_needed / p_net) * 60.0f;
        } else {
          return NAN;  // element cannot overcome losses → indeterminate
        }
      }

      // Phase 1: HP + element heating to hp_top_stop (only if we're still in HP phase).
      // hp_phase_done_ in the controller maps to block_cv_priority=true while HP active.
      const bool hp_phase_active = id(oq_dhw_block_cv_priority) && (top < hp_top_stop);
      if (hp_phase_active) {
        const float gap1 = hp_top_stop - top;
        const float wh_needed = gap1 * tank_wh_per_k;

        float p_hp = 0.0f;
        const int dhw_level = id(oq_dhw_hp_level_request);
        const float Tamb = id(outside_temp_selected).state;
        const float Tsup = id(oq_dhw_hp_target_flow_c).state;
        if (!isnan(Tamb) && !isnan(Tsup) && dhw_level > 0) {
          p_hp = oq_perf::interp_power_th_w(dhw_level, Tamb, Tsup);
          #if OQ_TOPOLOGY_DUO
          if (!isnan(p_hp) && p_hp > 0.0f) p_hp *= 2.0f;
          #endif
        }
        if (isnan(p_hp) || p_hp <= 0.0f) p_hp = 3000.0f;  // conservative fallback

        const float p_net = net_power_w(p_hp + element_w, top);
        if (p_net > 50.0f) {
          total_min += (wh_needed / p_net) * 60.0f;
        }
      }

      return total_min;

  # Legionella elapsed time (minutes since the current run started).
  - platform: template
    id: oq_dhw_legionella_elapsed_sensor
    name: "DHW legionella elapsed"
    icon: mdi:timer-play-outline
    unit_of_measurement: "min"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 30s
    web_server:
      sorting_group_id: oq_boiler
    lambda: |-
      if (id(oq_dhw_state_code) != 4) return NAN;
      const uint32_t started = id(oq_dhw_legionella_run_started_ms);
      if (started == 0) return NAN;
      const uint32_t now_ms = (uint32_t) millis();
      const uint32_t elapsed = (now_ms >= started) ? (now_ms - started) : 0;
      return (float) elapsed / 60000.0f;

