  # UIT zetten zodra een fysieke circulatiepomp tussen tank-top en tank-
  # bottom is geinstalleerd. Default ON.
  - platform: template
    id: oq_dhw_legionella_coil_circulation_enable
    name: "DHW legionella coil circulation"
    icon: mdi:water-sync
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action: []
    turn_off_action: []
    entity_category: config
    web_server:
      sorting_group_id: oq_boiler

  # v0.40: vermijd DHW-cyclus tijdens duurste tariefvenster van de dag
  # (zie input_datetime.house_battery_strategy_dynamic_expensive_start/end).
  # Bij tank top < oq_dhw_emergency_top_c wordt veiligheidshalve toch
  # verwarmd, ook in duur uur.
  - platform: template
    id: oq_dhw_avoid_expensive_enable
    name: "DHW avoid expensive tariff"
    icon: mdi:cash-remove
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action: []
    turn_off_action: []
    entity_category: config
