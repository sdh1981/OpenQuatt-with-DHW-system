    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action: []
    turn_off_action: []
    entity_category: config
    web_server:
      sorting_group_id: oq_boiler

  # Handmatige snelboost: HP1 + HP2 + het 3 kW element tegelijk, voor als er
  # snel weer warm water moet zijn (meerdere douches achter elkaar).
  #
  # Anders dan de gewone cyclus begint deze meteen in de boost-fase, dus met
  # het element erbij vanaf het eerste moment. De HP's gaan er eerder uit dan
  # het element klaar is -- zie de grenzen hieronder.
  #
  # Negeert het DHW-tijdvenster, net als de legionella-force: dit is een
  # expliciete opdracht. Schakelt zichzelf uit zodra de boost klaar is.
  - platform: template
    id: oq_dhw_boost_now
    name: "DHW boost now"
    icon: mdi:rocket-launch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action: []
    turn_off_action: []
    web_server:
      sorting_group_id: oq_boiler

  - platform: template
    id: oq_dhw_solar_boost_auto
    name: "DHW solar boost auto"
    icon: mdi:cash-minus
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action: []
    turn_off_action: []
    entity_category: config
    web_server:
      sorting_group_id: oq_boiler

