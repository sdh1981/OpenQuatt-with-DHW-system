# ==============================================================================
# OpenQuatt - Quick Start Compatibility State
# ==============================================================================
#
# Purpose:
#   Keep the old Quick Start setup symbols available for compatibility, without
#   exposing them in the classic ESPHome web UI.
#
# Exposes:
#   - no visible web UI entities
# ==============================================================================

globals:
  - id: oq_setup_complete
    type: bool
    restore_value: true
    initial_value: 'true'

button:
  - platform: template
    id: oq_setup_complete_button
    name: "Complete setup"
    icon: mdi:check-bold
    entity_category: config
    internal: true
    on_press:
      - lambda: |-
          id(oq_setup_complete) = true;

  - platform: template
    id: oq_setup_reset_button
    name: "Reset setup state"
    icon: mdi:restart
    entity_category: config
    internal: true
    on_press:
      - lambda: |-
          id(oq_setup_complete) = true;

binary_sensor:
  - platform: template
    id: oq_setup_complete_sensor
    name: "Setup Complete"
    icon: mdi:check-circle-outline
    device_class: running
    entity_category: diagnostic
    internal: true
    lambda: |-
      return id(oq_setup_complete);
