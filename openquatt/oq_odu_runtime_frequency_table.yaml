# ==============================================================================
# OpenQuatt - EXPERIMENTEEL: frequentiekromme van de buitenunit tijdelijk zetten
# ==============================================================================
#
# Overgenomen van upstream (openquatt/experimental/
# oq_odu_runtime_frequency_table_hp.yaml). Daar zijn alle entiteiten
# `internal: true` omdat hun eigen webapp ze aanstuurt; die bouwt deze fork niet
# mee, dus hier staan ze gewoon in Home Assistant.
#
# --- LEES DIT EERST ---
# Dit schrijft over Modbus 22 registers naar de buitenunit: de koelkromme F0-F10
# en de verwarmingskromme F0-F10. Daarmee verander je wat "stand 3" voor de unit
# betekent in Hz.
#
# Het is VLUCHTIG. Er wordt naar de runtime-schaduw geschreven en de checksum op
# blad 3510/3511 blijft ongemoeid, dus een volledige power cycle van de
# buitenunit zet de fabriekstabel terug. Dat is je noodrem.
#
# Het is ook NIET afgestemd op de rest van OpenQuatt. `hp_perf_map.h` bevat
# gemeten vermogens en COP's per stand; verschuif je de Hz achter een stand, dan
# klopt die tabel niet meer en daarmee ook de vermogens-, COP- en
# dispatch-berekeningen die erop leunen. Gebruik dit voor korte, bewaakte
# proeven, niet als instelling die je laat staan.
#
# --- DE SCHRIJFGRENDEL STAAT NU OPEN ---
# `odu_freq_write_unlocked` in oq_substitutions_common.yaml staat op "1", op
# verzoek, voor een actieve afstelperiode. Op "0" weigert "tabel toepassen"
# meteen en komt er niets op de bus; ophalen en bewerken werken altijd.
#
# Er liggen nog drie lagen achter: de vrijgaveschakelaar, de schakelaar voor
# schrijven tijdens bedrijf, en de grens van 5 Hz per stand per keer. De eerste
# twee staan na elke herstart weer uit, dus een schrijfactie blijft een reeks
# bewuste handelingen -- alleen niet langer eentje die om flashen vraagt.
#
# --- Bediening ---
#   1. "tabel ophalen"      leest wat er NU in de unit staat naar de invoervakken
#   2. invoervakken aanpassen (0-120 Hz, moet oplopend zijn)
#   3. "schrijven vrijgeven" aanzetten
#   4. "tabel toepassen"     schrijft
#
# Stap 4 weigert standaard op een draaiende machine. Wil je afstellen zonder de
# unit tussen elke proef stil te leggen, zet dan "schrijven tijdens bedrijf"
# aan -- die schakelaar zet die tweede grendel opzij. Beide schakelaars staan
# na een herstart weer uit.
#
# --- MAXIMAAL 5 Hz PER KEER ---
# Vlak voor het schrijven wordt de tabel gelezen die op dat moment in de unit
# staat, en een stand mag daar hooguit MAX_STEP_HZ van afwijken. Dat is geen
# beperking van wat je kunt instellen maar van hoe snel: een grote wijziging
# maak je in stappen.
#
# De reden is deze vakken zelf. Ze hebben restore_value: true, dus een getal uit
# een eerdere proef blijft staan en ziet er precies zo uit als een bedoelde
# instelling. Vergeet je stap 1, dan schrijf je die oude waarde -- en dat kan
# midden in bedrijf zijn. De vergelijking gaat daarom tegen de unit, niet tegen
# wat hier op het scherm staat.
#
# De vrijgaveknop gaat er bij het schrijven automatisch weer uit: een druk is
# een schrijfactie. De status vertelt waar het strandde als er iets misgaat.
#
# Defaults hieronder zijn de fabriekswaarden zoals gemeten in de EEPROM-dumps
# van HP1 en HP2 (die zijn byte-identiek). Zie docs/odu-eeprom-parameters.md.
#
# Vereiste vars: hp_id, prefix
# ==============================================================================

switch:
  # Bewust `restore_mode: ALWAYS_OFF`: na een herstart van de ESP staat het
  # schrijven nooit vanzelf weer vrij.
  - platform: template
    id: ${hp_id}_odu_freq_write_enable
    name: "${prefix}EXPERIMENTEEL schrijven vrijgeven"
    icon: mdi:alert-decagram
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: oq_${hp_id}_freq
      sorting_weight: 30

  # Zet de tweede grendel opzij: schrijven terwijl de compressor draait.
  #
  # Uit (standaard) leest de component eerst werkmodus en compressorfrequentie
  # en weigert op een draaiende machine. Aan doet hij die lezing nog steeds --
  # het log legt vast waarin je geschreven hebt -- maar weigert niet meer.
  #
  # Waarom je dit zou willen: een kromme afstellen zonder de unit tussen elke
  # proef stil te leggen. Elke stop-start kost een compressorstart en vervuilt
  # je cycling-statistiek.
  #
  # Wat je overneemt: de buitenunit krijgt midden in bedrijf een andere
  # betekenis voor zijn standen. Draait hij op stand 8 en verschuif je die, dan
  # verandert zijn toerental buiten de normale niveauwissel om. Ook ALWAYS_OFF,
  # zodat dit nooit vanzelf aan staat na een herstart.
  - platform: template
    id: ${hp_id}_odu_freq_allow_while_running
    name: "${prefix}EXPERIMENTEEL schrijven tijdens bedrijf"
    icon: mdi:engine-outline
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: oq_${hp_id}_freq
      sorting_weight: 35

