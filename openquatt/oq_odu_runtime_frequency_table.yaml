button:
  - platform: template
    id: ${hp_id}_odu_freq_load
    name: "${prefix}EXPERIMENTEEL tabel ophalen"
    icon: mdi:table-arrow-down
    entity_category: config
    web_server:
      sorting_group_id: oq_${hp_id}_freq
    on_press:
      - lambda: |-
          oq_odu_runtime_frequency::RuntimeFrequencyTableRefs refs = {
              id(${hp_id}),
              id(${hp_id}_odu_eeprom_dump),
              id(${hp_id}_odu_freq_write_enable),
              id(${hp_id}_odu_freq_status),
              "${prefix}",
              {
                  id(${hp_id}_odu_freq_cool_f0),
                  id(${hp_id}_odu_freq_cool_f1),
                  id(${hp_id}_odu_freq_cool_f2),
                  id(${hp_id}_odu_freq_cool_f3),
                  id(${hp_id}_odu_freq_cool_f4),
                  id(${hp_id}_odu_freq_cool_f5),
                  id(${hp_id}_odu_freq_cool_f6),
                  id(${hp_id}_odu_freq_cool_f7),
                  id(${hp_id}_odu_freq_cool_f8),
                  id(${hp_id}_odu_freq_cool_f9),
                  id(${hp_id}_odu_freq_cool_f10)
              },
              {
                  id(${hp_id}_odu_freq_heat_f0),
                  id(${hp_id}_odu_freq_heat_f1),
                  id(${hp_id}_odu_freq_heat_f2),
                  id(${hp_id}_odu_freq_heat_f3),
                  id(${hp_id}_odu_freq_heat_f4),
                  id(${hp_id}_odu_freq_heat_f5),
                  id(${hp_id}_odu_freq_heat_f6),
                  id(${hp_id}_odu_freq_heat_f7),
                  id(${hp_id}_odu_freq_heat_f8),
                  id(${hp_id}_odu_freq_heat_f9),
                  id(${hp_id}_odu_freq_heat_f10)
              },
          };
          oq_odu_runtime_frequency::load_runtime_table(refs);

  - platform: template
    id: ${hp_id}_odu_freq_apply
    name: "${prefix}EXPERIMENTEEL tabel toepassen"
    icon: mdi:alert-circle-check-outline
    entity_category: config
    web_server:
      sorting_group_id: oq_${hp_id}_freq
    on_press:
      - lambda: |-
          oq_odu_runtime_frequency::RuntimeFrequencyTableRefs refs = {
              id(${hp_id}),
              id(${hp_id}_odu_eeprom_dump),
              id(${hp_id}_odu_freq_write_enable),
              id(${hp_id}_odu_freq_status),
              "${prefix}",
              {
                  id(${hp_id}_odu_freq_cool_f0),
                  id(${hp_id}_odu_freq_cool_f1),
                  id(${hp_id}_odu_freq_cool_f2),
                  id(${hp_id}_odu_freq_cool_f3),
                  id(${hp_id}_odu_freq_cool_f4),
                  id(${hp_id}_odu_freq_cool_f5),
                  id(${hp_id}_odu_freq_cool_f6),
                  id(${hp_id}_odu_freq_cool_f7),
                  id(${hp_id}_odu_freq_cool_f8),
                  id(${hp_id}_odu_freq_cool_f9),
                  id(${hp_id}_odu_freq_cool_f10)
              },
              {
                  id(${hp_id}_odu_freq_heat_f0),
                  id(${hp_id}_odu_freq_heat_f1),
                  id(${hp_id}_odu_freq_heat_f2),
                  id(${hp_id}_odu_freq_heat_f3),
                  id(${hp_id}_odu_freq_heat_f4),
                  id(${hp_id}_odu_freq_heat_f5),
                  id(${hp_id}_odu_freq_heat_f6),
                  id(${hp_id}_odu_freq_heat_f7),
                  id(${hp_id}_odu_freq_heat_f8),
                  id(${hp_id}_odu_freq_heat_f9),
                  id(${hp_id}_odu_freq_heat_f10)
              },
          };
          oq_odu_runtime_frequency::apply_runtime_table(
              refs, id(${hp_id}_odu_freq_write_enable)->state);

text_sensor:
  # `update_interval: never` -- deze sensor wordt alleen door de lambdas gevuld.
  - platform: template
    id: ${hp_id}_odu_freq_status
    name: "${prefix}EXPERIMENTEEL frequentietabel status"
    icon: mdi:alert-decagram-outline
    entity_category: diagnostic
    update_interval: never
    web_server:
      sorting_group_id: oq_${hp_id}_freq
