# ==============================================================================
# OpenQuatt - Power House Strategy
# ==============================================================================
#
# Goal:
#   Owns the complete Power House strategy implementation and its compressor-request output.
#
# Ownership:
#   - Computes Power House requested heat and compatible demand from room/outside state
#   - Publishes Power House tuning and diagnostics
#   - Computes filtered Power House demand from oq_demand_raw
#   - Chooses the Power House topology / compressor requests
#   - Publishes request outputs for oq_thermal_request_control through the
#     shared request interface before downstream actuator handling
# ==============================================================================

globals:
  # Power House requested thermal power (W).
  # This is strategy-specific diagnostics/state and is not part of the generic
  # heating-strategy interface.
  - id: oq_phouse_req_w
    type: float
    restore_value: false
    initial_value: '0.0'

  - id: oq_phouse_last_w
    type: float
    restore_value: false
    initial_value: '0.0'

  - id: oq_phouse_last_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Internal comfort memory that slowly builds when the room stays on the cold
  # side for longer. This nudges the effective cold-side target upward so Power
  # House behaves more like the older warm-leaning model, without exposing the
  # old bias/tau controls in the UI.
  - id: oq_phouse_comfort_memory_c
    type: float
    restore_value: false
    initial_value: '0.0'

  - id: oq_demand_filter_ramp_up_budget
    type: float
    restore_value: false
    initial_value: '0.0'

  - id: oq_ph_request_last_loop_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  - id: oq_ph_request_hp1_level
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_ph_request_hp2_level
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_ph_request_owner_hp
    type: int
    restore_value: false
    initial_value: '0'

  # 0=idle, 1=fallback_idle, 2=fallback_single_hp1, 3=fallback_single_hp2,
  # 4=fallback_duo, 5=keep_current, 6=hold_active, 7=defrost_hold,
  # 8=better_heat, 9=soft_guard, 10=less_power, 11=no_candidate,
  # 12=defrost_boost, 13=runtime_lead, 14=single_topology,
  # 15=oil_return_hold
  - id: oq_ph_request_reason_code
    type: int
    restore_value: false
    initial_value: '0'

  # ----- v0.32 thermal model improvements -----
  # #2 Solar/internal gain residual EMA (W). Built from sustained over-shoot of
  # the comfort band relative to predicted P_house in mild weather.
  - id: oq_phouse_solar_gain_w
    type: float
    restore_value: false
    initial_value: '0.0'

  # #1 Self-learning UA estimator (W/K). Updated only during stable heating
  # periods (room in band, no DHW, no defrost, HP delivering thermal power).
  # Default 0 = "not yet learned"; UI exposes the derived rated-power estimate.
  - id: oq_phouse_ua_estimate_wpk
    type: float
    restore_value: true
    initial_value: '0.0'

  - id: oq_phouse_ua_sample_count
    type: int
    restore_value: true
    initial_value: '0'

  - id: oq_phouse_ua_last_sample_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Last estimated thermal output of the HP set used by the UA learner.
  # Diagnostic only.
  - id: oq_phouse_hp_th_estimate_w
    type: float
    restore_value: false
    initial_value: '0.0'

  # UA learner skip-reason for the most recent tick. 0 = sampling OK,
  # 1 = disabled, 2 = strategy not active in CM2/CM3, 3 = inputs invalid,
  # 4 = unstable (room_err too high), 5 = DHW active, 6 = defrost active,
  # 7 = oil-return active, 8 = HP power below threshold, 9 = dT too small,
  # 10 = sample interval not yet reached.
  - id: oq_phouse_ua_skip_reason
    type: int
    restore_value: false
    initial_value: '1'

  # ----- v0.32 smart features -----
  # #1 Tariff-aware setpoint shift (°C). Positive = setpoint raised above
  # baseline (cheap hour preheat); negative = setpoint lowered (expensive
  # throttle). Slowly slewed; clamped within user-set bounds.
  - id: oq_phouse_tariff_shift_c
    type: float
    restore_value: false
    initial_value: '0.0'

  # #1 Running 24h average tariff fallback (used when HA does not provide one).
  - id: oq_phouse_tariff_running_avg_eur
    type: float
    restore_value: true
    initial_value: '0.0'

  - id: oq_phouse_tariff_avg_last_update_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # #2 PV self-consumption boost (W) — additive contribution to P_target.
  - id: oq_phouse_pv_boost_w
    type: float
    restore_value: false
    initial_value: '0.0'

  # #3 Window-open detection state. When true, P_target is squashed to 0 for
  # window_open_pause_min minutes.
  - id: oq_phouse_window_open_active
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: oq_phouse_window_open_until_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # #3 Room temperature short-window history for slope detection.
  # We store (room_temp_t-N) to compute a 5-minute drop.
  - id: oq_phouse_room_temp_5min_ago_c
    type: float
    restore_value: false
    initial_value: 'NAN'

  - id: oq_phouse_room_temp_5min_ago_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # #4 Adaptive Kp. Learns the effective house response gain over a long
  # window from observed (dTr/dt) vs. (P_house - P_loss) imbalance.
  # Default 0 = "use the user-configured ph_kp_w_per_k unchanged".
  - id: oq_phouse_kp_estimate_w_per_k
    type: float
    restore_value: true
    initial_value: '0.0'

  - id: oq_phouse_kp_sample_count
    type: int
    restore_value: true
    initial_value: '0'

  # Kp observer skip-reason: 0=ok, 1=disabled, 2=room near setpoint (no error),
  # 3=dt too short, 4=HP power below threshold, 5=P_extra too small,
  # 6=outlier rejected
  - id: oq_phouse_kp_skip_reason
    type: int
    restore_value: false
    initial_value: '1'

select:
  - platform: template
    id: oq_ph_response_profile
    name: "Power House response profile"
    icon: mdi:tune-variant
    options:
      - Calm
      - Balanced
      - Responsive
      - Custom
    update_interval: 5s
    entity_category: config
    web_server:
      sorting_group_id: oq_power_house
    lambda: |-
      const float rise = id(ph_demand_rise_time_min).state;
      const float fall = id(ph_demand_fall_time_min).state;
      auto near = [](float a, float b) -> bool {
        return !isnan(a) && fabsf(a - b) < 0.25f;
      };
      if (near(rise, 12.0f) && near(fall, 5.0f)) return std::string("Calm");
      if (near(rise, 8.0f) && near(fall, 3.0f)) return std::string("Balanced");
      if (near(rise, 5.0f) && near(fall, 2.0f)) return std::string("Responsive");
      return std::string("Custom");
    set_action:
      then:
        - lambda: |-
            // Preset wrapper around the canonical rise/fall response-time knobs.
            auto set_number_value = [](auto *num, float value) {
              if (num == nullptr) return;
              auto c = num->make_call();
              c.set_value(value);
              c.perform();
            };

            if (x == "Calm") {
              set_number_value(id(ph_demand_rise_time_min), 12.0f);
              set_number_value(id(ph_demand_fall_time_min), 5.0f);
            } else if (x == "Balanced") {
              set_number_value(id(ph_demand_rise_time_min), 8.0f);
              set_number_value(id(ph_demand_fall_time_min), 3.0f);
            } else if (x == "Responsive") {
              set_number_value(id(ph_demand_rise_time_min), 5.0f);
              set_number_value(id(ph_demand_fall_time_min), 2.0f);
            }

switch:
  # #1 UA learning enable. Default OFF — opt-in. When enabled, the strategy
  # samples (P_th_estimate, Trsp - Tout) tuples during stable heating and
  # updates an EMA UA estimate. The estimate is shown as a diagnostic; the
  # user can apply it via the "Apply UA estimate" button.
  - platform: template
    id: oq_phouse_ua_learn_enable
    name: "Power House UA learning enable"
    icon: mdi:school
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action: []
    turn_off_action: []
    web_server:
      sorting_group_id: oq_power_house

  # #2 Solar gain correction enable. Default OFF — opt-in to avoid surprises
  # on first install.
  - platform: template
    id: oq_phouse_solar_gain_enable
    name: "Power House solar gain enable"
    icon: mdi:weather-sunny
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action: []
    turn_off_action: []
    web_server:
      sorting_group_id: oq_power_house

  # ----- v0.32 smart features switches -----
  - platform: template
    id: oq_phouse_tariff_shift_enable
    name: "Power House tariff shift enable"
    icon: mdi:currency-eur
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action: []
    turn_off_action: []
    web_server:
      sorting_group_id: oq_power_house

  - platform: template
    id: oq_phouse_pv_boost_enable
    name: "Power House PV self-consumption enable"
    icon: mdi:solar-power-variant
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action: []
    turn_off_action: []
    web_server:
      sorting_group_id: oq_power_house

  - platform: template
    id: oq_phouse_window_detect_enable
    name: "Power House window-open detection"
    icon: mdi:window-open-variant
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action: []
    turn_off_action: []
    web_server:
      sorting_group_id: oq_power_house

  - platform: template
    id: oq_phouse_adaptive_kp_enable
    name: "Power House adaptive Kp enable"
    icon: mdi:tune-vertical
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action: []
    turn_off_action: []
    web_server:
      sorting_group_id: oq_power_house

button:
  # #1 Apply learned UA → set house_rated_power_w to UA_estimate * (T0 - Tc).
  - platform: template
    id: oq_phouse_apply_ua_button
    name: "Power House apply UA estimate"
    icon: mdi:check-circle
    web_server:
      sorting_group_id: oq_power_house
    on_press:
      - lambda: |-
          const float ua = id(oq_phouse_ua_estimate_wpk);
          const float T0 = id(house_zero_power_temp_c).state;
          const float Tc = id(house_cold_temp_c).state;
          if (ua <= 0.0f || isnan(T0) || isnan(Tc) || (T0 <= Tc + 1.0f)) {
            ESP_LOGW("quatt", "Apply UA: estimate invalid or temp pair invalid; nothing applied.");
            return;
          }
          const float pr_estimate = ua * (T0 - Tc);
          if (pr_estimate < 1000.0f || pr_estimate > 15000.0f) {
            ESP_LOGW("quatt", "Apply UA: estimate %.0fW out of safe range, ignored.", pr_estimate);
            return;
          }
          auto c = id(house_rated_power_w).make_call();
          c.set_value(pr_estimate);
          c.perform();
          ESP_LOGI("quatt", "Apply UA: house_rated_power_w set to %.0fW (UA=%.1f W/K, ΔT=%.1fK).",
                   pr_estimate, ua, (T0 - Tc));

  # #1 Reset UA learning state.
  - platform: template
    id: oq_phouse_reset_ua_button
    name: "Power House reset UA learning"
    icon: mdi:restart
    web_server:
      sorting_group_id: oq_power_house
    on_press:
      - lambda: |-
          id(oq_phouse_ua_estimate_wpk) = 0.0f;
          id(oq_phouse_ua_sample_count) = 0;
          id(oq_phouse_ua_last_sample_ms) = 0;
          ESP_LOGI("quatt", "UA learning state reset.");

  # #4 Apply learned Kp → write to ph_kp_w_per_k.
  - platform: template
    id: oq_phouse_apply_kp_button
    name: "Power House apply Kp estimate"
    icon: mdi:check-circle
    web_server:
      sorting_group_id: oq_power_house
    on_press:
      - lambda: |-
          const float kp = id(oq_phouse_kp_estimate_w_per_k);
          if (kp <= 0.0f || isnan(kp)) {
            ESP_LOGW("quatt", "Apply Kp: no valid estimate yet.");
            return;
          }
          if (kp < 200.0f || kp > 8000.0f) {
            ESP_LOGW("quatt", "Apply Kp: estimate %.0f W/K out of range, ignored.", kp);
            return;
          }
          auto c = id(ph_kp_w_per_k).make_call();
          c.set_value(kp);
          c.perform();
          ESP_LOGI("quatt", "Apply Kp: ph_kp_w_per_k set to %.0f W/K.", kp);

  # #4 Reset adaptive Kp learning state.
  - platform: template
    id: oq_phouse_reset_kp_button
    name: "Power House reset Kp learning"
    icon: mdi:restart
    web_server:
      sorting_group_id: oq_power_house
    on_press:
      - lambda: |-
          id(oq_phouse_kp_estimate_w_per_k) = 0.0f;
          id(oq_phouse_kp_sample_count) = 0;
          ESP_LOGI("quatt", "Adaptive Kp learning state reset.");

