    name: "Power House – effective room target"
    icon: mdi:target
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 5s
    entity_category: diagnostic
    disabled_by_default: true
    web_server:
      sorting_group_id: oq_power_house
    lambda: |-
      return id(room_setpoint_selected).state + id(oq_phouse_comfort_memory_c);

  # ----- v0.32 thermal model improvements diagnostics -----

  # #2 Solar/internal gain residual estimate (W).
  - platform: template
    id: oq_phouse_solar_gain_w_sensor
    name: "Power House – solar gain estimate"
    icon: mdi:weather-sunny
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_power_house
    lambda: |-
      return id(oq_phouse_solar_gain_w);

  # #1 UA estimate (W/K).
  - platform: template
    id: oq_phouse_ua_estimate_wpk_sensor
    name: "Power House – UA estimate"
    icon: mdi:home-thermometer-outline
    unit_of_measurement: "W/K"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_power_house
    lambda: |-
      return id(oq_phouse_ua_estimate_wpk);

  # #1 Estimated rated power derived from UA learner.
  - platform: template
    id: oq_phouse_estimated_rated_power_w_sensor
    name: "Power House – estimated rated power"
    icon: mdi:home-lightning-bolt-outline
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_power_house
    lambda: |-
      const float ua = id(oq_phouse_ua_estimate_wpk);
      const float T0 = id(house_zero_power_temp_c).state;
      const float Tc = id(house_cold_temp_c).state;
      if (ua <= 0.0f || isnan(T0) || isnan(Tc) || (T0 <= Tc + 1.0f)) return NAN;
      return ua * (T0 - Tc);

  # Live house heat loss based on UA × (Tr − Tout). Uses the learned UA when
  # available, otherwise derives an effective UA from the configured rated
  # power and design temperature span: UA_config = Pr / (T0 - Tc).
  - platform: template
    id: oq_phouse_heat_loss_now_w_sensor
    name: "Power House – live heat loss"
    icon: mdi:home-thermometer
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    web_server:
      sorting_group_id: oq_power_house
    lambda: |-
      const float Tr = id(room_temp_selected).state;
      const float Tout = id(outside_temp_selected).state;
      if (isnan(Tr) || isnan(Tout)) return NAN;
      const float dT = Tr - Tout;
      if (dT <= 0.0f) return 0.0f;  // free-cooling territory, no loss
      // Prefer learned UA when available.
      float ua = id(oq_phouse_ua_estimate_wpk);
      if (ua <= 0.0f) {
        // Fallback: derive UA from configured rated power + design temps.
        const float T0 = id(house_zero_power_temp_c).state;
        const float Tc = id(house_cold_temp_c).state;
        const float Pr = id(house_rated_power_w).state;
        if (isnan(T0) || isnan(Tc) || isnan(Pr) || (T0 <= Tc + 1.0f) || Pr <= 0.0f) return NAN;
        ua = Pr / (T0 - Tc);
      }
      return ua * dT;

  # Effective UA used in the live heat-loss calculation. Diagnostic — shows
  # whether we are using the learned UA or the config fallback.
  - platform: template
    id: oq_phouse_ua_effective_sensor
    name: "Power House – effective UA"
    icon: mdi:home-thermometer-outline
    unit_of_measurement: "W/K"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_power_house
    lambda: |-
      float ua = id(oq_phouse_ua_estimate_wpk);
      if (ua > 0.0f) return ua;
      const float T0 = id(house_zero_power_temp_c).state;
      const float Tc = id(house_cold_temp_c).state;
      const float Pr = id(house_rated_power_w).state;
      if (isnan(T0) || isnan(Tc) || isnan(Pr) || (T0 <= Tc + 1.0f) || Pr <= 0.0f) return NAN;
      return Pr / (T0 - Tc);

  # #1 UA sample count (diagnostics — how mature is the estimate).
  - platform: template
    id: oq_phouse_ua_sample_count_sensor
    name: "Power House – UA samples"
    icon: mdi:counter
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    entity_category: diagnostic
    web_server:
      sorting_group_id: oq_power_house
    lambda: |-
      return (float) id(oq_phouse_ua_sample_count);

  # #1 HP thermal output estimate (W) — diagnostic for understanding the learner.
  - platform: template
    id: oq_phouse_hp_th_estimate_w_sensor
    name: "Power House – HP thermal output estimate"
    icon: mdi:radiator
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    entity_category: diagnostic
    disabled_by_default: true
    web_server:
      sorting_group_id: oq_power_house
    lambda: |-
      return id(oq_phouse_hp_th_estimate_w);

  # #5 Effective Tsup used by the perf_map (diagnostic).
  - platform: template
    id: oq_phouse_eff_supply_temp_c_sensor
    name: "Power House – effective supply temp"
    icon: mdi:thermometer-water
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    entity_category: diagnostic
    disabled_by_default: true
    web_server:
      sorting_group_id: oq_power_house
    lambda: |-
      const float Tsup_meas = id(oq_system_supply_temp).state;
      const float Pr = id(house_rated_power_w).state;
      const float P_target = id(oq_phouse_req_w);
      const float dt_design = id(ph_design_supply_dt_c).state;
      if (isnan(Pr) || Pr <= 0.0f) return Tsup_meas;
      const float frac = (P_target / Pr);
      float Tsup_steady = 30.0f + 25.0f * (frac < 0.0f ? 0.0f : (frac > 1.0f ? 1.0f : frac));
      (void) dt_design;  // reserved for future flow-based derivation
      if (isnan(Tsup_meas)) return Tsup_steady;
      return fmaxf(Tsup_meas, Tsup_steady);

  # ----- v0.32 smart-feature diagnostics -----

  # #1 Tariff shift currently applied (°C).
