interval:
  - interval: ${oq_heat_loop_tick_s}s
    startup_delay: 4000ms
    then:
      - lambda: |-
          // Power House strategy: owns filtered demand and PH topology selection.
          static bool hp1_prev_valve_def = false;
          static bool hp2_prev_valve_def = false;
          static bool hp1_prev_oil_return = false;
          static bool hp2_prev_oil_return = false;
          static uint32_t hp1_defrost_owner_hold_until_ms = 0;
          static uint32_t hp2_defrost_owner_hold_until_ms = 0;
          static uint32_t oil_return_hold_until_ms = 0;
          const int cm_code = id(oq_control_mode_code);
          const bool active = (cm_code != 5) && (id(oq_heat_mode_code) != 1);
          if (!active) {
            id(oq_ph_request_last_loop_ms) = 0;
            id(oq_ph_request_hp1_level) = 0;
            id(oq_ph_request_hp2_level) = 0;
            id(oq_ph_request_owner_hp) = 0;
            id(oq_ph_request_reason_code) = 0;
            id(oq_phouse_last_ms) = 0;
            id(oq_phouse_last_w) = 0.0f;
            id(oq_phouse_comfort_memory_c) = 0.0f;
            hp1_prev_valve_def = false;
            hp2_prev_valve_def = false;
            hp1_prev_oil_return = false;
            hp2_prev_oil_return = false;
            hp1_defrost_owner_hold_until_ms = 0;
            hp2_defrost_owner_hold_until_ms = 0;
            oil_return_hold_until_ms = 0;
            return;
          }

          const uint32_t now_ms = (uint32_t) millis();
          const uint32_t loop_target_ms = (uint32_t) (${oq_heat_loop_powerhouse_s} * 1000UL);
          float dt_s = (float) loop_target_ms / 1000.0f;
          if (id(oq_ph_request_last_loop_ms) > 0 && now_ms > id(oq_ph_request_last_loop_ms)) {
            const uint32_t elapsed_ms = now_ms - id(oq_ph_request_last_loop_ms);
            if (elapsed_ms < loop_target_ms) return;
            dt_s = (float) elapsed_ms / 1000.0f;
          }
          id(oq_ph_request_last_loop_ms) = now_ms;

          constexpr float seconds_per_minute = 60.0f;
          const int demand_max_f = (int) ${oq_strategy_demand_max_f};
          auto clampf = [&](float v, float lo, float hi)->float {
            if (v < lo) return lo;
            if (v > hi) return hi;
            return v;
          };
          auto clamp_demand = [&](int demand)->int {
            if (demand < 0) return 0;
            if (demand > demand_max_f) return demand_max_f;
            return demand;
          };

          const float Tout = id(outside_temp_selected).state;
          const float Tc = id(house_cold_temp_c).state;
          const float T0 = id(house_zero_power_temp_c).state;
          const float house_power_rating_w = id(house_rated_power_w).state;
          const float Tr = id(room_temp_selected).state;
          const float Trsp = id(room_setpoint_selected).state;

          if (isnan(Tout) || isnan(Tc) || isnan(T0) || isnan(house_power_rating_w) || (house_power_rating_w <= 0.0f) ||
              isnan(Tr) || isnan(Trsp) || (T0 <= Tc + ${oq_temp_guard_delta_c}f)) {
            id(oq_phouse_req_w) = 0.0f;
            id(oq_phouse_comfort_memory_c) = 0.0f;
            id(oq_phouse_solar_gain_w) = 0.0f;
            id(oq_demand_raw) = 0;
          } else {
            float x = (T0 - Tout) / (T0 - Tc);
            x = clampf(x, 0.0f, 1.0f);
            float P_house = house_power_rating_w * x;

            // ===== v0.32 #2: Solar / internal gain residual EMA =====
            // When the room sits above setpoint despite a low predicted P_house,
            // the implied external gain is captured as a slow EMA in W and
            // subtracted (with user-tunable strength) from P_house to avoid
            // afternoon-overshoot on sunny shoulder days.
            const bool solar_enabled = id(oq_phouse_solar_gain_enable).state;
            const float solar_alpha_user = clampf(id(ph_solar_gain_alpha).state, 0.0f, 1.0f);
            const float room_err_above = Tr - Trsp;  // > 0 when above setpoint
            const float dt_solar_s = (now_ms >= id(oq_phouse_last_ms) && id(oq_phouse_last_ms) > 0)
                ? ((now_ms - id(oq_phouse_last_ms)) / 1000.0f) : dt_s;
            // Heuristic instant residual: room over-shoot scaled to power
            // domain via the design temperature span. Only counted in mild
            // weather (Tout > 5 °C) — avoids spurious gains at low Tout where
            // small room overshoot is mostly thermal mass.
            float P_residual_w = 0.0f;
            if (solar_enabled && room_err_above > 0.05f && Tout > 5.0f) {
              const float design_span_k = fmaxf(2.0f, Trsp - Tc);
              P_residual_w = house_power_rating_w * (room_err_above / design_span_k);
              P_residual_w = clampf(P_residual_w, 0.0f, 0.6f * house_power_rating_w);
            }
            // EMA with τ ≈ 30 min so single-sample noise does not drive demand.
            const float solar_tau_s = 1800.0f;
            const float solar_ema_alpha = (solar_tau_s > 0.0f && dt_solar_s > 0.0f)
                ? (1.0f - expf(-dt_solar_s / solar_tau_s)) : 0.0f;
            float solar_gain = id(oq_phouse_solar_gain_w);
            if (isnan(solar_gain) || solar_gain < 0.0f) solar_gain = 0.0f;
            if (!solar_enabled) {
              // Decay to zero when feature is disabled.
              solar_gain = solar_gain * (1.0f - solar_ema_alpha);
            } else {
              solar_gain = solar_gain + solar_ema_alpha * (P_residual_w - solar_gain);
            }
            id(oq_phouse_solar_gain_w) = solar_gain;
            const float solar_correction_w = solar_alpha_user * solar_gain;
            P_house = fmaxf(0.0f, P_house - solar_correction_w);

            // ===== v0.32 #3: Forecast pre-conditioning =====
            // When an upcoming setpoint step is known (HA proxy), gently lift
            // P_target so the strategy starts pre-heating with low levels —
            // best COP zone (level 4-6) instead of a recovery spike.
            const float preheat_gain = clampf(id(ph_preheat_gain).state, 0.0f, 1.0f);
            float P_preheat_w = 0.0f;
            if (preheat_gain > 0.0f) {
              const float Trsp_next = id(room_setpoint_next_ha).has_state()
                  ? id(room_setpoint_next_ha).state : NAN;
              const float Tout_next = id(outside_temp_forecast_ha).has_state()
                  ? id(outside_temp_forecast_ha).state : NAN;
              if (!isnan(Trsp_next) && Trsp_next > Trsp + 0.3f) {
                const float T_eff = isnan(Tout_next) ? Tout : Tout_next;
                float x_next = (T0 - T_eff) / (T0 - Tc);
                x_next = clampf(x_next, 0.0f, 1.0f);
                const float P_house_next = house_power_rating_w * x_next;
                // Add a small fraction so the room can drift up gently before
                // the schedule jumps. Larger preheat_gain = more anticipation.
                P_preheat_w = preheat_gain * 0.4f * P_house_next;
              }
            }

            const float comfort_below = clampf(id(ph_comfort_band_below_c).state, 0.0f, 2.0f);
            const float comfort_above = clampf(id(ph_comfort_band_above_c).state, 0.0f, 2.0f);
            const float Tr_low_base = Trsp - comfort_below;
            const float Tr_high_base = Trsp + comfort_above;
            const float Tr_mid_base = Tr_low_base + 0.5f * (Tr_high_base - Tr_low_base);

            uint32_t last = id(oq_phouse_last_ms);
            float lastw = id(oq_phouse_last_w);
            if (last == 0) {
              last = now_ms;
              lastw = P_house;
            }

            const float dt_power_s = (now_ms >= last) ? ((now_ms - last) / 1000.0f) : 0.0f;
            const float comfort_memory_max_c = clampf(0.05f + (0.50f * comfort_above), 0.08f, 0.20f);
            float comfort_memory_c = id(oq_phouse_comfort_memory_c);
            if (isnan(comfort_memory_c) || comfort_memory_c < 0.0f) comfort_memory_c = 0.0f;

            if (Tr < Tr_low_base) {
              const float undershoot_norm = clampf((Tr_low_base - Tr) / 0.45f, 0.0f, 1.0f);
              const float build_min_c_per_min = comfort_memory_max_c / 90.0f;
              const float build_max_c_per_min = comfort_memory_max_c / 24.0f;
              const float build_c_per_s =
                  (build_min_c_per_min + (build_max_c_per_min - build_min_c_per_min) * undershoot_norm) /
                  seconds_per_minute;
              comfort_memory_c += build_c_per_s * dt_power_s;
            } else if (Tr <= Tr_mid_base) {
              // Keep the accumulated comfort memory through the colder half of
              // the band so the room does not drift persistently low.
            } else if (Tr <= Tr_high_base) {
              const float decay_c_per_s = (comfort_memory_max_c / 40.0f) / seconds_per_minute;
              comfort_memory_c -= decay_c_per_s * dt_power_s;
            } else {
              const float fast_decay_c_per_s = (comfort_memory_max_c / 12.0f) / seconds_per_minute;
              comfort_memory_c -= fast_decay_c_per_s * dt_power_s;
            }
            comfort_memory_c = clampf(comfort_memory_c, 0.0f, comfort_memory_max_c);
            id(oq_phouse_comfort_memory_c) = comfort_memory_c;

            const float Trsp_effective = Trsp + comfort_memory_c;
            const float Tr_low = Trsp_effective - comfort_below;

            float e = 0.0f;
            if (Tr < Tr_low) e = Tr_low - Tr;
            else if (Tr > Trsp) e = Trsp - Tr;

            const float temperature_reaction_w_per_k = id(ph_kp_w_per_k).state;
            float P_raw = P_house + temperature_reaction_w_per_k * e;
            // Apply preheat boost: floor P_raw at the preheat estimate so the
            // strategy already moves up before the live error pushes it.
            if (P_preheat_w > 0.0f && P_preheat_w > P_raw) P_raw = P_preheat_w;
            P_raw = clampf(P_raw, 0.0f, house_power_rating_w);

            const float rise_time_min = clampf(id(ph_demand_rise_time_min).state, 2.0f, 20.0f);
            const float fall_time_min = clampf(id(ph_demand_fall_time_min).state, 1.0f, 10.0f);
            const float up = (house_power_rating_w / rise_time_min) / seconds_per_minute;
            const float dn = (house_power_rating_w / fall_time_min) / seconds_per_minute;

            float P_limited = P_raw;
            if (dt_power_s > 0.0f) {
              if (P_raw > lastw && up > 0.0f) {
                P_limited = std::min(P_raw, lastw + up * dt_power_s);
              } else if (P_raw < lastw && dn > 0.0f) {
                P_limited = std::max(P_raw, lastw - dn * dt_power_s);
              }
            }

            float P_effective = P_limited * id(oq_water_temp_limit_factor);

            // ===== v0.32 smart #3: Window-open detection =====
            // Compare current Tr against a 5-minute-ago snapshot. Sustained
            // sharp drop with unchanged setpoint → very likely an open window
            // or door. Pause the strategy briefly to avoid wasting energy
            // chasing the drop.
            const bool window_detect_on = id(oq_phouse_window_detect_enable).state;
            // Update the rolling 5-min snapshot.
            const uint32_t window_sample_age_ms = (now_ms >= id(oq_phouse_room_temp_5min_ago_ms))
                ? (now_ms - id(oq_phouse_room_temp_5min_ago_ms)) : 0;
            const bool snapshot_exists = !isnan(id(oq_phouse_room_temp_5min_ago_c));
            if (!snapshot_exists || window_sample_age_ms >= 300000UL) {
              id(oq_phouse_room_temp_5min_ago_c) = Tr;
              id(oq_phouse_room_temp_5min_ago_ms) = now_ms;
            }
            if (window_detect_on && snapshot_exists) {
              const float drop_threshold = clampf(id(ph_window_drop_threshold_c).state, 0.10f, 1.50f);
              const float drop_c = id(oq_phouse_room_temp_5min_ago_c) - Tr;
              // Trigger only if drop is rapid relative to outdoor + outdoor is colder.
              if (drop_c >= drop_threshold && Tout < (Tr - 1.0f) && !id(oq_phouse_window_open_active)) {
                const uint32_t pause_min = (uint32_t) clampf(id(ph_window_pause_min).state, 2.0f, 30.0f);
                id(oq_phouse_window_open_active) = true;
                id(oq_phouse_window_open_until_ms) = now_ms + pause_min * 60000UL;
                ESP_LOGW("quatt", "Window-open detected: Tr dropped %.2fK in 5min — pausing %u min.",
                         drop_c, (unsigned) pause_min);
              }
            }
            // Auto-clear window state once the pause window elapses.
            if (id(oq_phouse_window_open_active) && now_ms >= id(oq_phouse_window_open_until_ms)) {
              id(oq_phouse_window_open_active) = false;
              ESP_LOGI("quatt", "Window-open pause elapsed — resuming Power House.");
            }
            // If detection is disabled, immediately drop the active flag.
            if (!window_detect_on) {
              id(oq_phouse_window_open_active) = false;
              id(oq_phouse_window_open_until_ms) = 0;
            }

            // ===== v0.32 smart #1: Tariff-aware setpoint shift =====
            // When dynamic tariff is well below the 24h average → preheat
            // (positive shift, raises P via Kp). When well above average →
            // throttle (negative shift, lowers P). Slewed so we don't whip
            // the strategy when tariff jumps. No effect when disabled.
            const bool tariff_on = id(oq_phouse_tariff_shift_enable).state;
            float tariff_shift_target_c = 0.0f;
            if (tariff_on && id(electricity_tariff_now_ha).has_state() &&
                !isnan(id(electricity_tariff_now_ha).state)) {
              const float tariff_now = id(electricity_tariff_now_ha).state;
              float tariff_avg = id(electricity_tariff_avg24_ha).has_state()
                  ? id(electricity_tariff_avg24_ha).state : NAN;
              if (isnan(tariff_avg) || tariff_avg <= 0.0f) {
                tariff_avg = id(oq_phouse_tariff_running_avg_eur);
              }
              // Maintain a slow running average ourselves (≈24h EMA on the now-tariff).
              const uint32_t tariff_dt_ms = (id(oq_phouse_tariff_avg_last_update_ms) > 0 &&
                                              now_ms > id(oq_phouse_tariff_avg_last_update_ms))
                  ? (now_ms - id(oq_phouse_tariff_avg_last_update_ms)) : 0UL;
              if (tariff_dt_ms > 30000UL) {
                const float tau24h_s = 86400.0f;
                const float dt_run = (float) tariff_dt_ms / 1000.0f;
                const float a = 1.0f - expf(-dt_run / tau24h_s);
                float run_avg = id(oq_phouse_tariff_running_avg_eur);
                if (run_avg <= 0.0f || isnan(run_avg)) run_avg = tariff_now;
                else run_avg += a * (tariff_now - run_avg);
                id(oq_phouse_tariff_running_avg_eur) = run_avg;
                id(oq_phouse_tariff_avg_last_update_ms) = now_ms;
                if (isnan(tariff_avg) || tariff_avg <= 0.0f) tariff_avg = run_avg;
              }
              if (!isnan(tariff_avg) && tariff_avg > 0.0f) {
                const float ratio = tariff_now / tariff_avg;
                const float cheap = clampf(id(ph_tariff_cheap_ratio).state, 0.30f, 0.95f);
                const float expensive = clampf(id(ph_tariff_expensive_ratio).state, 1.05f, 2.50f);
                const float max_up = clampf(id(ph_tariff_shift_max_up_c).state, 0.0f, 1.5f);
                const float max_dn = clampf(id(ph_tariff_shift_max_down_c).state, 0.0f, 1.5f);
                if (ratio <= cheap) {
                  // Linear ramp: ratio=cheap → 0, ratio=0 → max_up
                  const float frac = clampf((cheap - ratio) / fmaxf(0.05f, cheap), 0.0f, 1.0f);
                  tariff_shift_target_c = max_up * frac;
                } else if (ratio >= expensive) {
                  // Linear ramp: ratio=expensive → 0, ratio=2*expensive → -max_dn
                  const float frac = clampf((ratio - expensive) / fmaxf(0.10f, expensive), 0.0f, 1.0f);
                  tariff_shift_target_c = -max_dn * frac;
                }
              }
            }
            // Slew towards target at 0.05 K/min so single-tariff outliers don't whip.
            const float tariff_slew_c_per_s = 0.05f / 60.0f;
            float tariff_shift = id(oq_phouse_tariff_shift_c);
            if (isnan(tariff_shift)) tariff_shift = 0.0f;
            const float tariff_step = tariff_slew_c_per_s * dt_power_s;
            if (tariff_shift_target_c > tariff_shift)
              tariff_shift = fminf(tariff_shift_target_c, tariff_shift + tariff_step);
            else if (tariff_shift_target_c < tariff_shift)
              tariff_shift = fmaxf(tariff_shift_target_c, tariff_shift - tariff_step);
            id(oq_phouse_tariff_shift_c) = tariff_shift;
            // Translate setpoint shift to extra power via Kp.
            const float P_tariff_w = clampf(temperature_reaction_w_per_k * tariff_shift,
                                            -house_power_rating_w, house_power_rating_w);

            // ===== v0.32 smart #2: PV self-consumption boost =====
            // When grid net power is exporting (negative), boost P_target so
            // we use that PV electricity as heat. Linear above the export
            // threshold, capped at user-set max boost.
            const bool pv_on = id(oq_phouse_pv_boost_enable).state;
            float pv_boost_w = 0.0f;
            if (pv_on && id(grid_net_power_ha).has_state() && !isnan(id(grid_net_power_ha).state)) {
              const float grid_net = id(grid_net_power_ha).state;  // negative = export
              const float export_w = (grid_net < 0.0f) ? -grid_net : 0.0f;
              const float threshold_w = clampf(id(ph_pv_export_threshold_w).state, 200.0f, 5000.0f);
              const float max_boost_w = clampf(id(ph_pv_boost_max_w).state, 0.0f, 6000.0f);
              const float assumed_cop = clampf(id(ph_pv_assumed_cop).state, 1.5f, 6.0f);
              if (export_w > threshold_w) {
                // Convert excess electrical export to thermal at assumed COP.
                pv_boost_w = (export_w - threshold_w) * assumed_cop;
                pv_boost_w = clampf(pv_boost_w, 0.0f, max_boost_w);
              }
            }
            // Slew so brief solar dips don't whip P_target.
            const float pv_slew_w_per_s = 200.0f;  // 200 W/s rise/fall
            float pv_boost_state = id(oq_phouse_pv_boost_w);
            if (isnan(pv_boost_state)) pv_boost_state = 0.0f;
            const float pv_step = pv_slew_w_per_s * dt_power_s;
            if (pv_boost_w > pv_boost_state)
              pv_boost_state = fminf(pv_boost_w, pv_boost_state + pv_step);
            else if (pv_boost_w < pv_boost_state)
              pv_boost_state = fmaxf(pv_boost_w, pv_boost_state - pv_step);
            id(oq_phouse_pv_boost_w) = pv_boost_state;

            // Apply smart-feature contributions to P_effective.
            // PV boost: additive, no cap beyond Pr*1.2 (over-rated allowed for short bursts).
            P_effective = fmaxf(0.0f,
                fminf(house_power_rating_w * 1.20f, P_effective + P_tariff_w + pv_boost_state));
            // Window-open: hard zero override of P_effective (HP idles).
            if (id(oq_phouse_window_open_active)) {
              P_effective = 0.0f;
            }

            id(oq_phouse_req_w) = P_effective;
            id(oq_phouse_last_w) = P_effective;
            id(oq_phouse_last_ms) = now_ms;
            id(oq_demand_raw) = clamp_demand((int) lroundf(${oq_strategy_demand_max_f} * (P_effective / house_power_rating_w)));

            // ===== v0.32 smart #4: Adaptive Kp observer =====
            // NOTE: this is a *verification* observer, not a true learner.
            // The numerator (P_raw - P_house) is by construction equal to
            // ph_kp_w_per_k * e in the code above, so kp_sample mathematically
            // equals the configured Kp whenever both are non-zero.
            //
            // What the observer is good for:
            //   - Confirming the strategy actually applies the configured Kp
            //     (catches caps, slew limiters, water-temp-trip etc. that may
            //     suppress P_extra without changing the configured Kp)
            //   - Showing the EMA-smoothed effective Kp over time
            //
            // For real Kp tuning, watch comfort_memory_c growth: if it stays
            // above zero during heating and never decays, your configured Kp
            // is likely too low. Drop it incrementally and observe.
            //
            // Sampling: use the absolute room offset (Tr - Trsp), require at
            // least 0.15 K offset and a HP delivering >= 500 W. dt >= 60 s.
            const bool kp_learn_on = id(oq_phouse_adaptive_kp_enable).state;
            int kp_skip = 0;
            if (!kp_learn_on) {
              kp_skip = 1;
            } else {
              const float room_offset = Tr - Trsp;  // signed
              const bool offset_ok = fabsf(room_offset) > 0.15f;
              const bool dt_ok_kp = dt_power_s >= 60.0f;
              const float P_extra = P_raw - P_house;
              // p_th_estimate_w is computed later in the UA learner block; here
              // we approximate "HP active" by the actual applied level.
              const int hp1_lvl_kp = id(hp1_last_applied_level);
              #if OQ_TOPOLOGY_DUO
              const int hp2_lvl_kp = id(${ph_secondary_last_applied_level_id});
              #else
              const int hp2_lvl_kp = 0;
              #endif
              const bool hp_active_kp = (hp1_lvl_kp > 0) || (hp2_lvl_kp > 0);
              const bool extra_ok = fabsf(P_extra) >= 100.0f;

              if (!offset_ok) kp_skip = 2;
              else if (!dt_ok_kp) kp_skip = 3;
              else if (!hp_active_kp) kp_skip = 4;
              else if (!extra_ok) kp_skip = 5;
              else {
                // Use the dead-band-clipped error e (matches how P_extra was
                // generated). This makes the observer agree with the
                // configured Kp during normal heating activity.
                const float kp_sample = (fabsf(e) > 0.05f)
                    ? P_extra / e
                    : P_extra / room_offset;
                if (kp_sample >= 200.0f && kp_sample <= 8000.0f) {
                  float kp_ema = id(oq_phouse_kp_estimate_w_per_k);
                  const int sample_count = id(oq_phouse_kp_sample_count);
                  bool accept_kp = true;
                  if (kp_ema > 100.0f && (kp_sample > 4.0f * kp_ema || kp_sample < 0.25f * kp_ema)) {
                    accept_kp = false;
                    kp_skip = 6;
                  }
                  if (accept_kp) {
                    const float tau_h = clampf(id(ph_kp_learn_tau_h).state, 24.0f, 168.0f);
                    const float tau_s_kp = tau_h * 3600.0f;
                    if (sample_count < 6 || kp_ema <= 0.0f) {
                      if (kp_ema <= 0.0f) kp_ema = kp_sample;
                      else kp_ema = kp_ema + (kp_sample - kp_ema) / (float)(sample_count + 1);
                    } else {
                      const float a_kp = 1.0f - expf(-dt_power_s / tau_s_kp);
                      kp_ema += a_kp * (kp_sample - kp_ema);
                    }
                    id(oq_phouse_kp_estimate_w_per_k) = kp_ema;
                    id(oq_phouse_kp_sample_count) = sample_count + 1;
                    kp_skip = 0;
                  }
                } else {
                  kp_skip = 6;  // outlier
                }
              }
            }
            id(oq_phouse_kp_skip_reason) = kp_skip;
          }

          int raw = id(oq_demand_raw);
          raw = std::max(0, std::min(demand_max_f, raw));

          int ramp_up_step_min = (int) lroundf(id(oq_demand_filter_ramp_up_step_min).state);
          if (ramp_up_step_min < 1) ramp_up_step_min = 1;
          if (ramp_up_step_min > demand_max_f) ramp_up_step_min = demand_max_f;

          int f = id(oq_demand_filtered);
          f = std::max(0, std::min(demand_max_f, f));
          id(oq_demand_filtered_prev) = f;

          float ramp_budget = id(oq_demand_filter_ramp_up_budget) + (((float) ramp_up_step_min) / 60.0f) * dt_s;
          if (ramp_budget > (float) demand_max_f) ramp_budget = (float) demand_max_f;
          int ramp_steps = (int) floorf(ramp_budget);
          if (ramp_steps < 0) ramp_steps = 0;
          id(oq_demand_filter_ramp_up_budget) = ramp_budget - (float) ramp_steps;

          if (raw > f) {
            if (ramp_steps > 0) f = std::min(f + ramp_steps, raw);
          } else if (raw == 0 && f == 1) {
            f = 0;
          } else if (raw <= (f - 2)) {
            f = raw;
          }

          f = std::max(0, std::min(demand_max_f, f));
          id(oq_demand_filtered) = f;
          id(oq_heating_demand_filtered) = f;

          int f_cap = id(oq_power_cap_f);
          f_cap = std::max(0, std::min(demand_max_f, f_cap));
          if (f > f_cap) f = f_cap;

          #if OQ_TOPOLOGY_DUO
          const bool lead_is_hp1 = (id(hp1_minutes) <= id(${ph_secondary_minutes_id}));
          #else
          const bool lead_is_hp1 = true;
          #endif
          const int lead_code = lead_is_hp1 ? 1 : 2;
          if (id(oq_last_lead_hp) != lead_code) id(oq_last_lead_hp) = lead_code;

          auto publish_optimizer_reason = [&](const char* reason)->void {
            #if OQ_TOPOLOGY_DUO
            static std::string last_optimizer_reason = "";
            const std::string s(reason);
            if (s != last_optimizer_reason) {
              id(oq_duo_optimizer_reason).publish_state(s.c_str());
              last_optimizer_reason = s;
            }
            #else
            (void) reason;
            #endif
          };

          constexpr int max_level = 10;
          auto excluded_levels = [&](bool is_hp1)->oq_request::ExcludedLevels {
            if (is_hp1) {
              return oq_request::ExcludedLevels{
                  id(hp1_excluded_level_a).has_state()
                      ? id(hp1_excluded_level_a).current_option()
                      : std::string("None"),
                  id(hp1_excluded_level_b).has_state()
                      ? id(hp1_excluded_level_b).current_option()
                      : std::string("None"),
              };
            }
            #if OQ_TOPOLOGY_DUO
            return oq_request::ExcludedLevels{
                id(${ph_secondary_excluded_level_a_id}).has_state()
                    ? id(${ph_secondary_excluded_level_a_id}).current_option()
                    : std::string("None"),
                id(${ph_secondary_excluded_level_b_id}).has_state()
                    ? id(${ph_secondary_excluded_level_b_id}).current_option()
                    : std::string("None"),
            };
            #else
            (void) is_hp1;
            return oq_request::ExcludedLevels{"None", "None"};
            #endif
          };

          auto level_allowed = [&](bool is_hp1, int level)->bool {
            return oq_request::level_allowed_for_excluded_levels(excluded_levels(is_hp1), level);
          };

          auto valve_defrost_active = [&](bool is_hp1)->bool {
            if (is_hp1) return id(hp1_4_way_valve).state;
            #if OQ_TOPOLOGY_DUO
            return id(${ph_secondary_4_way_valve_id}).state;
            #else
            return false;
            #endif
          };

          const float Tamb = id(outside_temp_selected).state;
          const float Tsup_meas = id(oq_system_supply_temp).state;

          // ===== v0.32 #5: Effective Tsup for perf_map =====
          // Cold-start protection: when measured supply is far below the
          // steady-state target (e.g. just out of CM0/CM1 with cold loop),
          // the perf_map would optimistically report high P_th at low Tsup,
          // and the optimizer would pick too low a level. Use the higher of
          // measured Tsup and a steady-state estimate derived from P_target.
          auto eff_supply_temp_c = [&](float P_target_w)->float {
            const float Pr_eff = id(house_rated_power_w).state;
            float Tsup_steady = 35.0f;
            if (!isnan(Pr_eff) && Pr_eff > 0.0f) {
              float frac = P_target_w / Pr_eff;
              if (frac < 0.0f) frac = 0.0f;
              if (frac > 1.0f) frac = 1.0f;
              // 30 °C @ idle, 55 °C @ rated. Lines up with perf_map breakpoints.
              Tsup_steady = 30.0f + 25.0f * frac;
            }
            if (isnan(Tsup_meas)) return Tsup_steady;
            return fmaxf(Tsup_meas, Tsup_steady);
          };
          const float P_target_for_tsup = id(oq_phouse_req_w);
          const float Tsup = eff_supply_temp_c(P_target_for_tsup);

          int level_cap = (int) roundf(id(oq_day_max_level).state);
          if (id(oq_silent_active).state) level_cap = (int) roundf(id(oq_silent_max_level).state);
          if (level_cap < 0) level_cap = 0;
          if (level_cap > max_level) level_cap = max_level;

          const bool hp1_def = id(hp1_defrost).state;
          const bool hp1_valve_def = valve_defrost_active(true);
          const bool hp1_oil_return = id(hp1_prot_oil_return).state;
          #if OQ_TOPOLOGY_DUO
          const bool hp2_def = id(${ph_secondary_defrost_id}).state;
          const bool hp2_valve_def = valve_defrost_active(false);
          const bool hp2_oil_return = id(${ph_secondary_oil_return_id}).state;
          const bool hp2_available = true;
          #else
          const bool hp2_def = false;
          const bool hp2_valve_def = false;
          const bool hp2_oil_return = false;
          const bool hp2_available = false;
          #endif
          const bool hp1_available = true;

          constexpr uint32_t defrost_owner_hold_ms = 180000UL;
          if (hp1_valve_def || hp1_prev_valve_def) hp1_defrost_owner_hold_until_ms = now_ms + defrost_owner_hold_ms;
          if (hp2_valve_def || hp2_prev_valve_def) hp2_defrost_owner_hold_until_ms = now_ms + defrost_owner_hold_ms;
          hp1_prev_valve_def = hp1_valve_def;
          hp2_prev_valve_def = hp2_valve_def;

          constexpr uint32_t oil_return_hold_ms = 120000UL;
          const bool oil_return_active = hp1_oil_return || hp2_oil_return;
          if (oil_return_active || hp1_prev_oil_return || hp2_prev_oil_return) {
            oil_return_hold_until_ms = now_ms + oil_return_hold_ms;
          }
          hp1_prev_oil_return = hp1_oil_return;
          hp2_prev_oil_return = hp2_oil_return;
          const bool oil_return_hold_active =
              oil_return_active ||
              (oil_return_hold_until_ms > 0 && now_ms < oil_return_hold_until_ms);

          float def_fac_cfg = ${oq_defrost_power_factor};
          if (isnan(def_fac_cfg)) def_fac_cfg = 0.55f;
          const float def_fac = fmaxf(0.10f, fminf(1.00f, def_fac_cfg));

          // ===== v0.32 #4: Frost-zone capacity derating =====
          // Outside actual defrost moments, anticipate the averaged defrost
          // duty cycle in the wet-frost zone (around +1.5 °C with high RH).
          // This lowers expected capacity slightly so the duo optimizer is
          // more inclined to pick duo when needed and avoids under-delivery.
          // No effect outside the frost band or when the user disables via 0.
          auto frost_zone_derate = [&](float Tamb_c)->float {
            if (isnan(Tamb_c)) return 1.0f;
            if (Tamb_c > 6.0f || Tamb_c < -10.0f) return 1.0f;  // outside frost band
            const float max_derate = clampf(id(ph_frost_zone_max_derate).state, 0.0f, 0.30f);
            if (max_derate <= 0.0f) return 1.0f;
            const float Tpeak = 1.5f;
            const float sigma = 3.5f;
            const float dx = (Tamb_c - Tpeak) / sigma;
            const float bell = expf(-dx * dx);
            return fmaxf(0.70f, 1.0f - max_derate * bell);
          };
          const float frost_derate = frost_zone_derate(Tamb);
          // During actual defrost (4-way valve active) the explicit def_fac
          // dominates; otherwise apply the continuous frost-zone derating.
          const float hp1_th_fac = hp1_valve_def ? def_fac : frost_derate;
          const float hp2_th_fac = hp2_valve_def ? def_fac : frost_derate;

          auto max_cap_hp = [&](bool is_hp1)->float {
            if ((is_hp1 && !hp1_available) || (!is_hp1 && !hp2_available)) return 0.0f;
            float best = 0.0f;
            for (int lvl = 1; lvl <= level_cap; lvl++) {
              if (!level_allowed(is_hp1, lvl)) continue;
              float p = oq_perf::interp_power_th_w(lvl, Tamb, Tsup);
              if (!isnan(p)) p *= is_hp1 ? hp1_th_fac : hp2_th_fac;
              if (!isnan(p) && p > best) best = p;
            }
            return best;
          };

          auto publish_capacity_and_deficit = [&](float requested_w)->float {
            float cap_total = 0.0f;
            if (!isnan(Tamb) && !isnan(Tsup)) {
              cap_total = max_cap_hp(true) + max_cap_hp(false);
            }
            id(oq_P_hp_cap_w) = cap_total;

            float req = requested_w;
            if (isnan(req)) req = 0.0f;
            float deficit = req - cap_total;
            if (deficit < 0.0f) deficit = 0.0f;
            id(oq_P_deficit_w) = deficit;
            return cap_total;
          };

          int hp1_req = 0;
          int hp2_req = 0;
          int request_owner_hp = 0;
          int request_reason_code = 0;

          #if OQ_TOPOLOGY_DUO
          const float Pr = id(house_rated_power_w).state;
          float P_req_total = id(oq_phouse_req_w);
          float P_cap = NAN;
          if (!isnan(Pr) && Pr > 0.0f) P_cap = (Pr * ((float) f / (float) demand_max_f));
          if (!isnan(P_cap)) P_req_total = std::min(P_req_total, P_cap);

          const float cap_total = publish_capacity_and_deficit(P_req_total);
          const bool perf_inputs_valid = !isnan(Tamb) && !isnan(Tsup) && level_cap > 0;
          if (!perf_inputs_valid) {
            request_reason_code = 1;
            id(oq_duo_request_hold_until_ms) = 0;
            int dual_on_f = (int) roundf(id(oq_dual_hp_enable_level).state);
            if (dual_on_f < 2) dual_on_f = 2;
            if (dual_on_f > demand_max_f) dual_on_f = demand_max_f;
            int dual_off_f = dual_on_f - 2;
            if (dual_off_f < 1) dual_off_f = 1;

            const bool prefer_single = (f > 0 && f <= dual_on_f && !(hp1_def && hp2_def));
            if (!prefer_single) {
              oq_request::reset_dual_hold_state(
                  id(oq_dual_hp_enabled),
                  id(oq_dual_hp_enable_hold_elapsed_accum_min),
                  id(oq_dual_hp_disable_hold_elapsed_accum_min),
                  id(oq_dual_hp_emergency_hold_elapsed_accum_min));
            } else {
              int on_hold = (int) roundf(id(oq_dual_hp_enable_hold_min).state);
              int off_hold = (int) roundf(id(oq_dual_hp_disable_hold_min).state);
              if (on_hold < 1) on_hold = 1;
              if (off_hold < 1) off_hold = 1;

              if (f >= dual_on_f) id(oq_dual_hp_enable_hold_elapsed_accum_min) += dt_s / 60.0f;
              else id(oq_dual_hp_enable_hold_elapsed_accum_min) = 0.0f;

              if (f <= dual_off_f) id(oq_dual_hp_disable_hold_elapsed_accum_min) += dt_s / 60.0f;
              else id(oq_dual_hp_disable_hold_elapsed_accum_min) = 0.0f;

              if (!id(oq_dual_hp_enabled) && id(oq_dual_hp_enable_hold_elapsed_accum_min) >= (float) on_hold) {
                id(oq_dual_hp_enabled) = true;
                id(oq_dual_hp_disable_hold_elapsed_accum_min) = 0.0f;
              } else if (id(oq_dual_hp_enabled) && id(oq_dual_hp_disable_hold_elapsed_accum_min) >= (float) off_hold) {
                id(oq_dual_hp_enabled) = false;
                id(oq_dual_hp_enable_hold_elapsed_accum_min) = 0.0f;
              }
            }
            const bool needs_dual = (f > dual_on_f) || (prefer_single && id(oq_dual_hp_enabled));

            if (prefer_single && !needs_dual) {
              if (lead_is_hp1) hp1_req = f;
              else hp2_req = f;
              request_owner_hp = lead_is_hp1 ? 1 : 2;
              request_reason_code = lead_is_hp1 ? 2 : 3;
            } else {
              hp1_req = f / 2;
              hp2_req = f / 2;
              if ((f % 2) == 1) {
                if (lead_is_hp1) hp1_req += 1;
                else hp2_req += 1;
              }
              request_owner_hp = 0;
              request_reason_code = 4;
            }
          } else {
            float P_target = P_req_total;
            if (isnan(P_target)) P_target = 0.0f;
            if (P_target > cap_total) P_target = cap_total;
            if (P_target < 0.0f) P_target = 0.0f;

            const int last1 = id(hp1_last_applied_level);
            const int last2 = id(${ph_secondary_last_applied_level_id});
            const float P_EL_SOFT_W = ${oq_optimizer_soft_w};
            const float P_EL_PEAK_W = ${oq_power_peak_w};
            const float thermal_tie_band_w = fmaxf(150.0f, 0.05f * fmaxf(P_target, 1000.0f));
            const float thermal_keep_margin_w = fminf(90.0f, thermal_tie_band_w * 0.5f);
            float topology_power_margin_w = ${oq_optimizer_topology_power_margin_w};
            if (isnan(topology_power_margin_w) || topology_power_margin_w < 0.0f) topology_power_margin_w = 150.0f;
            float topology_heat_advantage_w = ${oq_optimizer_topology_heat_advantage_w};
            if (isnan(topology_heat_advantage_w) || topology_heat_advantage_w < 0.0f) topology_heat_advantage_w = 450.0f;
            const float pel_switch_margin_w = 150.0f;
            const float soft_switch_margin_w = 40.0f;
            struct DuoCandidate {
              bool valid;
              int l1;
              int l2;
              float p_th_w;
              float p_el_w;
              float err_w;
              float over_soft_w;
              int level_moves;
              int active_hp_count;
              int balance_steps;
              bool single_on_lead;
            };

            auto build_duo_candidate = [&](int l1, int l2)->DuoCandidate {
              DuoCandidate c{};
              c.valid = false;
              c.l1 = l1;
              c.l2 = l2;

              if (l1 > 0) {
                if (!hp1_available || !level_allowed(true, l1)) return c;
              }
              if (l2 > 0) {
                if (!hp2_available || !level_allowed(false, l2)) return c;
              }

              float p1 = (l1 == 0) ? 0.0f : oq_perf::interp_power_th_w(l1, Tamb, Tsup);
              if (l1 > 0 && isnan(p1)) return c;
              p1 *= hp1_th_fac;

              float p2 = (l2 == 0) ? 0.0f : oq_perf::interp_power_th_w(l2, Tamb, Tsup);
              if (l2 > 0 && isnan(p2)) return c;
              p2 *= hp2_th_fac;

              float pel1 = (l1 == 0) ? 0.0f : oq_perf::interp_power_el_w(l1, Tamb, Tsup);
              if (l1 > 0 && isnan(pel1)) pel1 = 0.0f;
              float pel2 = (l2 == 0) ? 0.0f : oq_perf::interp_power_el_w(l2, Tamb, Tsup);
              if (l2 > 0 && isnan(pel2)) pel2 = 0.0f;

              const float pel_sum = pel1 + pel2;
              if (pel_sum > P_EL_PEAK_W) return c;

              c.valid = true;
              c.p_th_w = p1 + p2;
              c.p_el_w = pel_sum;
              c.err_w = fabsf(c.p_th_w - P_target);
              c.over_soft_w = fmaxf(0.0f, pel_sum - P_EL_SOFT_W);
              c.level_moves = abs(l1 - last1) + abs(l2 - last2);
              c.active_hp_count = (l1 > 0 ? 1 : 0) + (l2 > 0 ? 1 : 0);
              c.balance_steps = abs(l1 - l2);
              c.single_on_lead =
                  (c.active_hp_count == 1) &&
                  (((l1 > 0) && lead_is_hp1) || ((l2 > 0) && !lead_is_hp1));
              return c;
            };

            auto better_duo_candidate = [&](const DuoCandidate &a, const DuoCandidate &b)->bool {
              const float soft_eps_w = 1.0f;
              const float pel_eps_w = 1.0f;
              const float err_eps_w = 1.0f;
              if (fabsf(a.over_soft_w - b.over_soft_w) > soft_eps_w) return a.over_soft_w < b.over_soft_w;
              if (fabsf(a.p_el_w - b.p_el_w) > pel_eps_w) return a.p_el_w < b.p_el_w;
              if (fabsf(a.err_w - b.err_w) > err_eps_w) return a.err_w < b.err_w;
              if (a.level_moves != b.level_moves) return a.level_moves < b.level_moves;
              if (a.active_hp_count == 2 && b.active_hp_count == 2 && a.balance_steps != b.balance_steps) {
                return a.balance_steps < b.balance_steps;
              }
              if (a.active_hp_count == 1 && b.active_hp_count == 1) {
                const int a_single = (a.l1 > 0) ? a.l1 : a.l2;
                const int b_single = (b.l1 > 0) ? b.l1 : b.l2;
                if (a_single == b_single && a.single_on_lead != b.single_on_lead) return a.single_on_lead;
              }
              if (a.l1 != b.l1) return a.l1 < b.l1;
              return a.l2 < b.l2;
            };

            const DuoCandidate current_candidate = build_duo_candidate(last1, last2);
            auto pick_topology_candidate = [&](int active_hp_count, DuoCandidate &chosen)->bool {
              float topology_best_err_w = 1e12f;
              bool have_topology_candidate = false;
              for (int l1 = 0; l1 <= level_cap; l1++) {
                for (int l2 = 0; l2 <= level_cap; l2++) {
                  const DuoCandidate c = build_duo_candidate(l1, l2);
                  if (!c.valid || c.active_hp_count != active_hp_count) continue;
                  have_topology_candidate = true;
                  if (c.err_w < topology_best_err_w) topology_best_err_w = c.err_w;
                }
              }
              if (!have_topology_candidate) return false;

              bool have_chosen = false;
              for (int l1 = 0; l1 <= level_cap; l1++) {
                for (int l2 = 0; l2 <= level_cap; l2++) {
                  const DuoCandidate c = build_duo_candidate(l1, l2);
                  if (!c.valid || c.active_hp_count != active_hp_count) continue;
                  if (c.err_w > (topology_best_err_w + thermal_tie_band_w)) continue;
                  if (!have_chosen || better_duo_candidate(c, chosen)) {
                    chosen = c;
                    have_chosen = true;
                  }
                }
              }
              return have_chosen;
            };

            DuoCandidate best_single_candidate{};
            const bool have_best_single = pick_topology_candidate(1, best_single_candidate);
            DuoCandidate best_duo_candidate{};
            const bool have_best_duo = pick_topology_candidate(2, best_duo_candidate);
            const bool valve_defrost_any = hp1_valve_def || hp2_valve_def;
            const bool hp1_single_active = (last1 > 0) && (last2 <= 0);
            const bool hp2_single_active = (last1 <= 0) && (last2 > 0);
            const bool single_topology_active = hp1_single_active || hp2_single_active;

            DuoCandidate best_candidate{};
            bool have_best_candidate = false;
            if (have_best_single && have_best_duo) {
              const DuoCandidate *preferred_candidate = &best_single_candidate;
              const DuoCandidate *alternate_candidate = &best_duo_candidate;
              if (best_duo_candidate.p_el_w < best_single_candidate.p_el_w) {
                preferred_candidate = &best_duo_candidate;
                alternate_candidate = &best_single_candidate;
              }
              best_candidate = *preferred_candidate;
              if (alternate_candidate->err_w + topology_heat_advantage_w < preferred_candidate->err_w) {
                best_candidate = *alternate_candidate;
              }
              have_best_candidate = true;
            } else if (have_best_single) {
              best_candidate = best_single_candidate;
              have_best_candidate = true;
            } else if (have_best_duo) {
              best_candidate = best_duo_candidate;
              have_best_candidate = true;
            }

            if (valve_defrost_any && single_topology_active && have_best_single &&
                have_best_candidate && (best_candidate.active_hp_count == 2)) {
              best_candidate = best_single_candidate;
            }
            if (valve_defrost_any && have_best_single && best_candidate.active_hp_count == 1) {
              if (hp1_single_active && best_candidate.l1 <= 0 && best_single_candidate.l1 > 0) {
                best_candidate = best_single_candidate;
              }
              if (hp2_single_active && best_candidate.l2 <= 0 && best_single_candidate.l2 > 0) {
                best_candidate = best_single_candidate;
              }
            }

            bool keep_current = false;
            int optimizer_reason_code = 2;
            if (have_best_candidate && current_candidate.valid) {
              const bool current_heat_ok = current_candidate.err_w <= (best_candidate.err_w + thermal_keep_margin_w);
              const bool topology_change =
                  (current_candidate.active_hp_count > 0) &&
                  (best_candidate.active_hp_count > 0) &&
                  (current_candidate.active_hp_count != best_candidate.active_hp_count);
              const bool single_owner_swap =
                  (current_candidate.active_hp_count == 1) &&
                  (best_candidate.active_hp_count == 1) &&
                  ((current_candidate.l1 > 0) != (best_candidate.l1 > 0));
              const bool hold_window_active =
                  (id(oq_duo_request_hold_until_ms) > 0) &&
                  (now_ms < id(oq_duo_request_hold_until_ms));
              const bool defrost_owner_hold_active =
                  single_owner_swap &&
                  ((hp1_valve_def || hp2_valve_def) ||
                   (hp1_defrost_owner_hold_until_ms > now_ms) ||
                   (hp2_defrost_owner_hold_until_ms > now_ms));
              const bool oil_return_topology_hold_active =
                  oil_return_hold_active &&
                  current_heat_ok &&
                  (topology_change || single_owner_swap);
              const bool topology_change_allowed =
                  !topology_change ||
                  (best_candidate.err_w + topology_heat_advantage_w < current_candidate.err_w) ||
                  (best_candidate.p_el_w + topology_power_margin_w < current_candidate.p_el_w);
              const bool hold_active =
                  hold_window_active &&
                  current_heat_ok &&
                  topology_change &&
                  !topology_change_allowed;
              const bool better_soft_guard =
                  current_candidate.over_soft_w > (best_candidate.over_soft_w + soft_switch_margin_w);
              const float efficiency_switch_margin_w =
                  topology_change ? topology_power_margin_w : pel_switch_margin_w;
              const bool better_efficiency =
                  current_candidate.p_el_w > (best_candidate.p_el_w + efficiency_switch_margin_w);

              if (defrost_owner_hold_active) {
                keep_current = true;
                optimizer_reason_code = 7;
              } else if (oil_return_topology_hold_active) {
                keep_current = true;
                optimizer_reason_code = 15;
              } else if (hold_active && current_heat_ok) {
                keep_current = true;
                optimizer_reason_code = (hp1_valve_def || hp2_valve_def) ? 7 : 6;
              } else if (topology_change && !topology_change_allowed && current_heat_ok) {
                keep_current = true;
                optimizer_reason_code = 6;
              } else if (!current_heat_ok) {
                optimizer_reason_code = 8;
              } else if (better_soft_guard) {
                optimizer_reason_code = 9;
              } else if (better_efficiency) {
                optimizer_reason_code = 10;
              } else {
                keep_current = true;
                optimizer_reason_code = 5;
              }
            } else if (!have_best_candidate) {
              keep_current = current_candidate.valid;
              optimizer_reason_code = keep_current ? 5 : 11;
            } else {
              optimizer_reason_code = 8;
            }

            const DuoCandidate chosen_candidate =
                (keep_current && current_candidate.valid) ? current_candidate : best_candidate;
            hp1_req = chosen_candidate.valid ? chosen_candidate.l1 : 0;
            hp2_req = chosen_candidate.valid ? chosen_candidate.l2 : 0;
            request_reason_code = optimizer_reason_code;

            switch (optimizer_reason_code) {
              case 5: publish_optimizer_reason("keep_current"); break;
              case 6: publish_optimizer_reason("hold_active"); break;
              case 7: publish_optimizer_reason("defrost_hold"); break;
              case 8: publish_optimizer_reason("better_heat"); break;
              case 9: publish_optimizer_reason("soft_guard"); break;
              case 10: publish_optimizer_reason("less_power"); break;
              case 11: publish_optimizer_reason("no_candidate"); break;
              case 15: publish_optimizer_reason("oil_return_hold"); break;
              default: break;
            }

            int def_comp_min_f = (int) roundf(${oq_defrost_comp_min_f});
            if (def_comp_min_f < 0) def_comp_min_f = 0;
            if (def_comp_min_f > demand_max_f) def_comp_min_f = demand_max_f;
            int def_comp_boost = (int) roundf(${oq_defrost_comp_boost_steps});
            if (def_comp_boost < 0) def_comp_boost = 0;
            if (def_comp_boost > 3) def_comp_boost = 3;
            const bool chosen_underdelivers =
                chosen_candidate.valid && (chosen_candidate.p_th_w + thermal_tie_band_w < P_target);
            const bool allow_defrost_boost =
                (def_comp_boost > 0) &&
                (f >= def_comp_min_f) &&
                chosen_underdelivers &&
                chosen_candidate.valid &&
                (chosen_candidate.active_hp_count == 2);
            if (allow_defrost_boost) {
              if (hp1_valve_def && !hp2_valve_def && hp2_req > 0) {
                hp2_req = std::min(level_cap, hp2_req + def_comp_boost);
                request_reason_code = 12;
                publish_optimizer_reason("defrost_boost");
              }
              if (hp2_valve_def && !hp1_valve_def && hp1_req > 0) {
                hp1_req = std::min(level_cap, hp1_req + def_comp_boost);
                request_reason_code = 12;
                publish_optimizer_reason("defrost_boost");
              }
            }
            if (hp1_req > 0 && hp2_req == 0) request_owner_hp = 1;
            else if (hp2_req > 0 && hp1_req == 0) request_owner_hp = 2;
            else request_owner_hp = 0;

            const bool single_req = ((hp1_req > 0) != (hp2_req > 0));
            const bool both_idle_prev = (id(hp1_last_applied_level) <= 0 && id(${ph_secondary_last_applied_level_id}) <= 0);
            if (single_req && both_idle_prev && !(hp1_def || hp2_def) && !(hp1_valve_def || hp2_valve_def)) {
              const int req_single = (hp1_req > 0) ? hp1_req : hp2_req;
              const bool lead_can = level_allowed(lead_is_hp1, req_single);
              const bool lag_can = level_allowed(!lead_is_hp1, req_single);
              if (lead_can && lag_can) {
                if (lead_is_hp1) {
                  hp1_req = req_single;
                  hp2_req = 0;
                  request_owner_hp = 1;
                } else {
                  hp2_req = req_single;
                  hp1_req = 0;
                  request_owner_hp = 2;
                }
                request_reason_code = 13;
                publish_optimizer_reason("runtime_lead");
              }
            }
          }
          #else
          publish_optimizer_reason("single_topology");
          const float Pr = id(house_rated_power_w).state;
          float P_req_total = id(oq_phouse_req_w);
          float P_cap = NAN;
          if (!isnan(Pr) && Pr > 0.0f) P_cap = (Pr * ((float) f / (float) demand_max_f));
          if (!isnan(P_cap)) P_req_total = std::min(P_req_total, P_cap);

          const float cap_total = publish_capacity_and_deficit(P_req_total);
          const bool perf_inputs_valid = !isnan(Tamb) && !isnan(Tsup) && level_cap > 0;
          if (!perf_inputs_valid) {
            hp1_req = f;
            request_reason_code = (f > 0) ? 2 : 1;
          } else {
            float P_target = P_req_total;
            if (isnan(P_target)) P_target = 0.0f;
            if (P_target > cap_total) P_target = cap_total;
            if (P_target < 0.0f) P_target = 0.0f;

            const int last1 = id(hp1_last_applied_level);
            float best_cost = 1e12f;
            int best_l1 = 0;
            const float W_change_penalty_per_step = 50.0f;
            const float P_EL_SOFT_W = ${oq_optimizer_soft_w};
            const float P_EL_PEAK_W = ${oq_power_peak_w};
            const float W_el_over_soft_penalty_per_W = ${oq_optimizer_penalty_per_w};

            for (int l1 = 0; l1 <= level_cap; l1++) {
              if (l1 > 0 && !level_allowed(true, l1)) continue;

              float p1 = (l1 == 0) ? 0.0f : oq_perf::interp_power_th_w(l1, Tamb, Tsup);
              if (l1 > 0 && isnan(p1)) continue;
              p1 *= hp1_th_fac;

              float pel1 = (l1 == 0) ? 0.0f : oq_perf::interp_power_el_w(l1, Tamb, Tsup);
              if (l1 > 0 && isnan(pel1)) pel1 = 0.0f;
              if (pel1 > P_EL_PEAK_W) continue;

              float cost = fabsf(p1 - P_target);
              cost += W_change_penalty_per_step * (float) abs(l1 - last1);
              if (pel1 > P_EL_SOFT_W) cost += (pel1 - P_EL_SOFT_W) * W_el_over_soft_penalty_per_W;

              if (cost < best_cost) {
                best_cost = cost;
                best_l1 = l1;
              }
            }
            hp1_req = best_l1;
            request_reason_code = (best_l1 > 0) ? 14 : 0;
          }
          request_owner_hp = (hp1_req > 0) ? 1 : 0;
          hp2_req = 0;
          #endif

          id(oq_ph_request_hp1_level) = hp1_req;
          id(oq_ph_request_hp2_level) = hp2_req;
          id(oq_ph_request_owner_hp) = request_owner_hp;
          id(oq_ph_request_reason_code) = request_reason_code;

          // ===== v0.32 #1: Self-learning UA estimator =====
          // Estimates the house heat-loss coefficient (W/K) from observed
          // HP thermal output relative to (Trsp - Tout) during stable
          // heating periods. Default OFF (opt-in via switch). The estimate
          // is published as a diagnostic; user explicitly applies it via
          // the "Apply UA estimate" button.
          //
          // Sampling preconditions (all must hold):
          //   - UA learning enabled
          //   - Strategy active (CM2/CM3, in heating)
          //   - Room within ±0.3 K of setpoint (steady comfort, not warming up)
          //   - No DHW active, no defrost on either HP, no oil-return hold
          //   - HP delivering >= 500 W estimated thermal (excludes near-idle)
          //   - Tout valid; (Trsp - Tout) >= 5 K (avoid divide-by-tiny)
          //   - dt since last sample >= 2 minutes (decimate)
          //
          // Update law: UA_sample = P_th_estimate / max(Trsp - Tout, 5)
          //   UA_ema += (dt/τ) · (UA_sample − UA_ema)  with τ = ph_ua_learn_tau_h
          // Outlier rejection: skip if UA_sample > 3·UA_ema (when ema > 0).
          {
            const bool ua_enabled = id(oq_phouse_ua_learn_enable).state;
            const bool ua_inputs_valid = !isnan(Tout) && !isnan(Tsup_meas) && !isnan(Trsp);
            float p_th_estimate_w = 0.0f;
            const int hp1_lvl_for_est = id(hp1_last_applied_level);
            #if OQ_TOPOLOGY_DUO
            const int hp2_lvl_for_est = id(${ph_secondary_last_applied_level_id});
            #else
            const int hp2_lvl_for_est = 0;
            #endif
            if (ua_inputs_valid && hp1_lvl_for_est > 0) {
              float p1 = oq_perf::interp_power_th_w(hp1_lvl_for_est, Tamb, Tsup_meas);
              if (!isnan(p1)) {
                if (hp1_valve_def) p1 *= def_fac;
                p_th_estimate_w += p1;
              }
            }
            #if OQ_TOPOLOGY_DUO
            if (ua_inputs_valid && hp2_lvl_for_est > 0) {
              float p2 = oq_perf::interp_power_th_w(hp2_lvl_for_est, Tamb, Tsup_meas);
              if (!isnan(p2)) {
                if (hp2_valve_def) p2 *= def_fac;
                p_th_estimate_w += p2;
              }
            }
            #endif
            id(oq_phouse_hp_th_estimate_w) = p_th_estimate_w;

            // Determine skip reason for diagnostics. Order mirrors the gate
            // checks below; the first failing condition wins.
            int ua_skip = 0;
            if (!ua_enabled) {
              ua_skip = 1;
            } else if (!active || !(cm_code == 2 || cm_code == 3)) {
              ua_skip = 2;
            } else if (!ua_inputs_valid) {
              ua_skip = 3;
            }
            if (ua_skip == 0 && ua_enabled && active && ua_inputs_valid &&
                (cm_code == 2 || cm_code == 3)) {
              // v0.32 fix: looser stability tolerance and use Tr (actual room
              // temperature) instead of Trsp for the heat-loss math. Heat loss
              // is proportional to (T_room - T_outdoor), regardless of setpoint.
              // A room sitting steady at 19.5 °C with setpoint 20 °C still
              // gives a valid UA sample.
              const float room_err = fabsf(Tr - Trsp);
              const bool dhw_quiet = !id(oq_dhw_block_cv_priority);
              const bool defrost_quiet = !hp1_valve_def && !hp2_valve_def && !hp1_def && !hp2_def;
              const bool oil_quiet = !oil_return_hold_active;
              const bool hp_active_min = p_th_estimate_w >= 500.0f;
              const float dT_load = Tr - Tout;  // actual room ↔ outdoor delta
              const bool dT_ok = dT_load >= 3.0f;
              const bool stable = room_err <= 0.6f;

              const uint32_t last_sample_ms = id(oq_phouse_ua_last_sample_ms);
              const uint32_t min_dt_sample_ms = 120000UL;  // 2 minutes
              const bool sample_dt_ok = (last_sample_ms == 0) ||
                  (now_ms > last_sample_ms && (now_ms - last_sample_ms) >= min_dt_sample_ms);

              if (!stable) ua_skip = 4;
              else if (!dhw_quiet) ua_skip = 5;
              else if (!defrost_quiet) ua_skip = 6;
              else if (!oil_quiet) ua_skip = 7;
              else if (!hp_active_min) ua_skip = 8;
              else if (!dT_ok) ua_skip = 9;
              else if (!sample_dt_ok) ua_skip = 10;

              if (stable && dhw_quiet && defrost_quiet && oil_quiet &&
                  hp_active_min && dT_ok && sample_dt_ok) {
                ua_skip = 0;
                const float ua_sample = p_th_estimate_w / dT_load;  // W/K
                float ua_ema = id(oq_phouse_ua_estimate_wpk);
                const int sample_count = id(oq_phouse_ua_sample_count);

                // Outlier rejection: ignore wildly off samples once ema is established.
                bool accept_sample = true;
                if (ua_ema > 0.5f && (ua_sample > 3.0f * ua_ema || ua_sample < 0.25f * ua_ema)) {
                  accept_sample = false;
                }
                // Sanity: 50..2000 W/K covers extreme cases (very small flat to oversized house).
                if (ua_sample < 50.0f || ua_sample > 2000.0f) accept_sample = false;

                if (accept_sample) {
                  const float tau_h = clampf(id(ph_ua_learn_tau_h).state, 24.0f, 168.0f);
                  const float tau_s = tau_h * 3600.0f;
                  // First 6 samples: arithmetic blend so the estimate seeds quickly.
                  if (sample_count < 6 || ua_ema <= 0.0f) {
                    if (ua_ema <= 0.0f) ua_ema = ua_sample;
                    else ua_ema = ua_ema + (ua_sample - ua_ema) / (float)(sample_count + 1);
                  } else {
                    const float dt_sample_s = (last_sample_ms == 0) ? (float)min_dt_sample_ms / 1000.0f
                        : (float)(now_ms - last_sample_ms) / 1000.0f;
                    const float alpha = 1.0f - expf(-dt_sample_s / tau_s);
                    ua_ema += alpha * (ua_sample - ua_ema);
                  }
                  id(oq_phouse_ua_estimate_wpk) = ua_ema;
                  id(oq_phouse_ua_sample_count) = sample_count + 1;
                  id(oq_phouse_ua_last_sample_ms) = now_ms;
                }
              }
            }
            id(oq_phouse_ua_skip_reason) = ua_skip;
          }

          id(oq_strategy_phase_code) = (f > 0) ? 1 : 0;
          id(oq_strategy_requested_power_w) = id(oq_phouse_req_w);
          id(oq_strategy_supply_target_temp) = NAN;
          id(oq_strategy_heat_request_active) = (f > 0);
          id(oq_strategy_phase_text).publish_state((f > 0) ? "heat" : "idle");

          char debug_buf[200];
          snprintf(
            debug_buf, sizeof(debug_buf),
            "ph f=%d raw=%d preq=%.0f owner=%d reason=%d sgain=%.0f ua=%.1f n=%d",
            f, raw, id(oq_phouse_req_w), request_owner_hp, request_reason_code,
            id(oq_phouse_solar_gain_w), id(oq_phouse_ua_estimate_wpk),
            id(oq_phouse_ua_sample_count));
          id(oq_strategy_debug_state).publish_state(debug_buf);
