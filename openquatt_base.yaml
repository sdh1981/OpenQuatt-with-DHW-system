# ==============================================================================
# OpenQuatt - Shared Base Config
# ==============================================================================
# Common ESPHome/ESP32 runtime shared by all hardware profiles.
# Hardware-specific pin/board substitutions are provided by profile files.
# ==============================================================================

# ==============================================================================
# PACKAGES
# ==============================================================================
substitutions:
  <<: !include openquatt/topology/oq_topology_duo.yaml
  main_release_manifest_url: "https://github.com/jeroen85/OpenQuatt/releases/latest/download/openquatt-duo-ota.manifest.json"
  dev_release_manifest_url: "https://github.com/jeroen85/OpenQuatt/releases/download/dev-latest/openquatt-duo-ota.manifest.json"
  # Stable OTA channel by default. Dev builds should override both substitutions
  # via `esphome -s release_channel dev -s release_manifest_url ... compile ...`.
  release_manifest_url: "https://github.com/jeroen85/OpenQuatt/releases/latest/download/openquatt-duo-ota.manifest.json"

packages:
  <<: !include openquatt/oq_packages_common.yaml
  <<: !include openquatt/topology/oq_topology_packages_duo.yaml
  # v0.40: replaced external ESP32 Dallas-bridge with CWT-TM-8PT 8-channel
  # PT1000 module on the same RS485 bus (now 9600 8N1 instead of 19200 8E1).
  # The old oq_dhw_modbus_bridge.yaml is kept in the repo for rollback but
  # is no longer included.
  oq_cwt_pt_module: !include openquatt/oq_cwt_pt_module.yaml

# ==============================================================================
# ESPHOME CORE
# ==============================================================================
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: ${project_name}
    version: ${project_version}
  min_version: 2026.4.0
  name_add_mac_suffix: false
  includes:
    - ${hp_perf_map_header}
    - ${thermal_request_logic_header}
    - ${heating_curve_logic_header}
    - ${dhw_controller_logic_header}
  # v0.50: verplaatst uit platformio_options; dat pad is sinds 2026.7.0
  # deprecated en verdwijnt in 2026.12.0. Beide routes roepen intern dezelfde
  # cg.add_build_flag() aan, dus de vlag komt identiek terecht.
  build_flags:
    # Hard-pinned for Duo entrypoints to prevent accidental topology drift.
    - -DOQ_TOPOLOGY_DUO=1
  on_boot:
    priority: -100
    then:
      - text_sensor.template.publish:
          id: oq_project_version_text
          state: "${project_version}"
      - text_sensor.template.publish:
          id: oq_release_channel_text
          state: "${release_channel}"
      - lambda: |-
          if (id(oq_firmware_update_channel).current_option() == "dev") {
            id(oq_firmware_update).set_source_url("${dev_release_manifest_url}");
          } else {
            id(oq_firmware_update).set_source_url("${main_release_manifest_url}");
          }

# ==============================================================================
# PSRAM
# ==============================================================================
# De ESP32-S3 op de T-Connect heeft PSRAM, maar die lag ongebruikt: er stond
# geen psram-component in de config. Alles draaide dus op het interne SRAM --
# dezelfde bron waar de DHW-tick, de beveiligingsmodules en de cooling-lambdas
# al twee keer een stack-verhoging naar 32 kB nodig maakten.
#
# Fout raden van de modus is ongevaarlijk: CONFIG_SPIRAM_IGNORE_NOTFOUND
# hieronder laat de chip gewoon starten zonder PSRAM. De sensor "PSRAM vrij"
# vertelt daarna of het gelukt is. Zie oq_substitutions_common.yaml om te
# wisselen tussen octal en quad.
psram:
  mode: ${oq_psram_mode}
  speed: ${oq_psram_speed}

# ==============================================================================
# PLATFORM
# ==============================================================================
esp32:
  board: ${esp_board}
  flash_size: ${esp_flash_size}
  variant: ${esp_variant}
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      # ---- PSRAM ----
      # Laat de allocator PSRAM meenemen voor grote blokken. ALWAYSINTERNAL
      # houdt alles onder 8 kB in intern SRAM (snel, en veel kleine allocaties
      # in PSRAM kosten juist performance). RESERVE_INTERNAL houdt 64 kB
      # intern achter de hand voor zaken die dwingend intern moeten, zoals
      # DMA-buffers en interrupt-handlers.
      CONFIG_SPIRAM_USE_MALLOC: y
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "8192"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "65536"
      # Het vangnet: geen of niet-herkende PSRAM betekent doorstarten zonder,
      # niet een chip die in een bootloop belandt. Zonder deze regel kan een
      # verkeerd geraden modus een seriele herflash betekenen.
      CONFIG_SPIRAM_IGNORE_NOTFOUND: y
      # v0.50: `COMPILER_OPTIMIZATION_SIZE: y` stond hier zonder CONFIG_-prefix,
      # waardoor kconfgen de regel als malformed weggooide ("ignoring malformed
      # line"). Toevoegen van de prefix is niet nodig: ESPHome zet zelf al
      # CONFIG_COMPILER_OPTIMIZATION_SIZE=y, want `compiler_optimization` staat
      # standaard op SIZE. De -Os-build blijft dus ongewijzigd.
      CONFIG_BT_ENABLED: n
      # ---- Stack sizing ----
      # The DHW controller tick lambda and cooling strategy lambdas grew large
      # with v0.32 smart features + recent additions (coil-in mapping, legionella
      # ETA, slew limiter, etc.). The default ESP main task stack (3584 bytes)
      # is too tight for those lambdas, causing intermittent
      # `vApplicationStackOverflowHook` crashes on core 1. Bumping to 32 kB gives
      # generous headroom for nested lambdas + ESPHome scheduler overhead.
      # The ESP32-S3 has 512 kB SRAM so the ~28 kB extra is negligible.
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "32768"
      # Timer task runs ESPHome scheduled callbacks (interval lambdas).
      # Raised omdat zware lambdas op core 1 stack-overflow gaven:
      #  - legionella hold-handler (DHW controller logic)
      #  - cooling slew limiter
      #  - DHW state machine tick (Config + Inputs + Outputs op stack)
      #  - sensor calibration state machine
      # 12 kB was te krap zodra Hot Water mode + nieuwe legionella hold actief
      # waren. 20 kB was daarna voldoende tot v0.42.1 (juni 2026): extra code
      # in cooling/supervisory lambdas deed de canary sneuvelen. 32 kB = zelfde
      # headroom als de main task; ESP32-S3 512 kB SRAM maakt dit verwaarloosbaar.
      CONFIG_ESP_TIMER_TASK_STACK_SIZE: "32768"
      # FreeRTOS stack-overflow detection: full-stack-canary detection so future
      # overflows are caught with a clear backtrace instead of silent corruption.
      CONFIG_FREERTOS_CHECK_STACKOVERFLOW_CANARY: y
      # HTTP server task stack. Default is 4096 bytes, which causes stack overflow
      # when serving the large OpenQuatt web bundle. 8192 bytes gives enough room
      # while leaving ~4 KB more heap than the previous hardcoded 12288 in web_server_idf.cpp.
      CONFIG_HTTPD_TASK_STACKSIZE: "8192"
