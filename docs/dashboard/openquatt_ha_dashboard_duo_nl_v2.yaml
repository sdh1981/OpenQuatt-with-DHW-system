  - type: grid
    cards:
    - type: heading
      icon: mdi:cloud-check
      heading_style: title
      heading: Quatt CiC-configuratie
    - type: markdown
      content: |-
        <details>
        <summary><strong>Uitleg</strong></summary>

        Dit blok toont de status van de CiC-feed.
        Als de feed niet OK is of data stale wordt, kunnen CIC-bronnen
        onbruikbaar worden voor de geselecteerde signalen.

        Controleer bij afwijkingen:
        - `JSON feed OK`
        - `Data verouderd`
        - `Tijd sinds laatste succes`

        </details>
      text_only: true
    - type: entities
      show_header_toggle: false
      entities:
      - entity: binary_sensor.openquatt_cic_json_feed_ok
        name: JSON feed OK
      - entity: binary_sensor.openquatt_cic_data_stale
        name: Data verouderd
      - entity: text.openquatt_cic_feed_url
        name: CIC feed URL
  - type: grid
    cards:
    - type: heading
      icon: mdi:tools
      heading: Runtime / draaiuren
      heading_style: title
    - type: markdown
      content: |-
        <details>
        <summary><strong>Uitleg parameters</strong></summary>

        - **Reset draaitellers**. Let op: het kan maximaal 1 minuut duren voordat je effect ziet.
        - **Reset cumulatieve energietellers** zet cumulatieve elektriciteits- en warmte-energiemeters terug naar 0.
        - **HP1/HP2 draaitijd counters** tonen de actuele teller waarop de runtime-balans wordt gebaseerd.
        - **Leidende HP** toont welke unit momenteel lead is op basis van de laagste runtime.

        </details>
      text_only: true
    - type: entities
      show_header_toggle: false
      entities:
      - entity: sensor.openquatt_hp1_runtime_hours
        name: HP1 draaitijd
      - entity: sensor.openquatt_hp2_runtime_hours
        name: HP2 draaitijd
      - entity: sensor.openquatt_runtime_lead_hp
        name: Leidende HP
  - type: grid
    cards:
    - type: heading
      icon: mdi:tools
      heading: Flow autotune
      heading_style: title
    - type: markdown
      content: |-
        <details>
        <summary><strong>Uitleg parameters</strong></summary>

        - **Flow autotune** starten bij stabiele installatie en zonder actieve fouten.
        - Eerst `u_step` en `max duration` bepalen, daarna pas autotune starten.
        - `Apply autotune Kp/Ki` alleen toepassen als de voorgestelde waarden logisch zijn.

        </details>
      text_only: true
    - type: entities
      show_header_toggle: false
      entities:
      - entity: sensor.openquatt_flow_autotune_status
        name: Autotune status
  - type: grid
    cards:
    - type: heading
      icon: mdi:stethoscope
      heading: Debug
      heading_style: title
    - type: markdown
      content: |-
        <details>
        <summary><strong>Uitleg</strong></summary><ha-alert alert-type="warning">Pas op, dit overruled de ControlMode van OpenQuatt!</ha-alert>

        `CM override`: handmatige mode-override; normaal op `Auto` laten.

        </details>
      text_only: true
    - type: entities
      title: Element Only Heating (CM6)
      show_header_toggle: false
      entities:
      - entity: sensor.openquatt_dhw_element_only_state
        name: Status
      - entity: sensor.openquatt_dhw_element_only_elapsed
        name: Verstreken (min)
    - type: entities
      title: Ontluchtingsprotocol (CM97)
      show_header_toggle: false
      entities:
      - entity: sensor.openquatt_air_purge_phase
        name: Fase nummer
      - entity: sensor.openquatt_air_purge_phase_text
        name: Fase
      - entity: sensor.openquatt_air_purge_remaining
        name: Resterend (s)
