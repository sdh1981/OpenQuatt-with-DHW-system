title: OpenQuatt
views:
  - title: Overzicht
    path: overzicht
    icon: mdi:view-dashboard
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: heading
            icon: mdi:speedometer
            heading: Live prestaties
            heading_style: title
          - type: markdown
            content: >-
              <details>

              <summary><strong>Uitleg</strong></summary>


              Deze waarden geven live de belangrijkste systeemprestatie:

              - `Power E`: totaal elektrisch ingangsvermogen van de
              warmtepomp(en).

              - `Power H`: totaal thermisch afgegeven vermogen.

              - `COP`: verhouding `Power H / Power E` (momentane efficientie).

              - `Flow`: actuele volumestroom die als basis dient voor
              flowbewaking.

              - `Buitentemp`: geselecteerde bron voor buitentemperatuur in de
              regeling.

              - `Aanvoertemperatuur`: geselecteerde bron voor actuele
              watersupply.


              </details>
            text_only: true
          - type: tile
            entity: sensor.openquatt_total_power_input
            name: Power E
            vertical: false
            features:
              - type: trend-graph
            features_position: bottom
          - type: tile
            entity: sensor.openquatt_total_heat_power
            name: Power H
            vertical: false
            features:
              - type: trend-graph
            features_position: bottom
          - type: tile
            entity: sensor.openquatt_total_cop
            name: COP
            vertical: false
            features:
              - type: trend-graph
            features_position: bottom
          - type: tile
            entity: sensor.openquatt_flow_average_selected
            name: Flow
            vertical: false
            features:
              - type: trend-graph
            features_position: bottom
          - type: tile
            entity: sensor.openquatt_outside_temperature_selected
            name: Buitentemp
            vertical: false
            features:
              - type: trend-graph
            features_position: bottom
          - type: tile
            entity: sensor.openquatt_water_supply_temp_selected
            name: Aanvoertemperatuur
            vertical: false
            features:
              - type: trend-graph
            features_position: bottom
          - type: markdown
            content: >-
              {% set p_w = states('sensor.openquatt_total_power_input') | float(0) %}
              {% set t = states('sensor.openquatt_dhw_electricity_tariff') | float(0) %}
              **Kosten: {{ ((p_w / 1000) * t) | round(3) }} EUR/uur** ({{ p_w | int }} W x {{ t }} EUR/kWh)
            text_only: true
      - type: grid
        cards:
          - type: heading
            heading_style: title
            heading: Systeemstatus
            icon: mdi:state-machine
          - type: markdown
            content: >-
              <details>

              <summary><strong>Uitleg</strong></summary>


              Dit blok toont de actieve regeltoestand:

              - `ControlMode`: huidige bedrijfsmodus/stap van de state machine.

              - `Flow mode`: manier waarop de pomp/flowregeling momenteel werkt.

              - `Verwarmingsstrategie`: bron van de warmtevraag (bijv. Power
              House/curve).

              - `DHW Element Actief`: 3 kW element in de tank wordt aangestuurd
              (gebruikt tijdens DHW boost en legionella element-fase).

              - `Stille modus actief`: toont of het stil-venster nu van kracht
              is.


              </details>
            text_only: true
          - type: tile
            entity: sensor.openquatt_control_mode_label
            name: ControlMode
            vertical: false
            features_position: bottom
          - type: tile
            entity: sensor.openquatt_flow_mode
            name: Flow mode
            vertical: false
            features_position: bottom
          - type: tile
            entity: sensor.openquatt_heating_strategy
            name: Verwarmingsstrategie
            vertical: false
            features_position: bottom
          - type: tile
            entity: binary_sensor.openquatt_dhw_element_active
            name: DHW Element Actief
            vertical: false
            features_position: bottom
          - type: tile
            entity: binary_sensor.openquatt_silent_active
            name:
              type: entity
            vertical: false
            features_position: bottom
          - type: heading
            icon: mdi:tune-variant
            heading: Bediening
            heading_style: title
          - type: markdown
            content: >-
              <details>

              <summary><strong>Uitleg</strong></summary>


              Gebruik deze schakelaars voor directe runtime-bediening:

              - `OpenQuatt regeling`: schakelt de automatische verwarmings- en
              koelregeling tijdelijk uit of weer in. Bewaking en
              vorstbeveiliging blijven actief.

              - `Hervat automatisch`: kies een datum en tijd waarop de
              regeling vanzelf weer wordt ingeschakeld nadat je haar tijdelijk
              hebt uitgezet.

              - `Handmatige koeling`: telt mee als extra koeltoestemming,
              bovenop CIC en/of HA-invoer.

              - `Stille modus override`: zet stille modus op `Schema`, `Aan`
              of `Uit`.


              </details>
            text_only: true
          - type: tile
            entity: switch.openquatt_enabled
            name: OpenQuatt regeling
            vertical: false
            features:
              - type: toggle
            features_position: inline
          - type: tile
            visibility:
              - condition: state
                entity: switch.openquatt_enabled
                state: 'off'
            entity: datetime.openquatt_resume_at
            name: Hervat automatisch
            icon: mdi:calendar-clock
            vertical: false
          - type: tile
            entity: switch.openquatt_manual_cooling_enable
            name: Handmatige koeling
            vertical: false
            features:
              - type: toggle
            features_position: inline
          - type: tile
            entity: select.openquatt_silent_mode_override
            name: Stille modus override
            vertical: false

      - type: grid
        cards:
          - type: heading
            heading: Thermostaat
            heading_style: title
            icon: mdi:home-thermometer
          - type: markdown
            content: >-
              <details>

              <summary><strong>Uitleg</strong></summary>


              Geselecteerde kamerregelwaarden:

              - `Doeltemperatuur`: gevraagde ruimtetemperatuur.

              - `Huidige temperatuur`: gemeten ruimtetemperatuur.

              Het verschil tussen deze twee bepaalt hoe sterk de warmtevraag
              oploopt.


              </details>
            text_only: true
          - type: custom:mini-graph-card
            name: Huidige kamertemperatuur
            entities:
              - entity: sensor.openquatt_room_temperature_selected
                name: Kamertemperatuur
                show_legend_state: true
              - entity: sensor.openquatt_room_setpoint_selected
                name: Doeltemperatuur
                show_fill: false
                show_legend_state: true
            show:
              icon: true
              name: true
              state: true
              legend: true
              labels: false
            points_per_hour: 30
            hours_to_show: 12
            line_width: 2
            hour24: true
            height: 80
            decimals: 1

      - type: grid
        cards:
          - type: heading
            icon: mdi:heat-pump-outline
            heading: HP1 vs HP2
            heading_style: title
          - type: tile
            entity: sensor.openquatt_hp1_power_input
            name: HP1 Vermogen
            vertical: false
            features:
              - type: trend-graph
            features_position: bottom
          - type: tile
            entity: sensor.openquatt_hp2_power_input
            name: HP2 Vermogen
            vertical: false
            features:
              - type: trend-graph
            features_position: bottom
          - type: tile
            entity: sensor.openquatt_hp1_cop
            name: HP1 COP
            vertical: false
            features:
              - type: trend-graph
            features_position: bottom
          - type: tile
            entity: sensor.openquatt_hp2_cop
            name: HP2 COP
            vertical: false
            features:
              - type: trend-graph
            features_position: bottom
          - type: tile
            entity: sensor.openquatt_hp1_runtime_hours
            name: HP1 Draaitijd
            vertical: false
          - type: tile
            entity: sensor.openquatt_hp2_runtime_hours
            name: HP2 Draaitijd
            vertical: false
      - type: grid
        column_span: 2
        cards:
          - type: heading
            icon: mdi:chart-line
            heading: Performance (12h)
            heading_style: title
          - type: markdown
            content: >-
              <details>

              <summary><strong>Uitleg</strong></summary>


              Deze grafiek combineert 12-uurs trends voor:


              - `Power E`: totaal elektrisch ingangsvermogen.

              - `Power H`: totaal thermisch afgegeven vermogen.

              - `COP`: efficientieverhouding (`Power H / Power E`).


              Gebruik dit om te controleren of warmteafgifte het opgenomen
              vermogen volgt en of COP realistisch blijft.

              </details>
            text_only: true
          - type: custom:apexcharts-card
            header:
              show: true
              title: Power E, Power H en COP
              show_states: true
              colorize_states: true
            graph_span: 12h
            update_interval: 30s
            apex_config:
              chart:
                height: 320
                animations:
                  enabled: false
              legend:
                show: true
                position: bottom
                clusterGroupedSeries: false
              yaxis:
                - id: watts
                  min: 0
                  decimalsInFloat: 0
                  title:
                    text: Vermogen (W)
                - id: cop
                  opposite: true
                  min: 0
                  decimalsInFloat: 1
                  title:
                    text: COP
              stroke:
                width: 2
                curve: smooth
              tooltip:
                shared: true
            series:
              - entity: sensor.openquatt_total_power_input
                name: Power E
                color: '#3B82F6'
                yaxis_id: watts
                type: line
                extend_to: end
                show:
                  legend_value: false
                group_by:
                  func: avg
                  duration: 5min
                  fill: last
              - entity: sensor.openquatt_total_heat_power
                name: Power H
                color: '#F59E0B'
                yaxis_id: watts
                type: line
                extend_to: end
                show:
                  legend_value: false
                group_by:
                  func: avg
                  duration: 5min
                  fill: last
              - entity: sensor.openquatt_total_cop
                name: COP
                color: '#10B981'
                yaxis_id: cop
                type: line
                extend_to: end
                show:
                  legend_value: false
                group_by:
                  func: avg
                  duration: 5min
                  fill: last
            grid_options:
              columns: full
      # ── EnergyOS integratie ───────────────────────────────
      - type: grid
        cards:
          - type: heading
            icon: mdi:lightning-bolt-circle
            heading: EnergyOS integratie
            heading_style: title
          - type: markdown
            content: >-
              EOS stuurt de warmtepomp aan op basis van tarief, PV-surplus en
              buitentemperatuur. De comfort floor voorkomt dat de HP te ver
              gethrotteld wordt bij koud weer.
            text_only: true
          - type: tile
            entity: sensor.openquatt_ext_electricity_tariff_now
            name: Tarief (EOS)
            vertical: false
            features:
              - type: trend-graph
          - type: tile
            entity: sensor.openquatt_ext_electricity_tariff_avg24
            name: Tarief 24h gem
            vertical: false
          - type: tile
            entity: sensor.openquatt_ext_grid_net_power
            name: Grid netto (W)
            vertical: false
            features:
              - type: trend-graph
          - type: tile
            entity: sensor.eos_asset_hp_min_comfort_cap
            name: Comfort floor
            vertical: false
          - type: tile
            entity: sensor.eos_asset_hp_pv_covered
            name: PV dekt HP
            vertical: false
          - type: tile
            entity: binary_sensor.openquatt_ext_dhw_solar_boost
            name: DHW solar boost
            vertical: false
          - type: tile
            entity: binary_sensor.openquatt_ext_dhw_legionella_cheap_window
            name: Legionella goedkoop
            vertical: false
          - type: tile
            entity: input_text.eos_current_reason
            name: EOS reden
            vertical: false
    cards: []
    header:
      card:
        type: markdown
        content: >-
          <div style="text-align:center;">
            <img src="/local/openenergyos_logo_wide_v6.svg"
                 alt="Open Energy OS for OpenQuatt"
                 width="720"
                 style="max-width:100%;height:auto;display:inline-block;border-radius:16px;" />
          </div>


          ## <ha-icon icon="mdi:view-dashboard"></ha-icon> Overzicht

          Snel en praktisch zicht op prestaties, status en bediening.
        text_only: true
      layout: center
      badges_position: top
      badges_wrap: wrap
    badges:
      - type: entity
        show_name: false
        show_state: true
        show_icon: false
        entity: sensor.openquatt_openquatt_version
        name:
          - type: device
          - type: entity
        state_content:
          - name
          - state
      - type: entity
        entity: sensor.openquatt_scop_7d
        name: SCOP 7d
        show_name: true
        show_state: true
        show_icon: true
      - type: entity
        entity: sensor.openquatt_scop_24h
        name: SCOP 24h
        show_name: true
        show_state: true
        show_icon: true
  - title: DHW
    path: dhw
    icon: mdi:water-boiler
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            icon: mdi:water-boiler
            heading: DHW regeling
            heading_style: title
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.openquatt_dhw_state
                name: DHW status
              - entity: sensor.openquatt_dhw_fault
                name: DHW fout
              - entity: switch.openquatt_dhw_lockout
                name: DHW lockout
              - entity: switch.openquatt_dhw_solar_boost_auto
                name: Boiler solar boost auto
              - entity: sensor.openquatt_dhw_electricity_tariff
                name: Stroomtarief (EUR/kWh)
              - entity: binary_sensor.openquatt_dhw_tariff_negative
                name: Tarief negatief
              - entity: button.openquatt_dhw_clear_fault
                name: Reset DHW fout
              - entity: number.openquatt_dhw_boost_target
                name: Boost doel (degC)
              - entity: switch.openquatt_dhw_boost_hp_assist
                name: Boost HP assist
              - entity: number.openquatt_dhw_boost_hp_assist_bottom_threshold
                name: Boost HP assist bodem drempel (°C)
              - entity: number.openquatt_dhw_boost_hp_assist_stop_top
                name: Boost HP assist stop top (°C)
              - entity: number.openquatt_dhw_legionella_target
                name: Legionella doel (degC)
              - entity: number.openquatt_dhw_hp_level
                name: DHW HP niveau
              - entity: number.openquatt_dhw_flow_min
                name: DHW flow min (l/h)
              - entity: number.openquatt_dhw_flow_max
                name: DHW flow max (l/h)
      - type: grid
        cards:
          - type: heading
            icon: mdi:rocket-launch
            heading: DHW snelboost
            heading_style: title
          - type: tile
            entity: switch.openquatt_dhw_boost_now
            name: Snelboost nu
            icon: mdi:rocket-launch
            features:
              - type: toggle
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.openquatt_dhw_boost_reden
                name: Boost reden
              - entity: sensor.openquatt_dhw_second_hp_assist_status
                name: Boost / assist status
              - entity: sensor.openquatt_dhw_hp_thermisch_vermogen
                name: HP thermisch vermogen (W)
              - entity: sensor.openquatt_dhw_boost_timeouts
                name: Boost timeouts
              - entity: number.openquatt_dhw_boost_now_target
                name: Snelboost doel tanktop (degC)
              - entity: number.openquatt_dhw_boost_now_hp_stop
                name: Snelboost HP stop tanktop (degC)
              - type: section
                label: Automatische boost (solar / tarief / PV)
              - entity: switch.openquatt_dhw_auto_boost_enable
                name: Automatische boost toestaan
              - entity: switch.openquatt_dhw_solar_boost_auto
                name: Trigger - goedkoop tarief
              - entity: switch.openquatt_dhw_pv_self_consumption_enable
                name: Trigger - PV-export
              - entity: number.openquatt_dhw_pv_boost_export_threshold
                name: PV-export drempel boost (W)
              - entity: binary_sensor.openquatt_ext_dhw_solar_boost
                name: Trigger - HA-proxy
      - type: grid
        cards:
          - type: heading
            icon: mdi:gauge
            heading: DHW rendement en tappingen
            heading_style: title
          - type: entities
            show_header_toggle: false
            entities:
              - type: section
                label: Laatste voltooide cyclus
              - entity: sensor.openquatt_dhw_cyclus_cop
                name: Cyclus COP
              - entity: sensor.openquatt_dhw_cyclus_energie_in
                name: Elektrisch erin (Wh)
              - entity: sensor.openquatt_dhw_cyclus_energie_uit
                name: Warmte eruit (Wh)
              - type: section
                label: Tappingen
              - entity: binary_sensor.openquatt_dhw_tapping_actief
                name: Er wordt getapt
              - entity: sensor.openquatt_dhw_tappingen_vandaag
                name: Tappingen vandaag
              - entity: sensor.openquatt_dhw_laatste_tapping_energie
                name: Laatste tapping (Wh)
              - entity: sensor.openquatt_dhw_tanktop_daalsnelheid
                name: Daalsnelheid tanktop (K/min)
              - entity: switch.openquatt_dhw_tapdetectie
                name: Tapdetectie aan
              - entity: number.openquatt_dhw_tapdetectie_drempel
                name: Drempel (K/min)
      - type: grid
        cards:
          - type: heading
            icon: mdi:stairs-up
            heading: DHW single HP en tweede-HP assist
            heading_style: title
          - type: entities
            show_header_toggle: false
            entities:
              - entity: switch.openquatt_dhw_single_hp_mode
                name: Single HP mode
              - entity: sensor.openquatt_dhw_single_hp_lead
                name: Actieve HP (vastgezet per cyclus)
              - entity: number.openquatt_dhw_single_hp_level_bump
                name: Single HP level bump
              - entity: number.openquatt_dhw_soft_start_step_time
                name: Zachte aanloop per stap (min)
              - entity: switch.openquatt_dhw_second_hp_assist
                name: Tweede HP assist
              - entity: number.openquatt_dhw_assist_max_level
                name: Assist max niveau
              - entity: number.openquatt_dhw_assist_min_tank_rise
                name: Assist min tankstijging (K/min)
              - entity: number.openquatt_dhw_assist_tank_bottom_stop
                name: Assist stop tankbodem (degC)
              - entity: number.openquatt_dhw_assist_max_discharge_temp
                name: Assist max persgas (degC)
              - entity: number.openquatt_dhw_assist_max_water_out
                name: Assist max water uit (degC)
              - entity: number.openquatt_dhw_assist_water_release_temp
                name: Assist vrijgave water uit (degC)
              - entity: number.openquatt_dhw_legionella_hp_top_ceiling
                name: Legionella HP plafond tanktop (degC)
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: heading
                heading: Warmwatervoorraad
                heading_style: title
                icon: mdi:water-boiler
              - type: custom:button-card
                entity: sensor.dhw_tank_lading
                show_name: false
                show_icon: false
                show_state: false
                tap_action:
                  action: more-info
                styles:
                  card:
                    - padding: 8px
                  custom_fields:
                    tank:
                      - width: 100%
                custom_fields:
                  tank: |
                    [[[
                      const pct = Math.max(0, Math.min(100, Math.round(Number(entity.state) || 0)));
                      const g = (id) => (states[id] && !isNaN(Number(states[id].state))) ? Math.round(Number(states[id].state)) : null;
                      const tt = g('sensor.openquatt_dhw_tank_top');
                      const tb = g('sensor.openquatt_dhw_tank_bottom');
                      const liters = g('sensor.dhw_bruikbaar_warm_water');
                      const mins = g('sensor.dhw_douchetijd');
                      const tankL = g('sensor.dhw_warm_water_in_tank');
                      const vol = g('number.openquatt_dhw_tank_volume') || 220;
                      const flow = g('input_number.dhw_calc_shower_flow_lpm') || 8;
                      const f = (v, u) => (v === null ? '–' : v + u);
                      const topY = Math.max(34, Math.min(258, 260 - (pct / 100) * 226));
                      const labelY = Math.min(254, topY + 24);
                      const lerp = (a, b, t) => Math.round(a + (b - a) * t);
                      const hx = (r, gg, bb) => '#' + [r, gg, bb].map((v) => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0')).join('');
                      const cstops = [[20, 47, 127, 224], [38, 157, 119, 201], [50, 238, 141, 58], [62, 240, 104, 47]];
                      const tcol = (t) => {
                        if (t === null) t = 40;
                        if (t <= cstops[0][0]) return hx(cstops[0][1], cstops[0][2], cstops[0][3]);
                        const last = cstops[cstops.length - 1];
                        if (t >= last[0]) return hx(last[1], last[2], last[3]);
                        for (let i = 0; i < cstops.length - 1; i++) {
                          if (t >= cstops[i][0] && t <= cstops[i + 1][0]) {
                            const fr = (t - cstops[i][0]) / (cstops[i + 1][0] - cstops[i][0]);
                            return hx(lerp(cstops[i][1], cstops[i + 1][1], fr), lerp(cstops[i][2], cstops[i + 1][2], fr), lerp(cstops[i][3], cstops[i + 1][3], fr));
                          }
                        }
                        return hx(last[1], last[2], last[3]);
                      };
                      const cTop = tcol(tt);
                      const cBot = tcol(tb);
                      const cMid = tcol((tt !== null && tb !== null) ? (tt + tb) / 2 : (tt !== null ? tt : tb));
                      return `
                        <svg viewBox="0 0 360 290" style="width:100%;height:auto">
                          <defs>
                            <linearGradient id="oqw" x1="0" y1="0" x2="0" y2="1">
                              <stop offset="0%" stop-color="${cTop}"/>
                              <stop offset="55%" stop-color="${cMid}"/>
                              <stop offset="100%" stop-color="${cBot}"/>
                            </linearGradient>
                            <clipPath id="oqc"><rect x="40" y="34" width="96" height="226" rx="34"/></clipPath>
                            <style>
                              @keyframes oqwave{0%,100%{transform:translateX(0)}50%{transform:translateX(-16px)}}
                              @keyframes oqrise{0%{transform:translateY(0);opacity:0}12%{opacity:.55}100%{transform:translateY(-150px);opacity:0}}
                              .oqwave{animation:oqwave 3.6s ease-in-out infinite}
                              .oqb{animation:oqrise 4.4s linear infinite}
                              .oqb2{animation-duration:5.4s;animation-delay:1.1s}
                              .oqb3{animation-duration:4.8s;animation-delay:2.2s}
                            </style>
                          </defs>
                          <rect x="40" y="34" width="96" height="226" rx="34" fill="#d8d6cd" opacity="0.30"/>
                          <g clip-path="url(#oqc)">
                            <rect x="36" y="${topY}" width="104" height="${262 - topY}" fill="url(#oqw)"/>
                            <g class="oqwave"><path d="M30 ${topY} q 13 -8 26 0 t 26 0 t 26 0 t 26 0 t 26 0 v 26 h -156 z" fill="${cTop}" opacity="0.9"/></g>
                            <circle class="oqb" cx="64" cy="256" r="3" fill="#fff" opacity="0.5"/>
                            <circle class="oqb oqb2" cx="92" cy="256" r="2.4" fill="#fff" opacity="0.45"/>
                            <circle class="oqb oqb3" cx="110" cy="256" r="3.4" fill="#fff" opacity="0.4"/>
                          </g>
                          <rect x="40" y="34" width="96" height="226" rx="34" fill="none" stroke="var(--divider-color,#8f8e87)" stroke-width="2.5"/>
                          <rect x="68" y="24" width="40" height="12" rx="5" fill="var(--divider-color,#8f8e87)"/>
                          <text x="88" y="${labelY}" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">${pct}%</text>
