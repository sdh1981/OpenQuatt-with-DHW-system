<svg width="100%" viewBox="0 0 770 250" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Open Energy OS for OpenQuatt logo</title>
  <desc>Breed logo: vier iconen links zonder overlap, druppel midden, tekst rechts</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d2240"/>
    </linearGradient>
    <linearGradient id="dropBody" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#5DCAA5"/>
      <stop offset="60%" stop-color="#185FA5"/>
      <stop offset="100%" stop-color="#0a2a5e"/>
    </linearGradient>
    <linearGradient id="dropShineL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#378ADD" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F6E56"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#EF9F27"/>
      <stop offset="50%" stop-color="#E24B4A"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ecfff"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#5DCAA5"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#378ADD"/>
      <stop offset="100%" stop-color="#5DCAA5"/>
    </linearGradient>
  </defs>

  <rect width="760" height="240" rx="16" fill="url(#bg)"/>
  <circle cx="730" cy="30" r="1.5" fill="#5DCAA5" opacity="0.25"/>
  <circle cx="750" cy="210" r="1" fill="#378ADD" opacity="0.2"/>

  <!-- ===== DRUPPEL op x=310, y=120 ===== -->
  <ellipse cx="310" cy="120" rx="60" ry="60" fill="#1a3a6e" opacity="0.5"/>
  <ellipse cx="310" cy="120" rx="46" ry="46" fill="#1a3a6e" opacity="0.4"/>
  <path d="M310 180 C282 180 259 157 259 129 C259 93 310 10 310 10 C310 10 361 93 361 129 C361 157 338 180 310 180 Z" fill="url(#dropBody)"/>
  <path d="M310 180 C282 180 259 157 259 129 C259 93 310 10 310 10 C310 10 361 93 361 129 C361 157 338 180 310 180 Z" fill="url(#dropShineL)"/>
  <path d="M259 145 C272 136 289 134 310 138 C331 134 348 136 361 145 C358 166 336 180 310 180 C284 180 262 166 259 145 Z" fill="url(#waveGrad)" opacity="0.95"/>
  <path d="M300 135 L305 109 L292 120 L308 81 L306 103 L322 92 L300 135 Z" fill="url(#flameGrad)"/>
  <path d="M310 10 C310 10 314 23 318 38 C314 31 310 25 310 25 C310 25 306 31 302 38 C306 23 310 10 310 10 Z" fill="#ffffff" opacity="0.3"/>

  <!-- ===== ICOON 1: Zonnepanelen ===== -->
  <line x1="259" y1="95" x2="78" y2="42" stroke="#EF9F27" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
  <circle cx="76" cy="41" r="2.5" fill="#EF9F27" opacity="0.9"/>
  <rect x="16" y="13" width="60" height="28" rx="2" fill="none" stroke="#EF9F27" stroke-width="1.2" opacity="0.85"/>
  <line x1="36" y1="13" x2="36" y2="41" stroke="#EF9F27" stroke-width="0.8" opacity="0.7"/>
  <line x1="56" y1="13" x2="56" y2="41" stroke="#EF9F27" stroke-width="0.8" opacity="0.7"/>
  <line x1="16" y1="27" x2="76" y2="27" stroke="#EF9F27" stroke-width="0.8" opacity="0.7"/>
  <line x1="46" y1="41" x2="46" y2="44" stroke="#EF9F27" stroke-width="1" opacity="0.5"/>

