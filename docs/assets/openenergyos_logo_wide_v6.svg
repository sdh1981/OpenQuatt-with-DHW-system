  <circle cx="56" cy="112" r="2.5" fill="#5DCAA5" opacity="0.9"/>
  <rect x="18" y="60" width="38" height="58" rx="7" fill="none" stroke="#5DCAA5" stroke-width="1.3" opacity="0.9"/>
  <line x1="22" y1="71" x2="52" y2="71" stroke="#5DCAA5" stroke-width="0.9" opacity="0.6"/>
  <line x1="22" y1="79" x2="52" y2="79" stroke="#5DCAA5" stroke-width="0.9" opacity="0.6"/>
  <line x1="22" y1="87" x2="52" y2="87" stroke="#5DCAA5" stroke-width="0.9" opacity="0.6"/>
  <line x1="22" y1="95" x2="52" y2="95" stroke="#5DCAA5" stroke-width="0.9" opacity="0.6"/>
  <line x1="22" y1="103" x2="52" y2="103" stroke="#5DCAA5" stroke-width="0.9" opacity="0.6"/>
  <line x1="22" y1="111" x2="52" y2="111" stroke="#5DCAA5" stroke-width="0.9" opacity="0.6"/>
  <path d="M37 64 C37 64 41 69 41 71.5 C41 74 39.2 75 37 75 C34.8 75 33 74 33 71.5 C33 69 37 64 37 64 Z" fill="#5DCAA5" opacity="0.7"/>
  <line x1="22" y1="118" x2="52" y2="118" stroke="#5DCAA5" stroke-width="1.2" opacity="0.5"/>

  <!-- ===== ICOON 3: Boiler ===== -->
  <line x1="259" y1="162" x2="58" y2="168" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
  <circle cx="56" cy="168" r="2.5" fill="#378ADD" opacity="0.9"/>
  <rect x="18" y="138" width="38" height="58" rx="0" fill="none" stroke="#378ADD" stroke-width="1.2" opacity="0.85"/>
  <ellipse cx="37" cy="138" rx="19" ry="5" fill="none" stroke="#378ADD" stroke-width="1.2" opacity="0.85"/>
  <ellipse cx="37" cy="196" rx="19" ry="5" fill="none" stroke="#378ADD" stroke-width="1.2" opacity="0.85"/>
  <line x1="27" y1="152" x2="18" y2="152" stroke="#378ADD" stroke-width="1" opacity="0.55"/>
  <line x1="47" y1="163" x2="56" y2="163" stroke="#378ADD" stroke-width="1" opacity="0.55"/>

  <!-- ===== ICOON 4: Batterij ===== -->
  <line x1="270" y1="178" x2="230" y2="200" stroke="#9FE1CB" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
  <circle cx="228" cy="201" r="2.5" fill="#9FE1CB" opacity="0.9"/>
  <rect x="160" y="190" width="66" height="32" rx="3" fill="none" stroke="#9FE1CB" stroke-width="1.2" opacity="0.85"/>
  <rect x="226" y="199" width="6" height="14" rx="2" fill="none" stroke="#9FE1CB" stroke-width="1" opacity="0.7"/>
  <rect x="163" y="194" width="17" height="24" rx="1" fill="#9FE1CB" opacity="0.7"/>
  <rect x="183" y="194" width="13" height="24" rx="1" fill="#9FE1CB" opacity="0.45"/>
  <rect x="199" y="194" width="9" height="24" rx="1" fill="#9FE1CB" opacity="0.2"/>

  <!-- ===== TEKST RECHTS ===== -->
  <text x="400" y="95" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" letter-spacing="-0.5" fill="url(#textGrad)">Open Energy</text>
  <text x="400" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="4" fill="#ffffff">OS</text>
  <rect x="400" y="173" width="200" height="1" fill="url(#subGrad)" opacity="0.6"/>
  <text x="400" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#7eb8d4" letter-spacing="0.5">for <tspan font-weight="700" fill="#5DCAA5">Open</tspan><tspan font-weight="700" fill="#378ADD">Quatt</tspan></text>
</svg>
